      const edgesFromT = T === start ? redges : [...redges].reverse();
      const down = T === ends.last ? 1 : -1;
      const pT = pos.get(T);
      inner.forEach((id, i) => { pos.set(id, pT + EPS * (i + 1) * down); laneOf.set(id, 0); });
      const pLast = pos.get(inner[inner.length - 1]), pU = pos.get(U);
      const back = freeLane(Math.min(pU, pLast), Math.max(pU, pLast), 0);
      edgesFromT.forEach((x, i) => placedEdges.push(i < edgesFromT.length - 1
        ? { ...x, lane: 0 } : { ...x, lane: back, thin: true }));
      if (T === ends.last) ends.last = null; else ends.first = null;   // once per end
      continue;
    }
    const dir = p1 >= p0 ? 1 : -1;
    const k0 = blockAt.get(start) || 0;
    interior.forEach((id, i) => pos.set(id, p0 + EPS * (k0 + i + 1) * dir));
    blockAt.set(start, k0 + interior.length);
    if (!rejoins) p1 = pos.get(end);
    /* TRACK WITH NO STATION OF ITS OWN shares one outer lane, drawn thin. Given a lane each,
       the freight bypasses around Tokyo took the Tohoku Line to 11 lanes; they count towards
       the line, but nobody boards or leaves a train on them. */
    if (!interior.length) { for (const x of redges) placedEdges.push({ ...x, lane: 'bypass' }); continue; }
    const lane = freeLane(Math.min(p0, p1), Math.max(p0, p1), 0);
    for (const id of interior) laneOf.set(id, lane);
    redges.forEach((x, i) => placedEdges.push({
      ...x, lane,
      // the run back to the station it rejoins at, past rows that are not on it
      thin: rejoins && i === redges.length - 1,
    }));
  }

  // Shortcuts beside a stopping route were set aside before layout (lineLayout), so what is
  // left in the bypass lane is track with no such route beside it: a freight line round a city.
  // Lanes taken by stations, or by a loop's thin way back, which has none.
  const stationLanes = 1 + Math.max(0, ...laneOf.values(),
    ...placedEdges.filter(e => typeof e.lane === 'number').map(e => e.lane));
  const bypass = placedEdges.some(e => e.lane === 'bypass');
  for (const e of placedEdges) if (e.lane === 'bypass') { e.lane = stationLanes; e.thin = true; }
  const rows = [...pos.keys()].sort((p, q) => pos.get(p) - pos.get(q))
    .map(id => ({ id, lane: laneOf.get(id) }));
  return { loop: false, rows, edges: placedEdges, lanes: stationLanes + (bypass ? 1 : 0) };
}

/* Where the lanes sit: lane 0's centre, and the step between lanes, in px. */
const STRIP_X0 = 11, STRIP_LANE = 13;
const laneX = L => STRIP_X0 + L * STRIP_LANE;

/* The rails and dots, as one SVG over the left of the rows, placed from where the rows
   actually are, since a name that wraps makes its row taller. Redrawn when the web font
   arrives or the panel is resized, both of which move rows. */
let STRIP_REDRAW = null;
function drawStrip(strip, line, lay, st) {
  if (!strip || !strip.isConnected) return;
  const old = strip.querySelector(':scope > svg');
  if (old) old.remove();
  const y = new Map();
  for (const row of strip.querySelectorAll('.st'))
    y.set(row.dataset.st, row.offsetTop + row.offsetHeight / 2);
  const capY = k => {
    const c = strip.querySelector(`[data-cap="${k}"]`);
    return c ? c.offsetTop + c.offsetHeight / 2 : null;
  };
  const own = lineColour(line), dim = dimmed(own, 0.30), dotDim = dimmed(own, 0.45);
  const colourOf = gid => (st.run(gid) ? THEME.run : st.ridden(gid) ? own : dim);
  const rank = c => (c === THEME.run ? 2 : c === own ? 1 : 0);
  const paths = [];                       // [colour, d], drawn dim first and white last

  /* A section from one station's row to another's, through lane L: straight down where
     all three lanes agree, otherwise a curve out into L below the first station and back
     above the second. */
  const route = (a, b, L) => {
    let ya = y.get(a.id), yb = y.get(b.id), la = a.lane, lb = b.lane;
    if (ya == null || yb == null) return null;
    if (ya > yb) { [ya, yb] = [yb, ya]; [la, lb] = [lb, la]; }
    const xa = laneX(la), xb = laneX(lb), xL = laneX(L);
    if (la === L && lb === L) return `M${xa} ${ya}V${yb}`;
    const h = Math.min(14, (yb - ya) / 2);
    const s = (x1, y1, x2, y2) => `C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}`;
    let d = `M${xa} ${ya}`;
    d += xa !== xL ? s(xa, ya, xL, ya + h) : '';
    d += xb !== xL ? `L${xL} ${yb - h}` + s(xL, yb - h, xb, yb) : `L${xL} ${yb}`;
    return d;
  };

  const dots = [];
  lay.pieces.forEach((piece, k) => {
    const at = new Map(piece.rows.map(r => [r.id, r]));
    for (const e of piece.edges) {
      const a = at.get(e.a), b = at.get(e.b);
      if (!a || !b) continue;
      const L = e.lane >= 0 ? e.lane : Math.max(a.lane, b.lane);
      const d = route(a, b, L);
      // A thin line in the unridden colour vanished against the panel; it gets the dots' one.
      const c = colourOf(e.gid);
      // Not running: dashed, and grey unless it was ridden before it closed.
      if (d && CLOSED.has(e.gid)) paths.push([c === dim ? THEME.stripGone : c, d, 3, '4 4']);
      else if (d) paths.push([e.thin && c === dim ? dotDim : c, d, e.thin ? 2 : 4]);
    }
    if (piece.loop) {
      // The section closing the loop, as the two caps curving away behind the list.
      const c = colourOf(piece.wrap.gid), x = laneX(0);
      const top = capY(`${k}t`), bot = capY(`${k}b`);
      const y0 = y.get(piece.rows[0].id), y1 = y.get(piece.rows[piece.rows.length - 1].id);
      if (top != null) paths.push([c, `M${x} ${y0}L${x} ${top + 4}Q${x} ${top - 4} ${x - 9} ${top - 4}`]);
      if (bot != null) paths.push([c, `M${x} ${y1}L${x} ${bot - 4}Q${x} ${bot + 4} ${x - 9} ${bot + 4}`]);
    }
    for (const r of piece.rows) {
      const row = strip.querySelector(`.st[data-st="${r.id}"]`);
      const pick = row && row.classList.contains('pick');
      const via = row && row.classList.contains('via');
      const jn = row && row.classList.contains('jn');
      const stroke = pick || via ? THEME.run : st.reached(r.id) ? own
        : row && row.classList.contains('gone') ? THEME.stripGone : dotDim;
      dots.push(`<circle cx="${laneX(r.lane)}" cy="${y.get(r.id)}" r="${jn ? 3 : 5}" `
        + `fill="${pick ? THEME.run : THEME.panel}" stroke="${stroke}" `
        + `stroke-width="${jn ? 1.5 : 2}"/>`);
    }
  });
  paths.sort((p, q) => rank(p[0]) - rank(q[0]));
  const w = laneX(lay.lanes - 1) + STRIP_X0, hgt = strip.scrollHeight;
  strip.insertAdjacentHTML('afterbegin',
    `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}">`
    + paths.map(([c, d, sw, dash]) => `<path d="${d}" fill="none" stroke="${c}" `
      + `stroke-width="${sw || 4}" stroke-linecap="${dash ? 'butt' : 'round'}"`
      + `${dash ? ` stroke-dasharray="${dash}"` : ''}/>`).join('')
    + dots.join('') + `</svg>`);
}
if (document.fonts) document.fonts.ready.then(() => STRIP_REDRAW && STRIP_REDRAW());
window.addEventListener('resize', () => STRIP_REDRAW && STRIP_REDRAW());

/* The line that joins two pieces of this one, where one does: a counted line calling at a
   station of each, the shortest if several. The register splits lines by their legal
   name, so the 予讃線's inland route is two pieces joined by the 内子線 from 内子 to 新谷,
   and read as a line with a hole in it until the gap said so (Anita, 2026-09-30). */
function joinedBy(line, p, q) {
  const at = piece => {
    const s = new Set();
    for (const r of piece.rows) for (const id of (STATIONS[r.id] || {}).l || []) s.add(id);
    return s;
  };
  const a = at(p);
  let best = null;
  for (const id of at(q)) {
    const l = LINE_BY_ID.get(id);
    if (!a.has(id) || id === line.id || !l || !listed(l)) continue;
    if (!best || l.km < best.km) best = l;
  }
  return best;
}

/* The same at a dead end within one piece: the 予讃線's inland route stops at 内子, and its
   spur off 伊予大洲 stops at 新谷, and the 内子線 joins the two. For each end of track, the
   shortest listed line from there to another end of this one, as {line, to}. */
function endJoins(line) {
  if (line._ends) return line._ends;
  const deg = new Map();
  for (const [a, b] of line.sections) for (const s of [a, b]) deg.set(s, (deg.get(s) || 0) + 1);
  const ends = [...deg].filter(([, n]) => n === 1).map(([s]) => s);
  const out = new Map();
  for (const s of ends) {
    let best = null;
    for (const lid of (STATIONS[s] || {}).l || []) {
      const l = LINE_BY_ID.get(lid);
      if (!l || l === line || !listed(l)) continue;
      const on = lineStations(l);
      /* A short link only. Without the cap, 東京 read "to 熱海 by the 東海道新幹線", since
         both ends of the JR East 東海道線 are on it. */
      for (const to of ends) {
        if (to === s || !on.has(to)) continue;
        const p = pathBetween(l, s, to);
        if (p && p.km <= 25 && (!best || p.km < best.km)) best = { line: l, to, km: p.km };
      }
    }
    if (best) out.set(s, best);
  }
  return (line._ends = out);
}

/* The strip diagram: the rows are names, and the rails and dots are drawn over them. */
function renderLine(el) {
  const line = LINE_BY_ID.get(VIEW.id);
  if (!line) { VIEW = { kind: 'home' }; return render(); }
  const frac = creditRanges();
  const lay = lineLayout(line);

  const run = pickedRun();
  const pathSet = new Set(run && run.p ? run.p.gids : []);
  // A run over a shortcut left out of the drawing lights up the way beside it instead.
  for (const [gid, alt] of lay.hidden) if (pathSet.has(gid)) alt.forEach(g => pathSet.add(g));
  const inRun = pathStations([...pathSet]);

  const running = line.sections.filter(s => !CLOSED.has(s[3]));
  const done = running.reduce((n, s) => n + (frac.get(s[3]) > 0.999 ? 1 : 0), 0);
  const riddenKm = lineKm(line, frac);
  const closedNote = line.km_closed
    ? ` · ${line.km_closed.toFixed(1)} km no longer running` : '';

  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button>`
    + `<button class="act" onclick="fitLine('${line.id}')">zoom to line</button>`
    + `<button class="act" onclick="rideWhole('${line.id}')">rode all</button></div>`
    + `<h2 class="sec">Line</h2>`
    + `<div class="big" style="font-size:19px">`
    + `<span class="bar" style="background:${lineColour(line)}"></span>${esc(lineName(line))}`
    + `<small>${esc(opName(line) || 'operator not stated')}`
    + ` · ${line.km.toFixed(1)} km · ${running.length} sections${closedNote}`
    + (line.parts && line.parts.length > 1 ? ` · in ${esc(line.regions.map(regionName).join(', '))}` : '')
    + `</small></div>`;
  /* Each piece of track belongs to one line, and only that line counts it in the totals.
     Say so where this line's own share is not the whole of it. */
  const own = partsOf(line).reduce((s, p) => s + ownedKm(p), 0);
  const note = t => { h += `<p class="muted" style="margin-top:8px">${t}</p>`; };
  if (line.service) {
    note(`This is a named train rather than a line, so it owns no track and is not counted `
      + `towards a total of its own. Riding it credits the lines whose track it runs over.`);
  } else if (!isRegisterLine(line)) {
    if (!listed(line)) {
      note(`This service runs mostly over register lines, so it is not listed as a line of `
        + `its own. Riding it credits the lines whose track it runs over.`
        + (own > 0.05 ? ` The ${own.toFixed(1)} km no register line covers belong to it and `
          + `count towards the totals.` : ''));
    } else if (own < 0.95 * line.km) {
      note(`${(line.km - own).toFixed(1)} km of this line runs over track that belongs to `
        + `other lines and counts towards those: register lines, or where several lines `
        + `share track no register covers, the one with the lowest number. The other `
        + `${own.toFixed(1)} km belongs to this line and counts towards the totals as it.`);
    }
  } else if (line.km > 0.05 && !listed(line)) {
    note(`All of this line lies on track that belongs to another register line, so it is `
      + `not listed as a line of its own. Riding it counts towards that line.`);
  } else if (line.km > 0.05 && own < 0.95 * line.km) {
    note(`${(line.km - own).toFixed(1)} km of this line lies on track that belongs to `
      + `another register line, and counts towards that one. The other ${own.toFixed(1)} km `
      + `counts as this line.`);
  }
  h += `<div class="meter" style="margin-top:8px"><i style="width:`
    + `${Math.min(100, 100 * riddenKm / Math.max(line.km, 0.001)).toFixed(1)}%"></i></div>`
    + `<div class="o muted">${riddenKm.toFixed(1)} of ${line.km.toFixed(1)} km ridden`
    + ` · ${done} of ${running.length} sections</div>`;
  if (line.km_closed) {
    h += `<p class="muted" style="margin-top:8px">The dashed part is still on the register `
      + `but has no rails on the map: closed, suspended or replaced by a bus. It does not `
      + `count towards the line, and a ride from before can still be entered on it.</p>`;
  }

  // A station is reached when any section of this line beside it has been ridden.
  const reached = new Set();
  for (const [a, b, km, gid] of line.sections)
    if ((frac.get(gid) || 0) > 0.999) { reached.add(a); reached.add(b); }
  // Stations no train calls at: no running section of this line beside them, nor of any
  // other line there (夜明, the 日田彦山線's end, is on the running 久大線).
  const joins = endJoins(line);
  const live = new Set(running.flatMap(s => [s[0], s[1]]));
  const gone = id => line.km_closed && !live.has(id)
    && !((STATIONS[id] || {}).l || []).some(lid => {
      const l = LINE_BY_ID.get(lid);
      return l && l !== line
        && l.sections.some(s => (s[0] === id || s[1] === id) && !CLOSED.has(s[3]));
    });

  if (VIEW.also && VIEW.also.length) {
    const others = VIEW.also.map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
    h += `<p class="muted" style="margin:8px 0 0">Also on this track: `
      + others.map(l => `<a href="" class="also" style="--c:${lineColour(l)}" `
        + `onclick="showLine('${l.id}'); return false">${esc(lineName(l))}</a>`).join(', ')
      + `</p>`;
  }
  h += `<div id="strip" style="--c:${lineColour(line)};`
    + `--w:${STRIP_X0 * 2 + (lay.lanes - 1) * STRIP_LANE}px">`;
  lay.pieces.forEach((piece, k) => {
    if (k) {
      const via = joinedBy(line, lay.pieces[k - 1], piece);
      // A line over a border: the next piece is another country's.
      const cc = id => (STATIONS[id] || {}).region;
      const was = cc(lay.pieces[k - 1].rows[0].id), now = cc(piece.rows[0].id);
      h += `<div class="stgap">` + (via
        ? `joined by <a href="" class="also" style="--c:${lineColour(via)}" onclick="showLine(`
          + `'${via.id}'); return false">${esc(lineName(via))}</a>`
        : line.parts && was && now && was !== now ? `continues in ${esc(regionName(now))}`
        : `the line continues elsewhere`) + `</div>`;
    }
    if (piece.loop) h += `<div class="loopcap top" data-cap="${k}t"><b>continues round</b></div>`;
    for (const { id } of piece.rows) {
      const end = PICK.from === id || PICK.to === id;
      const cls = [reached.has(id) ? 'reached' : '', inRun.has(id) || end ? 'in' : '',
                   end ? 'pick' : inRun.has(id) ? 'via' : ''].filter(Boolean).join(' ');
      const alt = stAlt(id);
      // A junction or border point: a row, since the line runs through it, but no stop.
      const junction = !isStop(id);
      const note = [alt, gone(id) ? 'no trains' : ''].filter(Boolean).join(' · ');
      const join = joins.get(id);
      // The link stops the click reaching the row, which would pick the station instead.
      const joinNote = join ? `<i>to ${esc(stName(join.to))} by <a href="" class="also" `
        + `style="--c:${lineColour(join.line)}" onclick="event.stopPropagation(); `
        + `showLine('${join.line.id}'); return false">${esc(lineName(join.line))}</a></i>` : '';
      h += `<div class="st ${cls}${junction ? ' jn' : ''}${gone(id) ? ' gone' : ''}" data-st="${id}"`
        + `${junction ? '' : ` onclick="pickStop('${id}')"`}>`
        + `<div class="nm">${esc(stName(id))}${junction ? '<i>junction, not a stop</i>'
          : note ? `<i>${esc(note)}</i>` : ''}${joinNote}</div></div>`;
    }
    if (piece.loop) h += `<div class="loopcap bottom" data-cap="${k}b"><b>back to `
      + `${esc(stName(piece.rows[0].id))}</b></div>`;
  });
  h += `</div>`;

  if (run) {
    h += `<div id="addbar">`;
    if (!run.p) {
      h += `<p class="muted">No run of sections joins those two on this line.</p>`;
    } else {
      h += `<div class="o" style="margin-bottom:6px">${esc(stName(PICK.from))} → `
        + `${esc(stName(PICK.to))} · ${run.p.km.toFixed(1)} km</div>`;
      /* Offered only where there IS another way: on a loop, or where a line's branches
         close into one. The short way is the default because it is nearly always meant. */
      if (run.alt) {
        h += `<label><input type="checkbox" ${run.around ? 'checked' : ''} `
          + `onchange="setAround(this.checked)" />went the other way round, `
          + `${run.alt.km.toFixed(1)} km rather than ${run.short.km.toFixed(1)}</label>`;
      }
      h += `<div class="btnrow"><input type="date" id="ridedate" `
        + `value="${esc(LAST_DATE)}" />`
        + `<button class="act go" onclick="commitRide()">Add ride</button>`
        + `<button class="act" onclick="clearPick()">clear</button></div>`;
    }
    h += `</div>`;
  }
  el.innerHTML = h;

  STRIP_REDRAW = () => drawStrip(el.querySelector('#strip'), line, lay, {
    ridden: gid => (frac.get(gid) || 0) > 0.999,
    run: gid => pathSet.has(gid),
    reached: id => reached.has(id),
  });
  STRIP_REDRAW();

  /* Keep the station you got on at in view. Picking it on the MAP is now a way in, and the
     line it belongs to can be two hundred stops long, so the diagram would otherwise be
     showing some unrelated stretch of it. */
  if (PICK.from) {
    const row = el.querySelector(`.st[data-st="${PICK.from}"]`);
    if (row) row.scrollIntoView({ block: 'nearest' });
  }
}

function pickStop(id) {
  if (!PICK.from || (PICK.from && PICK.to)) PICK = { from: id, to: null, around: false };
  else if (id === PICK.from) PICK = { from: null, to: null, around: false };
  else { PICK.to = id; PICK.around = false; }
  render();
  paintSelection();
}
function clearPick() {
  PICK = { from: null, to: null, around: false };
  render();
  paintSelection();
}
function setAround(on) { PICK.around = on; render(); paintSelection(); }

function wholeRide(line, date) {
  const ends = line.display.length ? line.display : line.sections.map(s => s[0]);
  return newRide(line.id, ends[0], ends[ends.length - 1], date || '', { whole: true });
}

function rideWhole(lineId) {
  const line = LINE_BY_ID.get(lineId);
  if (!line) return;
  addRides([wholeRide(line)], `Added all of ${lineName(line)}`);
  PICK = { from: null, to: null, around: false };
  render();
  paintSelection();
}

function commitRide() {
  const run = pickedRun();
  if (!run || !run.p || PICK.from === PICK.to) return;
  const d = document.getElementById('ridedate');
  const arrived = PICK.to;
  LAST_DATE = d ? d.value : '';
  addRide(VIEW.id, PICK.from, PICK.to, LAST_DATE, { around: run.around });
  /* Hand back to the STATION arrived at, not to the line just ridden. The next leg nearly
     always starts by choosing a different line, and staying on the old one meant backing
     out of it first. */
  showStation(arrived);
}

// ---------------------------------------------------------------- search

/* Strip accents before matching. Station names come romanised as Tōkyō, Ōedo, Myōgadani,
   so a plain substring search for "tokyo" matched the line named "Tokyo Metro ..." and every
   other line with Tokyo in its operator, and never the station itself. */
const norm = s => String(s || '').normalize('NFD')
  .replace(/[̀-ͯ]/g, '').toLowerCase().trim();

/* Ranked, not just filtered: an exact name beats a name that starts with the word, which
   beats a mention anywhere including in the operator. Without this, "tokyo" filled up with
   the two hundred lines run by Tokyo Metro and Tokyo Metropolitan Bureau of Transportation
   before ever reaching Tokyo station. */
function score(q, primary, secondary, all) {
  if (q === primary || q === secondary) return 3;
  for (const n of [primary, secondary]) {
    if (!n) continue;
    if (n.startsWith(q)) return 2;
    if (n.split(/\s+/).some(w => w.startsWith(q))) return 2;
  }
  return all.includes(q) ? 1 : 0;
}

function search(raw) {
  let q = norm(raw);
  if (!q) return [];
  // "tokyo station" means the station. "yamanote line" means the line.
  let want = null;
  if (/\bstations?\b/.test(q)) { want = 'station'; q = q.replace(/\bstations?\b/g, ' '); }
  else if (/\blines?\b/.test(q)) { want = 'line'; q = q.replace(/\blines?\b/g, ' '); }
  q = q.replace(/\s+/g, ' ').trim();
  if (!q) return [];

  const out = [];
  if (want !== 'station') {
    for (const l of LINES) {
      const sc = score(q, l._n, l._n2, l._k);
      if (sc) out.push({ kind: 'line', l, sc, w: l.km });
    }
  }
  if (!want) {
    OPS.forEach((o, i) => {
      const sc = score(q, o._n, '', o._k);
      if (sc) out.push({ kind: 'op', o, i, sc, w: o.km });
    });
  }
  if (want !== 'line') {
    for (const [id, s] of Object.entries(STATIONS)) {
      if (s.j) continue;
      const sc = score(q, s._n, s._n2, s._k);
      if (sc) out.push({ kind: 'station', id, s, sc, w: (s.l || []).length });
    }
  }
  out.sort((a, b) => (b.sc - a.sc) || (b.w - a.w));
  return out.slice(0, 14);
}

function runSearch() {
  const q = document.getElementById('q').value;
  const hits = search(q);
  const el = document.getElementById('results');
  if (!hits.length) { el.innerHTML = ''; return; }
  el.innerHTML = hits.map(h => h.kind === 'line'
    ? `<div class="hit" onclick="pickHit('line','${h.l.id}')">`
      + `<div class="t"><span class="bar" style="background:${lineColour(h.l)}"></span>`
      + `${esc(lineName(h.l))}</div>`
      + `<div class="s">${esc(opName(h.l))} · `
      + `${h.l.km.toFixed(0)} km${h.l.service ? ' · named train' : ''}</div></div>`
    : h.kind === 'op'
    ? `<div class="hit" onclick="pickHit('op','${h.i}')">`
      + `<div class="t">${esc(h.o.key)}</div>`
      + `<div class="s">operator · ${h.o.lines.length} line${h.o.lines.length === 1 ? '' : 's'}`
      + ` · ${Math.round(h.o.km).toLocaleString()} km</div></div>`
    : `<div class="hit" onclick="pickHit('station','${h.id}')">`
      + `<div class="t">${esc(h.s.e || h.s.n)}</div>`
      + `<div class="s">station · ${(h.s.l || []).length} line`
      + `${(h.s.l || []).length === 1 ? '' : 's'}</div></div>`).join('');
}

function pickHit(kind, id) {
  document.getElementById('q').value = '';
  document.getElementById('results').innerHTML = '';
  if (kind === 'line') showLine(id);
  else if (kind === 'op') showOp(+id);
  else {
    const s = STATIONS[id];
    if (s) map.easeTo({ center: [s.x, s.y], zoom: Math.max(map.getZoom(), 12), duration: 0 });
    // While tracing, a searched station is the next stop, not a place to go and look at.
    if (VIEW.kind === 'trace') traceAdd(id);
    else showStation(id);
  }
}

// ---------------------------------------------------------------- export / import

function exportRides() {
  // Every country's rides, each carrying its own `region`.
  const blob = new Blob([JSON.stringify({ v: 1, rides: RIDES }, dropCache, 1)],
                        { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `noritetsu-rides-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importRides(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const parsed = JSON.parse(rd.result);
      const incoming = parsed.rides || [];
      if (!Array.isArray(incoming)) throw new Error('no rides array');
      // Merged by id, not replaced: importing a file from another device should add to what
      // is here rather than silently discard it.
      const have = new Set(RIDES.map(r => r.id));
      const fresh = [];
      for (const r of incoming) {
        if (!r || !r.line || !r.from || !r.to) continue;
        if (r.id && have.has(r.id)) continue;
        const ride = { ...r, id: r.id || ('r' + Math.random().toString(36).slice(2, 9)) };
        // Files from before regions existed say the region once, at the top, or not at all.
        ride.region = r.region || parsed.region || 'jp';
        // A file exported before a rebuild names stations and lines by their old ids.
        if (LOADED.has(ride.region)) migrateRide(ride);
        else loadRegion(ride.region);   // its lines are needed to draw and count it
        delete ride._gids;
        fresh.push(ride);
      }
      const added = fresh.length;
      addRides(fresh, `Imported ${added} ride${added === 1 ? '' : 's'}`);
      alert(`Imported ${added} ride${added === 1 ? '' : 's'}.`);
    } catch (e) {
      alert('That file does not look like a noritetsu export.');
    }
    input.value = '';
  };
  rd.readAsText(f);
}

// ---------------------------------------------------------------- map interaction

/* HOW FAR FROM A LINE A CLICK STILL COUNTS, in pixels. Measured 2026-09-30 before this
   existed: a click had to land within about 4 px of the line at z11, so most near misses
   did nothing. Now a box this size around the click is searched and the nearest line in
   it wins. */
const CLICK_SLOP = 10;

map.on('click', (e) => {
  const hits = map.queryRenderedFeatures(e.point, { layers: ['sel-station', 'station'] });
  const tracing = VIEW.kind === 'trace';
  const near = hits.length ? [] : tracksNear(e.point, CLICK_SLOP);
  // Nothing near the cursor at all: clear the selection. Not while tracing, where a missed
  // station would otherwise throw the whole journey away.
  if (!hits.length && !near.length) return tracing ? undefined : goHome();

  const st = hits[0];
  if (st) {
    /* Both station layers are built from the model and carry their own id. The nearest
       lookup is a backstop for a click that lands on a feature from an older build. */
    let id = st.properties.id || null;
    if (!id || !STATIONS[id]) id = nearestStation(e.lngLat.lng, e.lngLat.lat, 400);
    if (!id) return;
    if (tracing) return traceAdd(id);

    // With a line open, a station on it sets the ends of the trip, same as the diagram.
    if (VIEW.kind === 'line') {
      const line = LINE_BY_ID.get(VIEW.id);
      if (line && lineStations(line).has(id)) return pickStop(id);
    }
    return showStation(id);
  }
  if (tracing) return;
  // Not-running track is drawn from the model, and names its line.
  if (near[0].layer.id === 'closed-hit') return showLine(near[0].properties.l);
  const withWay = near.find(f => f.properties.w);
  if (withWay) pickTrack(withWay);
  else pickByChord(e.point);
});

/* Track features in a box around the point, nearest first by their drawn geometry. */
function tracksNear(p, r) {
  const layers = hitLayers();
  if (!layers.length) return [];      // an empty list would query every layer on the map
  const feats = map.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers });
  const dist = f => {
    const g = f.geometry;
    const runs = g.type === 'LineString' ? [g.coordinates]
      : g.type === 'MultiLineString' ? g.coordinates : [];
    let best = Infinity;
    for (const run of runs) {
      let prev = null;
      for (const c of run) {
        const q = map.project(c);
        if (prev) best = Math.min(best, segDist(p, prev, q));
        prev = q;
      }
    }
    return best;
  };
  return feats.map(f => ({ f, d: dist(f) })).filter(x => x.d <= r)
    .sort((a, b) => a.d - b.d).map(x => x.f);
}

// How far along the segment a..b (0 to 1) the point nearest p is.
function segT(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
  return len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
}
function segDist(p, a, b) {
  const t = segT(p, a, b);
  return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
}

/* The point of a drawn section nearest the click: its distance on screen, and how far along
   the section (0 to 1) it is. Lengths on the same local flat projection as sliceLine, which
   is how the build measures foot.json's fractions. */
function nearOnTrack(pts, p) {
  if (!pts || pts.length < 2) return null;
  const kx = Math.cos(pts[0][1] * Math.PI / 180);
  let cum = 0, best = Infinity, at = 0, prev = map.project(pts[0]);
  for (let i = 1; i < pts.length; i++) {
    const q = map.project(pts[i]);
    const len = Math.hypot((pts[i][0] - pts[i - 1][0]) * kx, pts[i][1] - pts[i - 1][1]);
    const d = segDist(p, prev, q);
    if (d < best) { best = d; at = cum + segT(p, prev, q) * len; }
    cum += len;
    prev = q;
  }
  return cum ? { d: best, f: at / cum } : null;
}

/* EVERY LINE OVER THE TRACK AT ONE POINT OF A SECTION, `t` along it: from the footprints
   (foot.json), not from where lines are drawn. The section's footprint names the owner track
   there; every section whose footprint covers that point of the owner track is on it, named
   trains and lines over a border included. Within `tolKm` of the point, either way.
   Null where the country has no footprints. */
function linesOverTrack(gid, t, tolKm) {
  if (!FOOT_REGIONS.has(regionOfGid(gid))) return null;
  const tolOf = g => tolKm / Math.max(secKm(g), 0.001);
  const fp = footOf(gid);
  const tol = tolOf(gid);
  let at = fp.filter(e => t >= Math.min(e[3], e[4]) - tol && t <= Math.max(e[3], e[4]) + tol);
  if (!at.length) at = fp;
  const out = new Set();
  for (const [own, from, to, a, b] of at) {
    const k = b > a ? Math.max(0, Math.min(1, (t - a) / (b - a))) : 0.5;
    const u = from + k * (to - from), ut = tolOf(own);
    const covers = (lo, hi) => u >= Math.min(lo, hi) - ut && u <= Math.max(lo, hi) + ut;
    const oe = SEC_BY_GID.get(own);
    if (oe && !FOOT.has(own)) out.add(oe.line.id);       // the owner track's own line
    for (const g of FOOT_INTO.get(own) || []) {
      const e = SEC_BY_GID.get(g);
      if (e && footOf(g).some(([o, f2, t2]) => o === own && covers(f2, t2))) out.add(e.line.id);
    }
  }
  return [...out];
}

/* BELOW z10 THE TILES CARRY NO WAY ID, only merged chains, so a click there used to do
   nothing at all. It is resolved from the model instead. Parallel lines are
   indistinguishable this far out, so the nearest listed line opens (a register line first
   among those within a few pixels of each other). Only where no listed line is near at all
   is the choice offered as a list.
   NEAREST BY THE DRAWN TRACK, where a chord will not do. Each section is first measured as
   a straight line between its two stations, which for a short section sits within a few
   pixels of the track. A long one can bow far from its chord: Belgium's HSL 1 is two
   sections, Halle to the French border 74.5 km, and a click on it at Enghien was nearer the
   chord of the old line 94 beside it. So a listed line with a long chord anywhere near is
   measured again on its drawn geometry (the same files a selected line draws from).
   WHAT ELSE RUNS THERE comes from the footprints at the clicked point of the opened line's
   section (linesOverTrack), not from chords: the Eurostar's one section from Brussels-Midi
   to the French border, 87.6 km, was never near a click on HSL 1. Lines drawn within
   SAME_TRACK_PX of the opened one are listed too, with what runs over them. */
let CHORD_GEN = 0;
const LONG_CHORD = 30;    // px: a chord longer than this is checked against its drawn track
const SAME_TRACK_PX = 1.5;  // px: lines this much further than the nearest are the same track
const MAX_MEASURED = 12;    // listed lines measured on their drawn track per click, at most
async function pickByChord(p) {
  const gen = ++CHORD_GEN;
  const b = map.getBounds().toArray();
  const pad = 0.2 * (b[1][0] - b[0][0]);
  const inView = s => s && s.x > b[0][0] - pad && s.x < b[1][0] + pad
    && s.y > b[0][1] - pad && s.y < b[1][1] + pad;
  const proj = new Map();
  const at = id => {
    if (!proj.has(id)) proj.set(id, map.project([STATIONS[id].x, STATIONS[id].y]));
    return proj.get(id);
  };
  const reach = CLICK_SLOP + 4;
  // line id -> its nearest section: [distance, section, how far along it]
  const best = new Map();
  const bowed = new Map();          // listed line id -> long sections that may be near
  const keep = (id, d, sec, t) => {
    if (d < (best.has(id) ? best.get(id)[0] : Infinity)) best.set(id, [d, sec, t]);
  };
  const z = map.getZoom();
  for (const line of LINES) {
    // Only kinds the tiles draw at this zoom: a tram under a main line is not what was hit.
    const k = KIND_LABEL[line.kind === 'train' ? 'rail' : line.kind];
    if (k && z < k[1]) continue;
    let isListed = null;
    for (const sec of line.sections) {
      const [a, c] = sec;
      if (!inView(STATIONS[a]) && !inView(STATIONS[c])) continue;
      if (!STATIONS[a] || !STATIONS[c]) continue;
      const A = at(a), C = at(c);
      const d = segDist(p, A, C), len = Math.hypot(C.x - A.x, C.y - A.y);
      // A track rarely bows from its chord by more than a quarter of the chord's length.
      if (len > LONG_CHORD && d <= reach + 0.25 * len) {
        if (isListed === null) isListed = listed(line);
        if (isListed) {
          if (!bowed.has(line.id)) bowed.set(line.id, { d, secs: [] });
          const bw = bowed.get(line.id);
          bw.d = Math.min(bw.d, d);
          bw.secs.push(sec);
          continue;
        }
      }
      keep(line.id, d, sec, segT(p, A, C));
    }
  }
  // Where there is no drawn track to measure: the chord, as before.
  const byChord = (id, sec) => {
    const A = at(sec[0]), C = at(sec[1]);
    keep(id, segDist(p, A, C), sec, segT(p, A, C));
  };
  // The nearest few by chord: zoomed out over China, dozens of long sections can qualify.
  const toMeasure = [...bowed].sort((x, y) => x[1].d - y[1].d);
  for (const [id, { secs }] of toMeasure.slice(MAX_MEASURED)) secs.forEach(s => byChord(id, s));
  await Promise.all(toMeasure.slice(0, MAX_MEASURED).map(([id, { secs }]) => geomFor(id)
    .then(g => {
      for (const sec of secs) {
        const fwd = g[`${sec[0]}|${sec[1]}`], back = g[`${sec[1]}|${sec[0]}`];
        const r = nearOnTrack(fwd || back, p);
        if (r) keep(id, r.d, sec, fwd ? r.f : 1 - r.f);
        else byChord(id, sec);
      }
    })
    .catch(() => secs.forEach(s => byChord(id, s)))));
  if (gen !== CHORD_GEN) return;          // a later click won
  const min = Math.min(...[...best.values()].map(x => x[0]));
  if (!(min <= reach)) return;
  const near = [...best].filter(([, x]) => x[0] <= reach);
  const lst = near.filter(([id]) => listed(LINE_BY_ID.get(id)));
  if (!lst.length)
    return openTrackLines(near.filter(([, x]) => x[0] <= min + 4).map(([id]) => id));
  const m = Math.min(...lst.map(([, x]) => x[0]));
  const pool = lst.filter(([, x]) => x[0] <= m + 4);
  const reg = pool.filter(([id]) => isRegisterLine(LINE_BY_ID.get(id)));
  const [owner, [od]] = (reg.length ? reg : pool).reduce((a, b) => (b[1][0] < a[1][0] ? b : a));
  /* Track a pixel or so apart cannot be told apart at this zoom (Brussels - Leuven is line
     36 and line 36N side by side), so what runs over each of those is listed, with the
     lines themselves. */
  const same = pool.filter(([, x]) => x[0] <= od + SAME_TRACK_PX);
  const over = same.map(([id, [, sec, t]]) => linesOverTrack(sec[3], t, 2));
  const ids = over.every(Boolean)
    ? [...new Set([owner, ...same.map(([id]) => id), ...over.flat()])].filter(id => LINE_BY_ID.has(id))
    : near.filter(([, x]) => x[0] <= m + 4).map(([id]) => id);
  openTrackLines(ids, owner);
}

/* Clicking a piece of track opens the line that owns it (ownership.py gives every drawn way
   one owner), with every other line over it listed under it. The way id is only carried at
   z10 and above, because below that the tiles hold merged chains rather than individual
   ways and there is no single way to name.
   ways.json gives each way the indices of the lines over it, THE OWNER FIRST (build_model.main
   writes it so). A way with no owner keeps its list in index order, and is either listed in
   `unowned` or starts with a named train, which never owns. A ways.json from before owners
   has no `unowned` at all, and then no owner is read from it. */
const WAYS = new Map();     // cc -> promise of that country's ways.json
async function pickTrack(feature) {
  const w = feature.properties.w;
  if (!w) return;
  const cc = feature.layer.id.replace('track-hit-', '');
  if (!WAYS.has(cc)) {
    // 1-2 MB a country, so it is fetched the first time someone clicks a line there.
    WAYS.set(cc, fetch(`data/${cc}/ways.json`).then(r => r.json())
      .then(j => ({ ...j, free: Array.isArray(j.unowned) ? new Set(j.unowned) : null }))
      .catch(() => { WAYS.delete(cc); return { lines: [], ways: {}, free: null }; }));
  }
  // A click can land on a country whose tiles are in but whose lines are still arriving.
  const [ways] = await Promise.all([WAYS.get(cc), loadRegion(cc)]);
  const idxs = ways.ways[String(w)];
  if (!idxs || !idxs.length) return;
  // Folded as the lines were (LINE_FOLD), the owner still first.
  const ids = [...new Set(idxs.map(i => foldLine(ways.lines[i])))];
  const first = LINE_BY_ID.get(ids[0]);
  const owner = ways.free && !ways.free.has(String(w)) && first && !first.service
    ? ids[0] : null;
  openTrackLines(ids.filter(id => LINE_BY_ID.has(id)), owner);
}

/* `owner`: the line to open, the others listed under it as also on this track. Without one
   (track no line owns), the one line there opens, or where exactly one REGISTER line runs
   over the track that one, since it is almost always the line meant; clicking the San'in
   coast gives 山陰線 rather than a choice between it and スーパーおき. Otherwise a list. */
function openTrackLines(ids, owner) {
  if (!ids.length) return;
  // A register line that owns nothing (a companion track) cannot own a way; guarded anyway.
  const ol = owner && LINE_BY_ID.get(owner);
  if (!ol || (isRegisterLine(ol) && !listed(ol))) {
    const reg = ids.filter(id => isRegisterLine(LINE_BY_ID.get(id)));
    owner = ids.length === 1 ? ids[0] : reg.length === 1 ? reg[0] : null;
  }
  if (owner) {
    showLine(owner);
    const also = ids.filter(id => id !== owner);
    if (!also.length) return;
    VIEW.also = also;
    return render();
  }
  VIEW = { kind: 'pick', ids };
  openPanel(true);
  render();
  paintSelection();
}

function renderPick(el) {
  const lines = VIEW.ids.map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button></div>`
    + `<h2 class="sec">${lines.length} lines run over this track</h2>`;
  const frac = creditRanges();
  for (const l of lines) h += lineRow(l, lineKm(l, frac), { operator: true });
  el.innerHTML = h;
}

/* Hovering a station says what it is and what calls there, so a dense area can be read
   without clicking through every dot. Three lines and a count, in the order the panel uses:
   register lines first, then patterns, then named trains. */
const hoverPop = new maplibregl.Popup({
  closeButton: false, closeOnClick: false, offset: 10, maxWidth: '240px',
});

function showHover(e) {
  const f = e.features && e.features[0];
  const id = f && f.properties.id;
  const s = id && STATIONS[id];
  if (!s) { hoverPop.remove(); return; }
  const lines = (s.l || []).map(x => LINE_BY_ID.get(x)).filter(Boolean).sort(lineOrder);
  const alt = s.e && s.n && s.e !== s.n ? `<div class="jp">${esc(s.n)}</div>` : '';
  const top = lines.slice(0, 3).map(l =>
    `<span class="pl" style="border-left-color:${lineColour(l)}">${esc(lineName(l))}</span>`
  ).join('');
  const more = lines.length > 3
    ? `<div class="more">and ${lines.length - 3} more</div>` : '';
  const none = lines.length ? '' : '<div class="more">no line in the model calls here</div>';
  hoverPop.setLngLat(f.geometry.coordinates)
    .setHTML(`<b>${esc(s.e || s.n)}</b>${alt}${top}${more}${none}`)
    .addTo(map);
}

for (const layer of ['station', 'sel-station']) {
  map.on('mousemove', layer, showHover);
  map.on('mouseleave', layer, () => hoverPop.remove());
}

/* A pointer wherever a click would do something: over a station, or within CLICK_SLOP of
   a line. Once per frame at most, since a box query on every mousemove is not free. */
let cursorPending = null;
map.on('mousemove', e => {
  if (cursorPending) { cursorPending = e.point; return; }
  cursorPending = e.point;
  requestAnimationFrame(() => {
    const p = cursorPending;
    cursorPending = null;
    if (!mapReady) return;
    const r = CLICK_SLOP;
    const layers = hitLayers();
    const on = map.queryRenderedFeatures(p, { layers: ['station', 'sel-station'] }).length
      || (VIEW.kind !== 'trace' && layers.length && map.queryRenderedFeatures(
        [[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers }).length);
    map.getCanvas().style.cursor = on ? 'pointer' : '';
  });
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('q').addEventListener('input', runSearch);

loadRides();
bootUi();
render();
// Countries load from startRegions once the map is up, and then as the camera moves.
REGIONS_READY.then(() => {
  render();                  // the headline can name the country now
  if (!Object.keys(REGIONS).length) {
    document.getElementById('panel-body').innerHTML = `<p class="muted" style="margin-top:14px">`
      + `Could not load regions.json, so no country knows where it is. Run `
      + `tools/build_regions.py.</p>`;
  }
});
</script>
</body>
</html>
