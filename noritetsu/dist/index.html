   A parallel section with the same two ends is not another way round, just the register
   listing the same stretch twice, so an answer with no station of its own is refused. */
function pathAround(line, from, to) {
  const short = pathBetween(line, from, to);
  if (!short || !short.gids.length) return null;
  const avoidSt = new Set(), own = new Set();
  for (const gid of short.gids) {
    const e = SEC_BY_GID.get(gid);
    if (e) { avoidSt.add(e.sec[0]); avoidSt.add(e.sec[1]); }
  }
  avoidSt.delete(from); avoidSt.delete(to);
  const alt = pathBetween(line, from, to, avoidSt, new Set(short.gids));
  if (!alt) return null;
  for (const gid of alt.gids) {
    const e = SEC_BY_GID.get(gid);
    if (e) { own.add(e.sec[0]); own.add(e.sec[1]); }
  }
  own.delete(from); own.delete(to);
  return own.size ? alt : null;
}

/* Every station a run of sections passes through, ends included. */
function pathStations(gids) {
  const s = new Set();
  for (const gid of gids) {
    const e = SEC_BY_GID.get(gid);
    if (e) { s.add(e.sec[0]); s.add(e.sec[1]); }
  }
  return s;
}

function rideGids(ride) {
  if (ride._gids) return ride._gids;
  const line = LINE_BY_ID.get(ride.line);
  if (!line) return (ride._gids = []);
  // A whole-line ride is not expressible as from -> to on a LOOP, where the first and last
  // stop are the same station and the shortest path between them is nothing at all. It also
  // saves picking two ends on a line with branches.
  /* On a line over a border, "all of it" is the pieces the ride was saved with (`regions`).
     A ride saved before lines were joined saw only its own country's piece, and keeps
     meaning that. */
  if (ride.whole) {
    const parts = partsOf(line);
    const mine = parts.length > 1
      ? parts.filter(p => (ride.regions || [rideRegion(ride)]).includes(p.region)) : parts;
    let secs = (mine.length ? mine : parts).flatMap(p => p.sections);
    /* All of a line since folded into this one (`wholeOf`, set by migrateRide) is that line's
       own sections, by their two stations: all of France's "Eurostar: Paris - Amsterdam" is
       not the Eurostar's branch to Marne-la-Vallée as well. */
    if (ride.wholeOf) {
      const key = s => (s[0] < s[1] ? `${s[0]}|${s[1]}` : `${s[1]}|${s[0]}`);
      const own = new Set(parts.flatMap(p => (p.origs || [])
        .filter(o => o.file === ride.wholeOf).flatMap(o => o.sections.map(key))));
      if (own.size) secs = secs.filter(s => own.has(key(s)));
    }
    return (ride._gids = secs.map(s => s[3]));
  }
  // Stored as a flag rather than as the sections taken, because section ids are not stable
  // across rebuilds and the two stations are.
  const p = ride.around ? pathAround(line, ride.from, ride.to)
    : pathBetween(line, ride.from, ride.to);
  return (ride._gids = p ? p.gids : []);
}

function newRide(lineId, from, to, date, opts = {}) {
  const line = LINE_BY_ID.get(lineId) || {};
  const regions = [...new Set([...(line.regions || []), ...(SHARED_LINES[lineId] || [])])];
  // On a line over a border: the country got on in, and every country the line runs through.
  const st = STATIONS[from];
  const region = (st && regions.length > 1 && regions.includes(st.region) ? st.region
    : line.region) || FOCUS;
  const ride = {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    region,
    line: lineId, from, to, date: date || '', note: '',
    added: new Date().toISOString(),
  };
  if (regions.length > 1) ride.regions = [...regions];
  if (opts.whole) ride.whole = true;
  if (opts.around) ride.around = true;
  return ride;
}

/* Several rides as one action, so one undo takes back a whole traced journey or a whole
   operator marked at once. */
function addRides(rides, label) {
  if (!rides.length) return;
  remember(label);
  RIDES.push(...rides);
  saveRides();
  afterChange();
}

function addRide(lineId, from, to, date, opts) {
  const ride = newRide(lineId, from, to, date, opts);
  addRides([ride], `Added ${rideLabel(ride)}`);
  return ride;
}

function removeRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r) return;
  remember(`Removed ${rideLabel(r)}`);
  RIDES = RIDES.filter(x => x.id !== id);
  if (EDITING === id) EDITING = null;
  saveRides();
  afterChange();
}

function rideLabel(r) {
  const line = LINE_BY_ID.get(r.line);
  const name = line ? lineName(line) : r.line;
  return r.whole ? `all of ${name}` : `${name}, ${stName(r.from)} → ${stName(r.to)}`;
}

/* UNDO. In memory only, so it lasts as long as the page does. Every change to RIDES goes
   through remember() first, which snapshots the whole list: rides are small, and a snapshot
   cannot get out of step with the change the way an inverse operation can. */
const UNDO = [];
function remember(label) {
  UNDO.push({ label, rides: JSON.stringify(RIDES, dropCache) });
  if (UNDO.length > 100) UNDO.shift();
}
function undo() {
  const u = UNDO.pop();
  if (!u) return;
  RIDES = JSON.parse(u.rides);
  EDITING = null;
  saveRides();
  afterChange();
}
function showUndo() {
  const el = document.getElementById('undobar');
  const u = UNDO[UNDO.length - 1];
  el.style.display = u ? 'flex' : 'none';
  if (u) document.getElementById('undolabel').textContent = u.label;
}
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
  // Inside a text box, Ctrl+Z is that box's own undo.
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'))
    return;
  e.preventDefault();
  undo();
});

// ---------------------------------------------------------------- crediting

/* ONE OWNER FOR EVERY PIECE OF TRACK (Anita, 2026-10-01). No piece of track is counted twice:
   each belongs to exactly one line, and that decides only what a ride credits. Rides are
   still entered on any service over any path.

   The build (ownership.py) gives every drawn way one owner: a register line where one lies on
   it, else an OpenStreetMap line whose route runs over it, the lowest ref first where several
   do (natural sort, empty refs last, then name, then id). Named trains own nothing. Then each
   section gets a FOOTPRINT, foot.json: the owner sections it runs over, as entries
   [owner section, from, to, a, b], meaning the stretch a..b of this section (fractions of its
   length) lies on from..to of the owner section (`to < from` where it runs the other way).
   A section not in foot.json is its own footprint, whole.

   A ride credits the footprints of the sections it rides. So riding an IC over register
   track credits the register lines it runs on and nothing beside them; riding a metro
   through-service onto a private railway credits that railway. */
const FOOT = new Map();       // section gid -> [[owner gid, from, to, a, b], ...]
const FOOT_INTO = new Map();  // owner gid -> gids whose footprint names it
const FOOT_REGIONS = new Set();  // countries whose foot.json has any footprint
const OWNSP = new Map();      // owner gid -> merged spans of it its own line owns
let OWN_GEN = 0;              // bumped whenever OWNSP changes, for the per-line caches
let DATA_GEN = 0;             // bumped whenever a country's data is merged in
const footOf = gid => FOOT.get(gid) || [[gid, 0, 1, 0, 1]];
const secKm = gid => { const e = SEC_BY_GID.get(gid); return e ? e.sec[2] : 0; };
const regionOfGid = gid => gid.slice(0, gid.indexOf(':'));
const isRegisterLine = l => !!l && partsOf(l).some(p => p.src !== 'osm');

/* Spans [lo, hi] along one section merged. GAPS UNDER 150 m ARE CLOSED, at the ends of a
   section and between two spans: a ride along one line covers a parallel one up to where the
   two part to reach their own platforms, a few tens of metres short of the station. Capped at
   10% of the section, so a short one is not completed by a ride that only touched it. */
function mergeSpans(spans, km) {
  if (!spans.length) return [];
  const tol = km > 0 ? Math.min(0.15 / km, 0.1) : 0;
  const s = spans.map(x => [x[0], x[1]]).sort((p, q) => p[0] - q[0]);
  const out = [];
  for (const [lo, hi] of s) {
    const last = out[out.length - 1];
    if (last && lo <= last[1] + tol) last[1] = Math.max(last[1], hi);
    else out.push([lo, hi]);
  }
  if (out[0][0] <= tol) out[0][0] = 0;
  if (out[out.length - 1][1] >= 1 - tol) out[out.length - 1][1] = 1;
  return out;
}
const spansLength = sp => Math.min(1, sp.reduce((n, [lo, hi]) => n + hi - lo, 0));
function spansMeet(a, b) {
  let out = 0, i = 0, j = 0;
  while (i < a.length && j < b.length) {
    const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]);
    if (hi > lo) out += hi - lo;
    if (a[i][1] < b[j][1]) i++; else j++;
  }
  return out;
}

/* What each line owns, worked out as a country loads: the union of the footprints of its own
   sections onto each of them. A register section owns itself whole unless it lies on rails
   another register line owns; an OSM section owns the part of it on track its line owns. */
function ownTrack(cc) {
  const raw = new Map();
  for (const line of LINES) for (const p of partsOf(line)) {
    if (p.region !== cc) continue;
    for (const [a, b, km, gid] of p.sections) {
      const f = FOOT.get(gid);
      if (f) for (const e of f) {
        if (!FOOT_INTO.has(e[0])) FOOT_INTO.set(e[0], []);
        FOOT_INTO.get(e[0]).push(gid);
      }
      if (p.service || CLOSED.has(gid)) continue;
      for (const [t, from, to] of footOf(gid)) {
        const te = SEC_BY_GID.get(t);
        if (!te || te.line.id !== p.id || CLOSED.has(t) || to === from) continue;
        if (!raw.has(t)) raw.set(t, []);
        raw.get(t).push([Math.min(from, to), Math.max(from, to)]);
      }
    }
  }
  for (const [t, iv] of raw) OWNSP.set(t, mergeSpans(iv, secKm(t)));
  OWN_GEN++;
}

/* Km a line's piece owns, and km of it on track no register line owns. Cached per OWN_GEN. */
function ownedKm(p) {
  if (p._own && p._own.gen === OWN_GEN) return p._own.km;
  let km = 0;
  for (const [a, b, secK, gid] of p.sections)
    if (!CLOSED.has(gid)) km += secK * spansLength(OWNSP.get(gid) || []);
  p._own = { gen: OWN_GEN, km };
  return km;
}
function offRegisterKm(p) {
  if (p._off && p._off.gen === OWN_GEN) return p._off.km;
  let km = 0;
  for (const [a, b, secK, gid] of p.sections) {
    if (CLOSED.has(gid)) continue;
    for (const [t, from, to, x, y] of footOf(gid)) {
      const te = SEC_BY_GID.get(t);
      if (te && te.line.src === 'osm') km += secK * Math.abs(y - x);
    }
  }
  p._off = { gen: OWN_GEN, km };
  return km;
}

/* WHICH LINES ARE LISTED as lines of their own (the lists, the operators, the finished
   count). Register lines always, unless all their track belongs to another line (one of a
   tunnel's two bores, a track the register lists as a line of its own). Named trains never.
   An OpenStreetMap line when at least OFF_REGISTER_SHARE of it runs on track no register line
   owns: RER A and B, the Paris Metro, every tram. Judged on track off the register, not on
   what the line ends up owning, so a metro sharing its trunk with a lower-numbered line
   (Brussels' 6 over the 2) is still a line. Below that it is an operating pattern over
   register lines, and the few km it owns are register gaps the build logs. */
const OFF_REGISTER_SHARE = 0.4;
function listed(l) {
  if (l.parts) return l.parts.some(listed);
  if (l.src !== 'osm') return !(l.km > 0.05) || ownedKm(l) > 0.05;
  if (l.service) return false;
  const off = offRegisterKm(l);
  return off > 0.05 && off >= OFF_REGISTER_SHARE * l.km;
}

/* What every ride credits, worked out once per change of rides or data:
   `R`, the ridden spans of each owner section (a ride's own sections whole, plus their
   footprints), which the totals count against what each section owns; and `spans`/`frac`,
   the ridden part of every section along its own length, which line percentages, the strip
   diagram and the map read. A section not ridden itself is ridden where its footprint is:
   riding the register line under an S-Bahn completes that much of the S-Bahn. */
let CREDIT = null;
const rideSig = r => [r.id, r.line, r.from, r.to, r.whole ? 1 : 0, r.around ? 1 : 0,
                      (r.regions || []).join(','), r.region || '', r.wholeOf || ''].join('|');
function creditState() {
  const rides = here();
  const sig = DATA_GEN + '#' + rides.map(rideSig).join(';');
  if (CREDIT && CREDIT.sig === sig) return CREDIT;
  const raw = new Map(), direct = new Set();
  const push = (gid, lo, hi) => {
    if (hi <= lo) return;
    if (!raw.has(gid)) raw.set(gid, []);
    raw.get(gid).push([lo, hi]);
  };
  for (const ride of rides) {
    for (const gid of rideGids(ride)) {
      direct.add(gid);
      push(gid, 0, 1);
      for (const [t, from, to] of footOf(gid)) push(t, Math.min(from, to), Math.max(from, to));
    }
  }
  const R = new Map();
  for (const [t, iv] of raw) R.set(t, mergeSpans(iv, secKm(t)));
  const touched = new Set(direct);
  for (const t of R.keys()) {
    if (!FOOT.has(t)) touched.add(t);
    for (const g of FOOT_INTO.get(t) || []) touched.add(g);
  }
  const spans = new Map(), frac = new Map();
  for (const gid of touched) {
    const sp = direct.has(gid) ? [[0, 1]] : mapBack(gid, R);
    if (!sp.length) continue;
    spans.set(gid, sp);
    frac.set(gid, spansLength(sp));
  }
  CREDIT = { sig, R, spans, frac };
  return CREDIT;
}

/* The ridden part of a section along its own length, from what is ridden of its footprint. */
function mapBack(gid, R) {
  const out = [];
  for (const [t, from, to, a, b] of footOf(gid)) {
    const r = R.get(t);
    if (!r) continue;
    const lo = Math.min(from, to), hi = Math.max(from, to);
    if (hi - lo < 1e-9) continue;
    for (const [x, y] of r) {
      const ix = Math.max(x, lo), iy = Math.min(y, hi);
      if (iy <= ix) continue;
      const p1 = a + (ix - from) / (to - from) * (b - a);
      const p2 = a + (iy - from) / (to - from) * (b - a);
      out.push([Math.min(p1, p2), Math.max(p1, p2)]);
    }
  }
  return mergeSpans(out, secKm(gid));
}

// Section gid -> fraction of it ridden, and the same as merged spans along it.
const creditRanges = () => creditState().frac;
const creditSpans = () => creditState().spans;

/* The part of a polyline between two fractions of its length. Lengths on a local flat
   projection, which is how the build measures the fractions in foot.json. */
function sliceLine(pts, lo, hi) {
  if (lo <= 0.0005 && hi >= 0.9995) return pts;
  const kx = Math.cos(pts[0][1] * Math.PI / 180);
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot((pts[i][0] - pts[i - 1][0]) * kx, pts[i][1] - pts[i - 1][1]));
  const total = cum[cum.length - 1];
  if (!total) return null;
  const at = d => {
    let i = 1;
    while (i < pts.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1], t = seg ? (d - cum[i - 1]) / seg : 0;
    return [pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]),
            pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1])];
  };
  const a = lo * total, b = hi * total;
  const out = [at(a)];
  for (let i = 1; i < pts.length - 1; i++) if (cum[i] > a && cum[i] < b) out.push(pts[i]);
  out.push(at(b));
  return out.length > 1 ? out : null;
}

/* WHAT COUNTS TOWARDS COMPLETION (Anita, 2026-10-01): everything with scheduled passenger
   service, and every km of track once. A country's total is the track every line owns there,
   each piece once; an operator's is the track its listed lines own. Ridden is what the rides
   credit of that owned track. */
function ownedDone(p, R) {
  let done = 0;
  for (const [a, b, km, gid] of p.sections) {
    const r = R.get(gid);
    if (r && !CLOSED.has(gid)) done += km * spansMeet(r, OWNSP.get(gid) || []);
  }
  return done;
}
let REGION_TOTAL = { gen: -1, by: new Map() };
function regionTotals() {
  if (REGION_TOTAL.gen === OWN_GEN) return REGION_TOTAL.by;
  const by = new Map();
  for (const [t, sp] of OWNSP) {
    if (CLOSED.has(t)) continue;
    const cc = regionOfGid(t);
    by.set(cc, (by.get(cc) || 0) + secKm(t) * spansLength(sp));
  }
  REGION_TOTAL = { gen: OWN_GEN, by };
  return by;
}

/* A station with `j` is where a register line ends without stopping: a junction, or the
   national border. It is a section end, so the strip diagram shows it, but it is not
   drawn as a bubble, found by search, or offered as somewhere to get on or off. */
const isStop = id => STATIONS[id] && !STATIONS[id].j;

function stats() {
  const { frac, R } = creditState();
  const perLine = [];
  // Per country. The headline is FOCUS's; the Countries tab all of them.
  const byRegion = new Map();
  for (const [cc, total] of regionTotals())
    byRegion.set(cc, { done: 0, total, finished: 0 });
  for (const [t, r] of R) {
    const own = OWNSP.get(t);
    if (!own || CLOSED.has(t)) continue;
    const e = byRegion.get(regionOfGid(t));
    if (e) e.done += secKm(t) * spansMeet(r, own);
  }
  for (const line of LINES) {
    const km = lineKm(line, frac);
    // A line over a border: each country its own piece.
    for (const p of partsOf(line)) {
      if (!listed(p)) continue;
      const pk = p === line ? km : lineKm(p, frac);
      const r = byRegion.get(p.region);
      if (r && pk / Math.max(p.km, 0.001) > 0.999) r.finished++;
    }
    if (km > 0.001) perLine.push({ line, km, pct: km / Math.max(line.km, 0.001) });
  }
  perLine.sort((x, y) => y.km - x.km);
  const f = byRegion.get(FOCUS) || { done: 0, total: 0 };
  const doneKm = f.done, totalKm = f.total;

  const byOp = new Map();
  for (const line of LINES) {
    if (!listed(line)) continue;
    const op = opKey(line);
    const e = byOp.get(op) || { op, label: op, km: 0, total: 0, lines: 0, done: 0 };
    const km = lineKm(line, frac);
    for (const p of partsOf(line)) {
      e.total += ownedKm(p);
      e.km += ownedDone(p, R);
    }
    e.lines++;
    if (km / Math.max(line.km, 0.001) > 0.999) e.done++;
    byOp.set(op, e);
  }
  const ops = [...byOp.values()].filter(e => e.km > 0.001).sort((a, b) => b.km - a.km);
  return { frac, perLine, ops, doneKm, totalKm, byRegion,
           finished: perLine.filter(p => p.pct > 0.999).length };
}

// ---------------------------------------------------------------- ridden on the map

/* Only the sections actually ridden are drawn, not everything they credit: a credited
   section lies on the same rails, so drawing both would just double-draw them. */
let RIDDEN_GEN = 0;         // the same guard as paintSelection's, for the same race

async function paintRidden() {
  if (!mapReady || !map.getSource('ridden')) return;
  const gen = ++RIDDEN_GEN;
  const wanted = new Map();
  for (const ride of here()) {
    const line = LINE_BY_ID.get(ride.line);
    if (!line) continue;
    if (!wanted.has(line.id)) wanted.set(line.id, new Set());
    for (const gid of rideGids(ride)) wanted.get(line.id).add(gid);
  }
  const features = [];
  for (const [lineId, gids] of wanted) {
    const line = LINE_BY_ID.get(lineId);
    const g = await geomFor(lineId);
    if (gen !== RIDDEN_GEN) return;
    const colour = lineColour(line);
    for (const [a, b, km, gid] of line.sections) {
      if (!gids.has(gid)) continue;
      const pts = g[`${a}|${b}`];
      if (!pts || pts.length < 2) continue;
      features.push({ type: 'Feature', properties: { c: colour, l: lineId },
                      geometry: { type: 'LineString', coordinates: pts } });
    }
  }
  map.getSource('ridden').setData({ type: 'FeatureCollection', features });
}

/* Every not-running section of every loaded country, for the base map. A few lines a
   country, so their geometry is fetched as soon as the country's lines are in. */
let CLOSED_GEN = 0;
async function paintClosed() {
  if (!mapReady || !map.getSource('closed')) return;
  const gen = ++CLOSED_GEN;
  const features = [];
  for (const line of LINES) {
    if (!line.km_closed) continue;
    const g = await geomFor(line.id);
    if (gen !== CLOSED_GEN) return;
    for (const [a, b, km, gid] of line.sections) {
      const pts = CLOSED.has(gid) && g[`${a}|${b}`];
      if (pts && pts.length > 1)
        features.push({ type: 'Feature', properties: { l: line.id },
                        geometry: { type: 'LineString', coordinates: pts } });
    }
  }
  map.getSource('closed').setData({ type: 'FeatureCollection', features });
}

// ---------------------------------------------------------------- panel

let VIEW = { kind: 'home' };
// `around` asks for the other way between the two ends, where there is one (a loop).
let PICK = { from: null, to: null, around: false };
let EDITING = null;        // the ride whose date and note are open for editing
// The legs of one journey share a date, so the last one entered is the default.
let LAST_DATE = '';

function openPanel(on) {
  document.getElementById('panel').classList.toggle('open', on);
}

/* What the map draws as selected: the whole of the chosen line, every station on it, and the
   two ends of the trip being entered. Redrawn from VIEW and PICK, so there is one place that
   decides what selection looks like and no way for the panel and the map to disagree. */
/* With a line open or a journey being traced, EVERYTHING not part of it drops back,
   including the ridden overlay: the selection's own ridden part is redrawn on top from the
   `sel` source, so muting the overlay loses nothing of the line being looked at. */
function setMuted(on) {
  if (!mapReady || !map.getLayer('ridden')) return;
  MUTED_NOW = on;
  applyTrackColour();
  map.setPaintProperty('ridden', 'line-opacity', on ? 0.25 : 1);
  map.setPaintProperty('ridden-casing', 'line-opacity', on ? 0.2 : 0.85);
  map.setPaintProperty('station', 'circle-opacity', on ? 0.3 : 1);
  map.setPaintProperty('station', 'circle-stroke-opacity', on ? 0.3 : 1);
  map.setPaintProperty('closed', 'line-opacity', on ? 0.4 : 1);
}

/* Each call is numbered, and a call that finds a newer one started while it awaited
   geometry gives up. Otherwise two quick clicks race, and whichever fetch lands last draws
   the older state over the newer one. */
let PAINT_GEN = 0;

async function paintSelection() {
  if (!mapReady || !map.getSource('sel')) return;
  const gen = ++PAINT_GEN;
  const shown = shownTrip();
  setMuted(VIEW.kind === 'line' || VIEW.kind === 'trace' || !!shown);
  const lines = { type: 'FeatureCollection', features: [] };
  const pts = { type: 'FeatureCollection', features: [] };
  const mark = (id, role, colour) => {
    const s = STATIONS[id];
    if (!s) return;
    pts.features.push({ type: 'Feature',
                        properties: { role: role || '', id, c: colour || THEME.stStroke },
                        geometry: { type: 'Point', coordinates: [s.x, s.y] } });
  };

  if (VIEW.kind === 'line') {
    const line = LINE_BY_ID.get(VIEW.id);
    if (line) {
      const g = await geomFor(line.id);
      if (gen !== PAINT_GEN) return;   // moved on while fetching
      const run = pickedRun();
      drawLine(line, g, run && run.p ? run.p.gids : null, PICK.from, PICK.to, lines, mark);
    }
  } else if (shown) {
    /* A trip opened in the rides list, drawn the way the line view would draw it, while the
       panel stays on the list. On one line: that line, with the trip over it in white. Over
       several: each leg in its own line's colour, as the trace draws a journey. */
    const first = shown.rides[0], last = shown.rides[shown.rides.length - 1];
    const lineIds = [...new Set(shown.rides.map(r => r.line))];
    if (lineIds.length === 1) {
      const line = LINE_BY_ID.get(lineIds[0]);
      if (line) {
        const g = await geomFor(line.id);
        if (gen !== PAINT_GEN) return;
        const gids = [...new Set(shown.rides.flatMap(rideGids))];
        drawLine(line, g, gids, first.whole ? null : first.from,
                 last.whole ? null : last.to, lines, mark);
      }
    } else {
      const via = new Set(), stops = new Set();
      for (const r of shown.rides) {
        const line = LINE_BY_ID.get(r.line);
        if (!line) continue;
        const g = await geomFor(line.id);
        if (gen !== PAINT_GEN) return;
        lines.features.push(...runFeatures(line, rideGids(r), g, lineColour(line)));
        for (const s of pathStations(rideGids(r))) via.add(s);
        stops.add(r.from); stops.add(r.to);
      }
      for (const s of via) if (!stops.has(s) && isStop(s)) mark(s, 'via');
      for (const s of stops) mark(s, 'from', THEME.run);
    }
    if (FIT_TRIP === shown.key) {
      FIT_TRIP = null;
      fitIfOutside(lines.features.filter(f => f.properties.part === 'run'));
    }
  } else if (VIEW.kind === 'station') {
    mark(VIEW.id, 'from');
  } else if (VIEW.kind === 'trace') {
    /* Each leg in its own line's colour, so a journey reads as the trains it was. */
    const legs = traceLegs();
    const via = new Set();
    for (const leg of legs) {
      if (!leg.line || !leg.p) continue;
      const g = await geomFor(leg.line.id);
      if (gen !== PAINT_GEN) return;
      lines.features.push(...runFeatures(leg.line, leg.p.gids, g, lineColour(leg.line)));
      for (const s of pathStations(leg.p.gids)) via.add(s);
    }
    const clicked = new Set(VIEW.stops);
    /* Every station the next click could land on, as a faint ring: anything sharing a line
       with the last stop. Anything else would be refused, so the rings are the whole of
       what is clickable. */
    for (const s of traceReachable()) if (!clicked.has(s) && !via.has(s)) mark(s, 'reach');
    for (const s of via) if (!clicked.has(s)) mark(s, 'via');
    for (const s of clicked) mark(s, 'from', THEME.run);
  }
  map.getSource('sel').setData(lines);
  map.getSource('selst').setData(pts);
}

/* One line as selected: the whole of it in its own colour, the way the panel's bar draws
   it, held back where it has not been ridden (`base`) and at full strength over the part
   that has (`done`). Ridden counts whatever line the ride was entered on, so the part of a
   register line covered by a ride on an operating pattern lights up too, sliced to exactly
   the stretch of track the two share. The halo is what says "selected". Over it, `runGids` in
   white, with the stations it passes through as white rings: the same thing the diagram
   lights up, in the same place. */
function drawLine(line, g, runGids, from, to, lines, mark) {
  const own = lineColour(line);
  const spans = creditSpans();
  for (const [a, b, km, gid] of line.sections) {
    const c = g[`${a}|${b}`];
    if (!c || c.length < 2) continue;
    lines.features.push({ type: 'Feature',
                          properties: { part: CLOSED.has(gid) ? 'gone' : 'base', c: own },
                          geometry: { type: 'LineString', coordinates: c } });
    for (const [lo, hi] of spans.get(gid) || []) {
      const piece = sliceLine(c, lo, hi);
      if (piece) lines.features.push({ type: 'Feature', properties: { part: 'done', c: own },
                                       geometry: { type: 'LineString', coordinates: piece } });
    }
  }
  /* A station counts as reached when either section beside it has been ridden, which is
     what the diagram's filled dots mean too. */
  const frac = creditRanges();
  const dim = dimmed(own, 0.45);
  const visited = new Set();
  for (const [a, b, km, gid] of line.sections) {
    if ((frac.get(gid) || 0) > 0.999) { visited.add(a); visited.add(b); }
  }
  const via = runGids ? pathStations(runGids) : new Set();
  if (runGids) lines.features.push(...runFeatures(line, runGids, g, THEME.run));

  const seen = new Set();
  for (const [a, b] of line.sections) for (const s of [a, b]) {
    if (seen.has(s) || !isStop(s)) continue;
    seen.add(s);
    mark(s, s === from ? 'from' : s === to ? 'to' : via.has(s) ? 'via' : '',
         visited.has(s) ? own : dim);
  }
}

/* Bring features into view, but only if they are not in view already: opening a trip that
   is on screen should not move the map out from under the reader. */
function fitIfOutside(features) {
  let minx = 180, miny = 90, maxx = -180, maxy = -90, any = false;
  for (const f of features) for (const [x, y] of f.geometry.coordinates) {
    any = true;
    minx = Math.min(minx, x); maxx = Math.max(maxx, x);
    miny = Math.min(miny, y); maxy = Math.max(maxy, y);
  }
  if (!any) return;
  const v = map.getBounds();
  if (v.contains([minx, miny]) && v.contains([maxx, maxy])) return;
  map.fitBounds([[minx, miny], [maxx, maxy]], { padding: 80, duration: 0, maxZoom: 14 });
}

function runFeatures(line, gids, g, colour) {
  const out = [];
  for (const gid of gids) {
    const e = SEC_BY_GID.get(gid);
    if (!e || e.line !== line) continue;
    const c = g[`${e.sec[0]}|${e.sec[1]}`];
    if (c && c.length > 1)
      out.push({ type: 'Feature', properties: { part: 'run', c: colour },
                 geometry: { type: 'LineString', coordinates: c } });
  }
  return out;
}

/* The run of sections between the two picked stations on the open line: the short way, or
   the other way round when that was asked for and exists. */
function pickedRun() {
  if (VIEW.kind !== 'line' || !PICK.from || !PICK.to) return null;
  const line = LINE_BY_ID.get(VIEW.id);
  if (!line) return null;
  const short = pathBetween(line, PICK.from, PICK.to);
  const alt = short ? pathAround(line, PICK.from, PICK.to) : null;
  const around = !!(PICK.around && alt);
  return { line, short, alt, around, p: around ? alt : short };
}

function lineStations(line) {
  if (line._st) return line._st;
  const s = new Set();
  for (const [a, b] of line.sections) { s.add(a); s.add(b); }
  return (line._st = s);
}

function afterChange() {
  paintRidden();
  paintSelection();
  render();
}

function render() {
  showUndo();
  const body = document.getElementById('panel-body');
  if (VIEW.kind === 'line') renderLine(body);
  else if (VIEW.kind === 'station') renderStation(body);
  else if (VIEW.kind === 'pick') renderPick(body);
  else if (VIEW.kind === 'op') renderOp(body);
  else if (VIEW.kind === 'trace') renderTrace(body);
  else renderHome(body);
  saveUi();
}

function renderHome(el) {
  const s = stats();
  const pct = s.totalKm ? (100 * s.doneKm / s.totalKm) : 0;
  // The headline is the country under the middle of the map, and follows you across borders.
  const focusIn = LOADED.has(FOCUS);
  let h;
  if (!FOCUS) {
    /* No country under the middle of the map (the world view a first visit opens on): the
       total over every country with rides, and how to get one country's numbers. */
    let km = 0, n = 0;
    for (const r of s.byRegion.values()) if (r.done > 0.001) { km += r.done; n++; }
    h = `<h2 class="sec">Ridden</h2>`
      + `<div class="big">${km.toFixed(1)} km<small>${n ? `in ${n} countr${n === 1 ? 'y' : 'ies'}. `
        : ''}Centre the map on a country for its own total.</small></div>`;
  } else {
    h = `<h2 class="sec">Ridden in ${esc(regionName(FOCUS))}</h2>`
      + (focusIn
        ? `<div class="big">${s.doneKm.toFixed(1)} km<small>of ${Math.round(s.totalKm).toLocaleString()} km of line, ${pct.toFixed(2)}%</small></div>`
        : `<div class="big" style="color:var(--g6f)">…<small>loading its lines</small></div>`)
      + `<div class="meter"><i style="width:${Math.min(100, pct).toFixed(2)}%"></i></div>`;
  }
  const mine = here();

  if (!mine.length) {
    h += `<p class="muted" style="margin-top:14px">Nothing recorded yet. Click a station on `
      + `the map, or search a line above, then pick where you got on and off.</p>`;
  }
  const lost = lostRides();
  if (lost) {
    h += `<p class="muted" style="margin-top:10px">${lost} ride`
      + `${lost === 1 ? '' : 's'} could not be matched to the current data and `
      + `count towards nothing. They are still in your export.</p>`;
  }

  /* ONE LIST AT A TIME. All four under each other made the panel a long scroll where the
     rides, the thing most often wanted, came last. */
  const tabs = [['country', 'Countries'], ['op', 'Operators'], ['line', 'Lines'],
                ['rides', `Trips (${trips().length})`]];
  h += `<div class="tabs">` + tabs.map(([k, label]) =>
    `<button class="${HOME_TAB === k ? 'on' : ''}" onclick="setHomeTab('${k}')">${label}</button>`
  ).join('') + `</div>`;

  if (HOME_TAB === 'country') {
    /* Every built country. One whose lines are in (you have been over it, or have rides
       there) shows its numbers; one not yet visited shows only that, since its numbers need
       its data. A click goes there, which loads it. */
    for (const [k, reg] of Object.entries(REGIONS)) {
      const r = s.byRegion.get(k);
      const here_ = k === FOCUS ? ' · in view' : '';
      if (LOADED.has(k) && r) {
        const p = r.done / Math.max(r.total, 0.001);
        h += meterRow({ name: reg.name, right: `${(100 * p).toFixed(2)}%`, frac: p,
                        colour: '#4a9eff', click: `goRegion('${k}')`,
                        detail: `${r.done.toFixed(1)} of ${Math.round(r.total).toLocaleString()} km`
                          + ` · ${r.finished} line${r.finished === 1 ? '' : 's'} finished${here_}` });
      } else {
        h += `<div class="lrow" style="cursor:pointer" onclick="goRegion('${k}')">`
          + `<div class="n"><b>${esc(reg.name)}</b><span>go →</span></div>`
          + `<div class="o">not visited yet${here_}</div></div>`;
      }
    }
  } else if (HOME_TAB === 'op') {
    if (!s.ops.length) h += `<p class="muted">No operator started yet.</p>`;
    for (const o of s.ops) {
      const p = o.km / Math.max(o.total, 0.001);
      h += meterRow({ name: o.label, right: `${(100 * p).toFixed(1)}%`, frac: p, colour: '#4a9eff',
                      click: `showOp(${OP_INDEX.get(o.op)})`,
                      detail: `${o.km.toFixed(1)} of ${Math.round(o.total).toLocaleString()} km`
                        + `${o.done ? ` · ${o.done} line${o.done > 1 ? 's' : ''} finished` : ''}` });
    }
  } else if (HOME_TAB === 'line') {
    if (!s.perLine.length) h += `<p class="muted">No line started yet.</p>`;
    else h += `<p class="muted" style="margin:0 0 4px">${s.perLine.length} touched, `
      + `${s.finished} finished.</p>`;
    for (const p of s.perLine) h += lineRow(p.line, p.km);
  } else {
    h += renderRides();
  }
  el.innerHTML = h;
}

let HOME_TAB = 'rides';
function setHomeTab(k) { HOME_TAB = k; EDITING = null; render(); paintSelection(); }

/* WHAT IS OPEN IN THE PANEL IS REMEMBERED: the view (a line, a station, an operator, the
   lines over a piece of track, a journey being traced), the ends picked on a line, the home
   tab and the trip open in it. Saved on every render, and put back on load once the
   countries it needs (`need`) are in. Until then the page shows home and saves nothing, so
   the load itself cannot overwrite what is being restored; any change the reader makes
   first wins over the restore. */
const UI_KEY = 'noritetsu.ui';
let UI_PENDING = null;          // {saved, sig} while a saved view waits for its countries

function uiSig() {
  const v = { ...VIEW };
  delete v.note;
  return JSON.stringify({ v, p: VIEW.kind === 'line' ? PICK : null, t: HOME_TAB, e: EDITING });
}

// The countries the open view needs loaded to show again.
function viewRegions() {
  const ofLine = id => {
    const l = LINE_BY_ID.get(id);
    return [...(l ? regionsOf(l) : []), ...(SHARED_LINES[foldLine(id)] || [])];
  };
  const ofSt = id => {
    const s = STATIONS[id];
    return s ? (s.regions || [s.region]) : [];
  };
  let out = [];
  if (VIEW.kind === 'line') out = ofLine(VIEW.id);
  else if (VIEW.kind === 'station') out = ofSt(VIEW.id);
  else if (VIEW.kind === 'pick') out = VIEW.ids.flatMap(ofLine);
  else if (VIEW.kind === 'trace') out = VIEW.stops.flatMap(ofSt);
  else if (VIEW.kind === 'op') {
    const o = OPS[OP_INDEX.get(VIEW.key)];
    out = o ? o.lines.flatMap(regionsOf) : [];
  }
  return [...new Set(out)];
}

function saveUi() {
  if (UI_PENDING) {
    if (uiSig() === UI_PENDING.sig) return;
    UI_PENDING = null;          // the reader moved first: theirs wins
  }
  const v = { ...VIEW };
  delete v.note;
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({
      view: v, pick: VIEW.kind === 'line' ? PICK : null, tab: HOME_TAB, trip: EDITING,
      need: viewRegions() }));
  } catch (e) { /* remembered for this page only */ }
}

/* At boot: the tab and the open trip straight away, since they need nothing loaded; the
   view itself waits in UI_PENDING for restoreUi. */
function bootUi() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { }
  if (!s || typeof s !== 'object') return;
  if (['country', 'op', 'line', 'rides'].includes(s.tab)) HOME_TAB = s.tab;
  if (typeof s.trip === 'string') EDITING = s.trip;
  const v = s.view;
  if (v && ['line', 'station', 'op', 'pick', 'trace'].includes(v.kind))
    UI_PENDING = { saved: s, sig: uiSig() };
}

function restoreUi() {
  const p = UI_PENDING;
  if (!p) return;
  const known = Object.keys(REGIONS).length;
  const need = (p.saved.need || []).filter(cc => !known || REGIONS[cc]);
  Promise.all(need.map(loadRegion)).then(() => {
    if (UI_PENDING !== p) return;
    UI_PENDING = null;
    const v = p.saved.view;
    // Ids a rebuild moved, as rides are migrated.
    const lineId = id => {
      if (LINE_BY_ID.has(id)) return id;
      if (LINE_FOLD[id]) return LINE_FOLD[id];
      for (const cc of need) if ((LINE_ALIASES[cc] || {})[id]) return LINE_ALIASES[cc][id];
      return id;
    };
    const stId = id => {
      if (STATIONS[id]) return id;
      for (const cc of need) if ((ALIASES[cc] || {})[id]) return ALIASES[cc][id];
      return id;
    };
    if (v.kind === 'line') v.id = lineId(v.id);
    if (v.kind === 'station') v.id = stId(v.id);
    if (v.kind === 'pick') v.ids = (v.ids || []).map(lineId);
    if (v.kind === 'trace') {
      v.stops = (v.stops || []).map(stId).filter(id => STATIONS[id]);
      v.choice = v.choice || {};
    }
    VIEW = v;
    const pk = p.saved.pick;
    PICK = v.kind === 'line' && pk
      ? { from: pk.from ? stId(pk.from) : null, to: pk.to ? stId(pk.to) : null, around: !!pk.around }
      : { from: null, to: null, around: false };
    // A view that no longer resolves falls back to home inside render.
    render();
    paintSelection();
    if (VIEW.kind === 'line') loadLineRegions(VIEW.id);
  });
}

/* A row with a bar under its name: the bar dim in the row's colour, filled at full strength
   for the fraction done, the way the map draws a selected line. Lines use their own colour,
   operators and countries the plain accent. */
function meterRow({ name, right, frac, colour, click, detail }) {
  return `<div class="lrow"${click ? ` style="cursor:pointer" onclick="${click}"` : ''}>`
    + `<div class="n"><b>${esc(name)}</b><span>${right}</span></div>`
    + `<div class="lmeter" style="--c:${colour}"><i style="width:`
    + `${Math.min(100, 100 * frac).toFixed(1)}%"></i></div>`
    + `<div class="o">${detail}</div></div>`;
}

// Capped at the line's length: its sections can sum a rounding step over it (14.2 of 14.1).
function lineKm(line, frac) {
  let km = 0;
  for (const [a, b, secKm, gid] of line.sections)
    if (!CLOSED.has(gid)) km += secKm * (frac.get(gid) || 0);
  return Math.min(km, line.km);
}

/* The one row every list of lines uses. Started lines show their percentage, untouched
   ones their length. */
function lineRow(line, km, opts = {}) {
  const f = km / Math.max(line.km, 0.001);
  const touched = km > 0.001;
  const detail = [touched ? `${km.toFixed(1)} of ${line.km.toFixed(1)} km` : '',
                  opts.operator ? esc(opName(line)) : '',
                  line.service ? 'a named train, not a line' : '',
                  line.km_closed ? (line.km < 0.05 ? 'no longer running'
                    : `${line.km_closed.toFixed(0)} km no longer running`) : '']
    .filter(Boolean).join(' · ');
  return meterRow({
    name: lineName(line), frac: f, colour: lineColour(line),
    right: touched ? `${(100 * f).toFixed(0)}%` : `${line.km.toFixed(0)} km`,
    click: `showLine('${line.id}'${opts.from ? `,'${opts.from}'` : ''})`,
    detail,
  });
}

/* TRIPS, not rides. A journey traced across three trams is three rides, since each credits
   its own line, but it is one thing to the rider and one row here. A trip is a run of rides
   saved back to back where each starts where the last one ended, with the same date, added
   within half an hour of each other: that covers a traced journey and the legs of one
   entered one at a time on the strip diagram, and needs nothing stored. */
const TRIP_GAP_MS = 30 * 60 * 1000;
function trips() {
  const out = [];
  let cur = null;
  for (const r of here()) {
    const prev = cur && cur.rides[cur.rides.length - 1];
    const joins = prev && !prev.whole && !r.whole && prev.to === r.from
      && (prev.date || '') === (r.date || '')
      && Math.abs(Date.parse(r.added) - Date.parse(prev.added)) <= TRIP_GAP_MS;
    if (joins) cur.rides.push(r);
    else { cur = { key: r.id, rides: [r] }; out.push(cur); }
  }
  return out;
}

// The trip open in the rides list, which the map then draws as the selection.
function shownTrip() {
  if (VIEW.kind !== 'home' || HOME_TAB !== 'rides' || !EDITING) return null;
  return trips().find(t => t.key === EDITING) || null;
}

const rideKm = r => rideGids(r).reduce((s, gid) => {
  const e = SEC_BY_GID.get(gid);
  return s + (e ? e.sec[2] : 0);
}, 0);

function renderRides() {
  let h = `<div class="btnrow" style="margin:0 0 6px">`
    + `<button class="act" onclick="startTrace()">trace a journey</button></div>`;
  const list = trips().reverse();
  const elsewhere = RIDES.length - here().length;
  for (const t of list.slice(0, 200)) {
    const first = t.rides[0], last = t.rides[t.rides.length - 1];
    const legLines = t.rides.map(r => LINE_BY_ID.get(r.line));
    const colours = legLines.map(l => (l ? lineColour(l) : THEME.off));
    const open = EDITING === t.key;
    const km = t.rides.reduce((s, r) => s + rideKm(r), 0);
    // The edge is the trip's lines in order, one band per leg.
    const edge = colours.length === 1 ? colours[0] : `linear-gradient(${colours.map((c, i) =>
      `${c} ${(100 * i / colours.length).toFixed(1)}% ${(100 * (i + 1) / colours.length).toFixed(1)}%`
    ).join(', ')})`;
    let title, what;
    if (t.rides.length === 1) {
      const l = legLines[0];
      title = esc(l ? lineName(l) : first.line);
      what = first.whole ? 'all'
        : `${esc(stName(first.from))} → ${esc(stName(first.to))}`
          + (first.around ? ', the other way round' : '');
    } else {
      title = `${esc(stName(first.from))} → ${esc(stName(last.to))}`;
      // Consecutive legs on one line read as one name.
      const names = legLines.map(l => (l ? lineName(l) : '?'))
        .filter((n, i, a) => i === 0 || n !== a[i - 1]);
      what = esc(names.join(' · '));
    }
    const tail = [`${km.toFixed(1)} km`, !open && first.date ? esc(first.date) : '',
                  !open && first.note ? esc(first.note) : ''].filter(Boolean).join(' · ');
    h += `<div class="ride${open ? ' editing' : ''}" onclick="selectTrip('${t.key}', event)">`
      + `<i class="edge" style="background:${edge}"></i>`
      + `<div><b>${title}</b></div>`
      + `<div class="o muted">${what} · ${tail}</div>`;
    /* Open: the trip is on the map, its legs are listed, and its date and note can be
       changed. Both are saved on change, not per keystroke, so one edit is one undo step,
       and apply to every leg. Delete lives here rather than on every row, where a stray
       click took a ride away. */
    if (open) {
      if (t.rides.length > 1) {
        h += `<div class="legs">` + t.rides.map((r, i) => {
          const l = legLines[i];
          return `<div class="legrow"><span class="sw" style="background:${colours[i]}"></span>`
            + `<span class="t"><b>${esc(l ? lineName(l) : r.line)}</b> `
            + `${esc(stName(r.from))} → ${esc(stName(r.to))}</span>`
            + `<span class="km">${rideKm(r).toFixed(1)} km</span>`
            + `<button class="act del small" onclick="deleteRide('${r.id}')">remove</button></div>`;
        }).join('') + `</div>`;
      }
      h += `<div class="edit">`
        + `<input type="date" value="${esc(first.date || '')}" `
        + `onchange="setTripField('${t.key}', 'date', this.value)" />`
        + `<input type="text" placeholder="note" value="${esc(first.note || '')}" `
        + `onchange="setTripField('${t.key}', 'note', this.value)" /></div>`
        + `<div class="edit">`
        + (t.rides.length === 1 && legLines[0]
          ? `<button class="act" onclick="openRide('${first.id}')">open line</button>` : '')
        + `<button class="act" onclick="selectTrip(null)">done</button>`
        + `<button class="act del" onclick="deleteTrip('${t.key}')">delete</button></div>`;
    }
    h += `</div>`;
  }
  if (list.length > 200) {
    h += `<p class="muted">and ${list.length - 200} older. All of them are in the export.</p>`;
  }
  if (elsewhere) {
    h += `<p class="muted">${elsewhere} more ride${elsewhere === 1 ? '' : 's'} in other `
      + `countries, under Countries.</p>`;
  }
  h += `<div class="btnrow">`
    + `<button class="act" onclick="exportRides()">Export</button>`
    + `<button class="act" onclick="document.getElementById('importfile').click()">Import</button>`
    + `<input type="file" id="importfile" accept="application/json" style="display:none" `
    + `onchange="importRides(this)" /></div>`
    + `<p class="muted" style="margin-top:10px">Rides are kept in this browser only. `
    + `Export to move them somewhere safe.</p>`;
  return h;
}

function deleteRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r || !confirm(`Delete this ride?\n\n${rideLabel(r)}`)) return;
  removeRide(id);
}

function tripByKey(key) { return trips().find(t => t.key === key); }

function deleteTrip(key) {
  const t = tripByKey(key);
  if (!t) return;
  const ask = t.rides.length === 1 ? `Delete this ride?\n\n${rideLabel(t.rides[0])}`
    : `Delete this trip, all ${t.rides.length} legs?\n\n`
      + t.rides.map(rideLabel).join('\n');
  if (!confirm(ask)) return;
  const ids = new Set(t.rides.map(r => r.id));
  remember(t.rides.length === 1 ? `Removed ${rideLabel(t.rides[0])}`
    : `Removed a trip of ${t.rides.length} legs`);
  RIDES = RIDES.filter(r => !ids.has(r.id));
  EDITING = null;
  saveRides();
  afterChange();
}

// Date and note belong to the trip, so a change applies to every leg: one undo step.
function setTripField(key, field, value) {
  const t = tripByKey(key);
  if (!t) return;
  remember(`Changed the ${field} of a trip`);
  for (const r of t.rides) {
    r[field] = value;
    // A new date must not split the trip: the key stays the first leg's id, and every leg
    // gets the same date, so the grouping holds.
  }
  if (field === 'date') LAST_DATE = value;
  saveRides();
  showUndo();
}

/* Opening a trip shows it on the map, the way the line view would, and brings it into
   view if it is not already; the panel stays on the list. */
let FIT_TRIP = null;
function selectTrip(key, ev) {
  // Clicks inside the open trip are for its own fields and buttons.
  if (ev && ev.target.closest('.edit, .legs')) return;
  EDITING = EDITING === key ? null : key;
  FIT_TRIP = EDITING;
  render();
  paintSelection();
}

function showStation(id) {
  VIEW = { kind: 'station', id };
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

function renderStation(el) {
  const s = STATIONS[VIEW.id];
  if (!s) { VIEW = { kind: 'home' }; return render(); }
  /* Real lines first, named trains after them. At Tokyo the Kodama and half a dozen other
     Shinkansen services call, and they were burying the lines you would actually look for. */
  const lines = (s.l || []).map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button>`
    + `<button class="act" onclick="startTrace('${VIEW.id}')">trace a journey from here</button></div>`
    + `<h2 class="sec">Station</h2><div class="big" style="font-size:20px">${esc(s.e || s.n)}`
    + (s.e && s.n && s.e !== s.n ? `<small>${esc(s.n)}</small>` : '') + `</div>`
    + `<h2 class="sec">Lines here (${lines.length})</h2>`;
  if (!lines.length) h += `<p class="muted">No line in the model calls here.</p>`;
  const frac = creditRanges();
  for (const l of lines) h += lineRow(l, lineKm(l, frac), { operator: true, from: VIEW.id });
  el.innerHTML = h;
}

function goHome() {
  // Already home: a click on empty map closes the open trip, as it clears a selected line.
  if (VIEW.kind === 'home') EDITING = null;
  VIEW = { kind: 'home' };
  PICK = { from: null, to: null };
  render();
  paintSelection();
}

/* Back to the line a ride was entered on, with its two ends picked again, so it can be
   checked against the diagram. Nothing is changed unless it is added again. */
function openRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r || !LINE_BY_ID.has(r.line)) return;
  EDITING = null;
  showLine(r.line, r.whole ? null : r.from);
  if (!r.whole) { PICK.to = r.to; PICK.around = !!r.around; render(); paintSelection(); }
}

// ---------------------------------------------------------------- tracing a journey

/* Click the stations of a journey in order, on the map or through search, and each leg
   between two clicks becomes a ride on a line calling at both. No routing across lines: a
   change of train is a station the rider clicks, which is also where they would know they
   changed. Station-to-station routing was dropped (spec §9); this is the hand-drawn mode. */

function startTrace(from) {
  VIEW = { kind: 'trace', stops: from ? [from] : [], choice: {} };
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

/* A click either extends the journey, takes back its last stop (clicking that stop again,
   for a stop put down by mistake), or is refused with a note saying why: a station no
   line from the last stop reaches would only leave a broken leg to clear up. */
function traceAdd(id) {
  if (!STATIONS[id]) return;
  const s = VIEW.stops;
  const last = s[s.length - 1];
  VIEW.note = '';
  if (last === id) return traceBack();
  if (last && !traceReachable().has(id)) {
    VIEW.note = `No line from ${stName(last)} goes to ${stName(id)}. Click the station `
      + `where you changed trains first.`;
    render();
    return;
  }
  s.push(id);
  render();
  paintSelection();
}

function traceBack() {
  VIEW.stops.pop();
  VIEW.note = '';
  delete VIEW.choice[VIEW.stops.length - 1];
  render();
  paintSelection();
}

/* Every station a line from the last stop reaches along its own track, which is exactly
   what traceLegs can turn into a leg. Cached per last stop: a big interchange reaches
   thousands of stations and this is asked on every click and every repaint. */
let REACH_CACHE = { from: null, set: new Set() };
function traceReachable() {
  const last = (VIEW.stops || [])[VIEW.stops.length - 1];
  if (!last) return new Set();
  if (REACH_CACHE.from === last) return REACH_CACHE.set;
  const out = new Set();
  for (const id of (STATIONS[last] || {}).l || []) {
    const line = LINE_BY_ID.get(id);
    if (!line) continue;
    const g = lineGraph(line);
    const seen = new Set([last]), todo = [last];
    while (todo.length) {
      const u = todo.pop();
      for (const [v] of g.get(u) || []) if (!seen.has(v)) { seen.add(v); todo.push(v); }
    }
    for (const v of seen) if (isStop(v)) out.add(v);
  }
  out.delete(last);
  REACH_CACHE = { from: last, set: out };
  return out;
}

function traceChoose(i, lineId) {
  VIEW.choice[i] = lineId;
  render();
  paintSelection();
}

/* A section as long as the straight line between its two stations, over more than a couple
   of kilometres, is the build's fallback for a gap in an OSM route relation rather than
   real track (spec §13 counts 471 of them). Such a path looks shortest precisely because it
   is wrong: JR中央線快速 has Tokyo to Shinjuku as one 6.1 km chord, where the track is 10.3.
   Only on a line the build says has any (`straight_sections`, 19 lines' worth in Japan now
   the build traces gaps along track): elsewhere a straight section is straight track, and
   guessing took 武蔵小杉-新川崎 out of the Tokaido Line's diagram, which then ran its main
   column down the non-stop Sotetsu-through track and left Kawasaki and Kamata as a spur. */
function crowKm(a, b) {
  const kx = Math.cos((a.y + b.y) / 2 * Math.PI / 180) * 111.32, ky = 110.57;
  return Math.hypot((a.x - b.x) * kx, (a.y - b.y) * ky);
}
function looksStraight(p) {
  for (const gid of p.gids) {
    const e = SEC_BY_GID.get(gid);
    if (!e || !e.line.straight_sections || e.sec[2] < 2) continue;
    const A = STATIONS[e.sec[0]], B = STATIONS[e.sec[1]];
    if (A && B && e.sec[2] < 1.01 * crowKm(A, B)) return true;
  }
  return false;
}

/* Each leg's candidates are the lines calling at both of its stations and joining them,
   less any that only join them the long way round (more than 30% over the best real path).
   The pick, unless the rider chose one:
     1. the previous leg's line, since a journey more often continues than changes;
     2. the line that carries on furthest through the following stops, so a journey on one
        train reads as one ride;
     3. a path with no straight-line gap in it;
     4. a register line, then an operating pattern, then a named train, then the shortest.
        Shinjuku to Shibuya to Tokyo went by Narita Express before the named-train rule,
        which reaches exactly as far as the Yamanote and is no longer. */
function traceLegs() {
  const stops = VIEW.stops || [];
  const all = [];
  for (let i = 0; i + 1 < stops.length; i++) {
    const a = stops[i], b = stops[i + 1];
    const onB = new Set((STATIONS[b] || {}).l || []);
    let cands = [];
    for (const id of (STATIONS[a] || {}).l || []) {
      if (!onB.has(id)) continue;
      const line = LINE_BY_ID.get(id);
      const p = line && pathBetween(line, a, b);
      if (p && p.gids.length) cands.push({ line, p, straight: looksStraight(p) });
    }
    const real = cands.filter(c => !c.straight);
    const best = Math.min(...(real.length ? real : cands).map(c => c.p.km));
    cands = cands.filter(c => c.p.km <= best * 1.3 + 1);
    cands.sort((x, y) => (x.straight - y.straight) || (x.p.km - y.p.km)
                         || lineOrder(x.line, y.line));
    all.push({ i, a, b, cands, ids: new Set(cands.map(c => c.line.id)) });
  }
  const reach = (id, i) => {
    let n = 0;
    while (i + n < all.length && all[i + n].ids.has(id)) n++;
    return n;
  };
  let prev = null;
  for (const leg of all) {
    const rank = c => [c.line.id === VIEW.choice[leg.i] ? 0 : 1,
                       c.line === prev ? 0 : 1,
                       -reach(c.line.id, leg.i),
                       c.straight ? 1 : 0,
                       listed(c.line) ? 0 : c.line.service ? 2 : 1,
                       c.p.km];
    const lex = (r, s) => {
      for (let k = 0; k < r.length; k++) if (r[k] !== s[k]) return r[k] - s[k];
      return 0;
    };
    const pick = [...leg.cands].sort((x, y) => lex(rank(x), rank(y)))[0] || null;
    leg.line = pick && pick.line;
    leg.p = pick && pick.p;
    prev = leg.line;
  }
  return all;
}

/* Legs on the same line run together into one ride, where the ride from the first stop to
   the last would take the same track: the short way, or the other way round (Shinjuku to
   Shibuya to Tokyo is the long way round the Yamanote). Where neither matches, they stay
   separate rides so that each still says exactly what was ridden. */
function traceRides(legs, date) {
  const rides = [];
  let cur = null;
  const same = (p, km) => p && Math.abs(p.km - km) < 0.05;
  for (const leg of legs) {
    if (cur && cur.line === leg.line) {
      const km = cur.km + leg.p.km;
      const short = pathBetween(leg.line, cur.from, leg.b);
      const around = !same(short, km) && pathAround(leg.line, cur.from, leg.b);
      if (same(short, km) || same(around, km)) {
        cur.to = leg.b;
        cur.km = km;
        cur.around = !same(short, km);
        continue;
      }
    }
    if (cur) rides.push(cur);
    cur = { line: leg.line, from: leg.a, to: leg.b, km: leg.p.km, around: false };
  }
  if (cur) rides.push(cur);
  return rides.map(r => newRide(r.line.id, r.from, r.to, date, { around: r.around }));
}

function renderTrace(el) {
  const stops = VIEW.stops;
  const legs = traceLegs();
  const bad = legs.filter(l => !l.line).length;
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← cancel</button></div>`
    + `<h2 class="sec">Trace a journey</h2>`
    + `<p class="muted">Click the stations on the map in the order you passed them, or search `
    + `them above. Each leg needs one line calling at both ends, so click at least every `
    + `station where you changed trains. The faint rings are where the next click can go; `
    + `click the last stop again to take it back.</p>`;

  /* The journey as a small strip diagram: a white dot per stop, and between two stops the
     leg's line in its own colour down the rail. A leg with a choice of line looks the same
     as one without, except for the ▾ that says it can be changed. */
  const stopRow = id => `<div class="tst"><div class="rail"><div class="dot"></div></div>`
    + `<b>${esc(stName(id))}</b></div>`;
  h += `<div class="trip">`;
  if (stops.length) h += stopRow(stops[0]);
  for (const leg of legs) {
    const c = leg.line ? lineColour(leg.line) : THEME.off;
    h += `<div class="tleg${leg.line ? '' : ' bad'}" style="--c:${c}"><div class="rail"></div>`
      + `<div class="what">`;
    if (!leg.line) {
      h += `No one line calls at both. Take this stop back and click where you changed.`;
    } else {
      const name = `<span class="nm">${esc(lineName(leg.line))}</span>`;
      h += leg.cands.length > 1
        ? `<label class="pickline">${name}<span class="caret">▾</span>`
          + `<select onchange="traceChoose(${leg.i}, this.value)">`
          + leg.cands.map(c => `<option value="${c.line.id}"${c.line === leg.line ? ' selected' : ''}>`
            + `${esc(lineName(c.line))}, ${c.p.km.toFixed(1)} km`
            + `${c.straight ? ' (map data has a gap here)' : ''}</option>`).join('')
          + `</select></label>`
        : name;
      h += `<span class="km">${leg.p.km.toFixed(1)} km</span>`;
    }
    h += `</div></div>` + stopRow(leg.b);
  }
  h += `</div>`;
  if (!stops.length) h += `<p class="muted">No stations yet.</p>`;
  if (VIEW.note) h += `<p class="tnote">${esc(VIEW.note)}</p>`;

  const km = legs.reduce((s, l) => s + (l.p ? l.p.km : 0), 0);
  h += `<div id="addbar">`;
  if (legs.length) {
    const n = bad ? 0 : traceRides(legs, '').length;
    h += `<div class="o" style="margin-bottom:6px">${legs.length} leg`
      + `${legs.length === 1 ? '' : 's'} · ${km.toFixed(1)} km`
      + `${bad ? ` · ${bad} without a line` : ` · ${n} ride${n === 1 ? '' : 's'}`}</div>`;
  }
  h += `<div class="btnrow"><input type="date" id="ridedate" value="${esc(LAST_DATE)}" />`
    + (legs.length && !bad
      ? `<button class="act go" onclick="commitTrace()">Add</button>` : '')
    + (stops.length ? `<button class="act" onclick="traceBack()">remove last stop</button>` : '')
    + `</div></div>`;
  el.innerHTML = h;
}

function commitTrace() {
  const legs = traceLegs();
  if (!legs.length || legs.some(l => !l.line)) return;
  const d = document.getElementById('ridedate');
  LAST_DATE = d ? d.value : '';
  const rides = traceRides(legs, LAST_DATE);
  const last = VIEW.stops[VIEW.stops.length - 1];
  addRides(rides, `Added a journey to ${stName(last)}, ${rides.length} `
                  + `ride${rides.length === 1 ? '' : 's'}`);
  goHome();
}

// ---------------------------------------------------------------- operators

/* One entry per operator as the panel counts them (opKey), holding its listed lines.
   Reached from the operator rows on the home view and from search, and the place to mark a
   whole operator ridden in one go. */
let OPS = [];
const OP_INDEX = new Map();

function buildOps() {
  const by = new Map();
  for (const line of LINES) {
    if (!listed(line)) continue;
    const key = opKey(line);
    if (!by.has(key)) by.set(key, { key, lines: [], km: 0, raw: new Set() });
    const o = by.get(key);
    o.lines.push(line);
    if (line.operator) o.raw.add(line.operator);
    if (line.operator_en) o.raw.add(line.operator_en);
  }
  /* An operator's length is the track its lines own, not the sum of its lines: Prague's
     trams share the street, and each piece of it belongs to one of them. */
  for (const o of by.values())
    o.km = o.lines.reduce((s, l) => s + partsOf(l).reduce((t, p) => t + ownedKm(p), 0), 0);
  OPS = [...by.values()].sort((a, b) => b.km - a.km);
  // Rebuilt whenever a country's lines arrive, so positions move: views hold the key.
  OP_INDEX.clear();
  OPS.forEach((o, i) => {
    OP_INDEX.set(o.key, i);
    o._n = norm(o.key);
    o._k = norm([o.key, ...o.raw].join(' '));
  });
}

function showOp(i) {
  if (!OPS[i]) return;
  VIEW = { kind: 'op', key: OPS[i].key };
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

function renderOp(el) {
  const i = OP_INDEX.get(VIEW.key);
  const o = OPS[i];
  if (!o) { VIEW = { kind: 'home' }; return render(); }
  const frac = creditRanges();
  const rows = o.lines.map(line => {
    const km = lineKm(line, frac);
    return { line, km, pct: km / Math.max(line.km, 0.001) };
  });
  // Started lines first, most complete at the top; untouched ones after, longest first.
  rows.sort((a, b) => (b.pct > 0.0005) - (a.pct > 0.0005) || b.pct - a.pct
                      || b.line.km - a.line.km);
  // Over the track its lines own, as its length is.
  const { R } = creditState();
  const done = o.lines.reduce((s, l) => s + partsOf(l).reduce((t, p) => t + ownedDone(p, R), 0),
                              0);
  const finished = rows.filter(r => r.pct > 0.999).length;
  const left = rows.length - finished;
  const pct = 100 * done / Math.max(o.km, 0.001);

  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button></div>`
    + `<h2 class="sec">Operator</h2>`
    + `<div class="big" style="font-size:19px">${esc(o.key)}`
    + `<small>${rows.length} line${rows.length === 1 ? '' : 's'} · `
    + `${Math.round(o.km).toLocaleString()} km</small></div>`
    + `<div class="meter" style="margin-top:8px"><i style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>`
    + `<div class="o muted">${done.toFixed(1)} km ridden, ${pct.toFixed(1)}% · `
    + `${finished} of ${rows.length} finished</div>`;
  /* Marks every line not yet finished as ridden in full, one whole-line ride each, so it is
     one undo to take back and each line can still be removed on its own afterwards. */
  if (left) {
    h += `<div class="btnrow"><input type="date" id="opdate" value="${esc(LAST_DATE)}" />`
      + `<button class="act" onclick="rideOperator(${i})">rode every line `
      + `(${left} to add)</button></div>`;
  }
  h += `<h2 class="sec">Lines</h2>`;
  for (const r of rows) h += lineRow(r.line, r.km);
  el.innerHTML = h;
}

function rideOperator(i) {
  const o = OPS[i];
  if (!o) return;
  const frac = creditRanges();
  const todo = o.lines.filter(line => lineKm(line, frac) / Math.max(line.km, 0.001) <= 0.999);
  if (!todo.length) return;
  if (!confirm(`Mark all ${todo.length} unfinished line${todo.length === 1 ? '' : 's'} of `
               + `${o.key} as ridden?`)) return;
  const d = document.getElementById('opdate');
  LAST_DATE = d ? d.value : LAST_DATE;
  addRides(todo.map(line => wholeRide(line, LAST_DATE)),
           `Added all ${todo.length} lines of ${o.key}`);
}

function showLine(id, preselect) {
  VIEW = { kind: 'line', id };
  PICK = { from: preselect || null, to: null };
  openPanel(true);
  render();
  paintSelection();
  // A line over a border: bring in the rest of it, which redraws it whole as it arrives.
  loadLineRegions(id);
  // The camera does NOT move. Selecting a line while looking at a particular place should
  // leave you looking at that place; "zoom to line" is there when the whole line is wanted.
}

async function fitLine(id) {
  const line = LINE_BY_ID.get(id);
  const g = await geomFor(id);
  let minx = 180, miny = 90, maxx = -180, maxy = -90, any = false;
  for (const pts of Object.values(g)) {
    for (const [x, y] of pts) {
      any = true;
      if (x < minx) minx = x;
      if (x > maxx) maxx = x;
      if (y < miny) miny = y;
      if (y > maxy) maxy = y;
    }
  }
  if (any) map.fitBounds([[minx, miny], [maxx, maxy]], { padding: 60, duration: 0 });
}

/* ---------------------------------------------------------------- strip diagram layout

   A LINE'S TRACK IS A GRAPH, and 71 of Japan's register lines are not a chain: the register
   gives the main line's name to parallel routes and freight lines, so the JR East Tokaido
   Line has 37 stations, 52 sections and 16 independent loops, and the Hinkaku route through
   Musashi-Kosugi runs beside the main one from Shinagawa to Tsurumi. One list in one variant's
   order could not show that; it shuffled the second route into the first.

   So the diagram is laid out the way metro maps draw branches. The MAIN ROUTE is the longest
   run through the line (the shortest path between the two stations furthest apart), straight
   down lane 0, north at the top. Then, repeatedly, any unplaced track leaving a placed
   station is followed until it rejoins placed track or ends: that route goes in the nearest
   free lane beside, with its stations at positions between where it leaves and rejoins, so
   everything reads top to bottom roughly in order along the line. A route with no station of
   its own (a freight line bypassing stations) is drawn as a bare arc in its lane.

   Two special cases. A PURE LOOP (the Yamanote) is one lane with caps at both ends saying it
   continues round. A line in SEPARATE PIECES (a Swiss line crossing Germany; a register gap)
   is drawn piece by piece with a marked gap between. A straight-line fallback section is left
   out of the drawing where the stations it joins are connected some other way anyway: it is
   a gap in the map data, not a route, and it made 西鉄天神大牟田線 look like a loop. */
function lineLayout(line) {
  if (line._lay) return line._lay;
  const edges = line.sections.filter(s => s[0] !== s[1])
    .map(([a, b, km, gid]) => ({ a, b, km: Math.max(km, 0.001), gid }));
  const adjOf = list => {
    const m = new Map();
    for (const e of list) {
      if (!m.has(e.a)) m.set(e.a, []);
      if (!m.has(e.b)) m.set(e.b, []);
      m.get(e.a).push(e); m.get(e.b).push(e);
    }
    return m;
  };
  const other = (e, u) => (e.a === u ? e.b : e.a);
  const reach = (adj, from, skip) => {
    const seen = new Set([from]), todo = [from];
    while (todo.length) {
      const u = todo.pop();
      for (const e of adj.get(u) || []) {
        if (e === skip) continue;
        const v = other(e, u);
        if (!seen.has(v)) { seen.add(v); todo.push(v); }
      }
    }
    return seen;
  };
  /* One at a time, against what is left: 幕張本郷 hangs on two straight-line sections, each
     of which looked removable while the other was still there, and dropping both at once
     cut the station off. */
  let live = edges;
  for (const e of edges) {
    if (!looksStraight({ gids: [e.gid] })) continue;
    if (reach(adjOf(live), e.a, e).has(e.b)) live = live.filter(x => x !== e);
  }

  /* SHORTCUTS ARE NOT DRAWN: a section with another way between the same two stations, at
     most about a third longer, is left out of the layout before anything is placed. That
     covers express track beside a stopping route (the Yokosuka tracks from Tokyo to
     Shinagawa beside the stopping Tokaido tracks), duplicated sections, and the Oedo
     Line's Shinjuku to Shinjuku-nishiguchi, 1.48 km of track passing 152 m from the point
     the register gives Tochomae: no train in service runs it without calling at Tochomae,
     but laid out, it made the line fork one station early. Longest first, each against
     what is left, so two shortcuts never excuse each other. The section still counts, and
     a ride over it lights the way beside it (`hidden`). */
  const hidden = new Map();          // gid -> the gids of the way drawn instead
  const wayAround = (list, e) => {
    const adj = adjOf(list.filter(x => x !== e));
    const limit = e.km * 1.35 + 0.5;
    const dist = new Map([[e.a, 0]]), prev = new Map(), done = new Set();
    for (;;) {
      let u = null, bd = Infinity;
      for (const [k, d] of dist) if (!done.has(k) && d < bd) { bd = d; u = k; }
      if (u === null || bd > limit) return null;
      if (u === e.b) break;
      done.add(u);
      for (const x of adj.get(u) || []) {
        const v = other(x, u);
        if (bd + x.km < (dist.has(v) ? dist.get(v) : Infinity)) { dist.set(v, bd + x.km); prev.set(v, x); }
      }
    }
    const gids = [];
    for (let c = e.b; c !== e.a;) { const x = prev.get(c); gids.push(x.gid); c = other(x, c); }
    return gids;
  };
  for (const e of [...live].sort((p, q) => q.km - p.km)) {
    const alt = wayAround(live, e);
    if (alt) { hidden.set(e.gid, alt); live = live.filter(x => x !== e); }
  }
  // A shortcut's way round may itself run over a shortcut set aside later; follow it through.
  const expand = (gids, depth = 0) => gids.flatMap(g =>
    hidden.has(g) && depth < 8 ? expand(hidden.get(g), depth + 1) : [g]);
  for (const [g, alt] of hidden) hidden.set(g, expand(alt));
  const adj = adjOf(live);

  // The pieces, north first.
  const comps = [], done = new Set();
  for (const s of adj.keys()) {
    if (done.has(s)) continue;
    const nodes = [...reach(adj, s)];
    nodes.forEach(n => done.add(n));
    comps.push(nodes);
  }
  const lat = id => (STATIONS[id] || {}).y || 0;
  comps.sort((p, q) => Math.max(...q.map(lat)) - Math.max(...p.map(lat)));
  /* A line over a border is in the order its pieces join end to end (chainDisplays), so
     Brussels, Lille and Rotterdam read along the route rather than by latitude. */
  if (line.parts) {
    const at = new Map(line.display.map((id, i) => [id, i]));
    const first = nodes => Math.min(...nodes.map(n => (at.has(n) ? at.get(n) : Infinity)));
    const north = new Map(comps.map((c, i) => [c, i]));
    comps.sort((p, q) => (first(p) - first(q)) || (north.get(p) - north.get(q)));
  }

  const pieces = comps.map(nodes => layoutPiece(line, nodes, adj, other));
  const lanes = Math.max(1, ...pieces.map(p => p.lanes));
  return (line._lay = { pieces, lanes, hidden });
}

function layoutPiece(line, nodes, adj, other) {
  const inPiece = new Set(nodes);
  const edges = [...new Set(nodes.flatMap(n => adj.get(n)))];
  const lat = id => (STATIONS[id] || {}).y || 0;

  // A pure loop: every station on exactly two sections, as many sections as stations.
  if (nodes.length > 2 && edges.length === nodes.length
      && nodes.every(n => adj.get(n).length === 2)) {
    const start = line.display.find(id => inPiece.has(id)) || nodes[0];
    const order = [start], placed = [];
    let cur = start, came = null;
    for (;;) {
      const e = adj.get(cur).find(x => x !== came);
      const v = other(e, cur);
      if (v === start) return { loop: true, rows: order.map(id => ({ id, lane: 0 })),
                                edges: placed, wrap: e, lanes: 1 };
      placed.push({ ...e, lane: 0 });
      order.push(v); came = e; cur = v;
    }
  }

  // Dijkstra over this piece, naive: pieces are at most a couple of hundred stations.
  const dijkstra = src => {
    const dist = new Map([[src, 0]]), prev = new Map(), seen = new Set();
    for (;;) {
      let u = null, best = Infinity;
      for (const [k, d] of dist) if (!seen.has(k) && d < best) { best = d; u = k; }
      if (u === null) break;
      seen.add(u);
      for (const e of adj.get(u)) {
        const v = other(e, u), nd = best + e.km;
        if (nd < (dist.has(v) ? dist.get(v) : Infinity)) { dist.set(v, nd); prev.set(v, e); }
      }
    }
    return { dist, prev };
  };
  /* The main route runs between the two stations furthest apart, among ALL stations, not
     only the ends of track: parallel tracks leave Tokyo in two directions, so it is not an
     end of the Tokaido Line's graph, and a first version ran the main route from Omori
     through Musashi-Kosugi with Tokyo pushed out to a side lane. Very large pieces try only
     the ends of track and every fourth station, to stay quick. */
  const cands = nodes.length <= 250 ? nodes
    : nodes.filter((n, i) => adj.get(n).length === 1 || i % 4 === 0);
  let best = { d: -1 };
  for (const s of cands) {
    const r = dijkstra(s);
    for (const t of cands) {
      const d = r.dist.get(t);
      if (t !== s && d > best.d) best = { d, s, t, prev: r.prev };
    }
  }
  const pos = new Map(), laneOf = new Map(), used = new Set(), placedEdges = [];
  const intervals = [[]];                 // per lane, the [lo, hi] spans already taken
  // The main route's two ends, until a loop hanging off one of them carries it on (below).
  const ends = { first: null, last: null };
  if (best.d < 0) {                       // a single station, or two joined only to each other
    pos.set(nodes[0], 0); laneOf.set(nodes[0], 0);
  } else {
    let path = [best.t];
    let pedges = [];
    for (let cur = best.t; cur !== best.s;) {
      const e = best.prev.get(cur);
      pedges.push(e);
      cur = other(e, cur);
      path.push(cur);
    }
    path.reverse(); pedges.reverse();

    /* THE MAIN ROUTE STOPS AT THE STATIONS. The shortest path is not what a rider means by
       the line: on the JR East Tokaido Line it ran Tokyo to Shimbashi and Takanawa Gateway
       to Nishi-Oi on tracks that pass Yurakucho and Shinagawa without a stop, and took the
       Hinkaku route through Musashi-Kosugi because it is shorter than the main line through
       Kawasaki. So wherever another route between two stations of the main one has MORE
       stations and is at most about a third longer, it takes that stretch's place, until
       nothing changes. */
    /* Every route off the main one that comes back to it, found by a small search from each
       of its stations (a first version walked one route per section and, taking the first
       unused section at every fork, let one walk use up the sections another needed, so
       Takanawa Gateway to Nishi-Oi via Shinagawa was never seen). Capped, since only the
       JR trunk lines have more than a handful. The best improvement goes in each round. */
    const MAX_ROUTES = 400;
    for (let iter = 0; iter < 40; iter++) {
      const idx = new Map(path.map((id, i) => [id, i]));
      const onPath = new Set(pedges);
      let best = null;
      for (const u of path) {
        let found = 0, steps = 0;
        const walk = (cur, route, redges, km) => {
          for (const e of adj.get(cur)) {
            if (found >= MAX_ROUTES || ++steps > 20000) return;
            if (onPath.has(e) || redges.includes(e)) continue;
            const v = other(e, cur);
            if (route.includes(v)) continue;
            if (idx.has(v)) {
              found++;
              if (v === u) continue;
              let i = idx.get(u), j = idx.get(v);
              let r = [...route, v], re = [...redges, e];
              if (i > j) { [i, j] = [j, i]; r = r.reverse(); re = re.reverse(); }
              const gain = (r.length - 2) - (j - i - 1);
              const segKm = pedges.slice(i, j).reduce((s, x) => s + x.km, 0);
              const earKm = km + e.km;
              if (gain > 0 && earKm <= segKm * 1.35 + 0.5
                  && (!best || gain > best.gain)) best = { i, j, r, re, gain };
            } else if (route.length < 40) {
              walk(v, [...route, v], [...redges, e], km + e.km);
            }
          }
        };
        walk(u, [u], [], 0);
      }
      if (!best) break;
      path = [...path.slice(0, best.i), ...best.r, ...path.slice(best.j + 1)];
      pedges = [...pedges.slice(0, best.i), ...best.re, ...pedges.slice(best.j)];
    }
    // North at the top: the direction a relation happens to be drawn in is arbitrary.
    if (lat(path[0]) < lat(path[path.length - 1])) { path.reverse(); pedges.reverse(); }
    let km = 0;
    path.forEach((id, i) => {
      if (i) km += pedges[i - 1].km;
      pos.set(id, km); laneOf.set(id, 0);
    });
    for (const e of pedges) { used.add(e); placedEdges.push({ ...e, lane: 0 }); }
    intervals[0].push([0, km]);
    ends.first = path[0]; ends.last = path[path.length - 1];
  }

  // Everything else, one route at a time, each in the nearest lane free over its span.
  const EPS = 1e-6;
  const blockAt = new Map();   // station -> how many side-route stations already follow it
  const freeLane = (lo, hi, above) => {
    for (let L = above + 1; ; L++) {
      if (!intervals[L]) intervals[L] = [];
      if (!intervals[L].some(([a, b]) => lo < b + EPS && a < hi + EPS)) {
        intervals[L].push([lo, hi]);
        return L;
      }
    }
  };
  for (;;) {
    // Start from the earliest placed station with track still to place, so routes come out
    // in order down the line.
    let start = null, first = null;
    for (const id of [...pos.keys()].sort((p, q) => pos.get(p) - pos.get(q))) {
      first = adj.get(id).find(e => !used.has(e));
      if (first) { start = id; break; }
    }
    if (!start) break;
    const route = [start], redges = [];
    let cur = start, e = first;
    for (;;) {
      used.add(e); redges.push(e);
      cur = other(e, cur);
      if (route.includes(cur) && !pos.has(cur)) {
        // Closed back on itself before rejoining (a balloon loop at a branch's end): the
        // closing section is drawn, but the station is not listed twice.
        placedEdges.push({ ...e, lane: -1 });
        redges.pop();
        break;
      }
      route.push(cur);
      if (pos.has(cur)) break;                      // rejoined placed track
      const next = adj.get(cur).find(x => !used.has(x));
      if (!next) break;                             // the end of a branch
      e = next;
    }
    const end = route[route.length - 1], rejoins = pos.has(end) && route.length > 1;
    const p0 = pos.get(start);
    let p1 = rejoins ? pos.get(end) : p0;
    /* A ROUTE'S STATIONS STAY TOGETHER, listed as one block straight after the station the
       route leaves from, and the track back to where it rejoins runs down its lane as a thin
       line with no station on it. A first version spread them between the main route's
       stations by distance, so near Shiojiri the Tatsuno route and the tunnel route
       alternated row by row, and one loop read as several branches crossing (Anita,
       2026-09-30). Blocks leaving the same station follow one another rather than mix. */
    const interior = route.slice(1, rejoins ? -1 : undefined);

    /* A LOOP AT THE END OF THE LINE IS WALKED IN ONE COLUMN. Where a route rejoins at one of
       the main route's two ends, the main route carries on round it: its stations continue
       the main lane past that end, and only the section closing the loop runs back to the
       junction as a thin line. The Oedo Line reads Hikarigaoka ... Tochomae, Shinjuku-
       nishiguchi ... Monzen-nakacho, Tsukishima ... Shinjuku, back to Tochomae, the order its
       trains run, where splitting the loop into two halves met at Monzen-nakacho. */
    const T = rejoins && interior.length
      ? [ends.first, ends.last].find(t => t && (t === start || t === end) && start !== end)
      : null;
    if (T) {
      const U = T === start ? end : start;
      const inner = T === start ? interior : [...interior].reverse();
