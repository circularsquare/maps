<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>helper1m</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <div class="panel">
      <label>Country</label>
      <select id="country-select"></select>
    </div>
    <div class="panel">
      <label>Admin level</label>
      <div id="level-radios"></div>
    </div>
    <div class="panel basemap-toggle">
      <label>Basemap</label>
      <div id="basemap-radios">
        <label><input type="radio" name="basemap" value="streets" checked> Streets</label>
        <label><input type="radio" name="basemap" value="topo"> Topo</label>
        <label><input type="radio" name="basemap" value="relief"> Elevation</label>
      </div>
      <div id="relief-legend" hidden>
        <div id="relief-ramp"></div>
        <div id="relief-labels"><span id="relief-min"></span><span id="relief-max"></span></div>
      </div>
      <div class="opacity-row">
        <input type="range" id="fill-opacity" min="0" max="100" step="5" value="55">
        <span id="fill-opacity-value">55%</span>
      </div>
      <div class="hint">density fill over the basemap</div>
    </div>
    <div class="panel" id="group-panel">
      <div class="panel-header">
        <span id="group-panel-label">States</span>
        <span class="group-btns">
          <button id="groups-all">all</button>
          <button id="groups-none">none</button>
        </span>
      </div>
      <div id="group-list"></div>
    </div>
    <div class="panel" id="info-panel">
      <div class="empty">Click a region for details.</div>
    </div>
    <div class="panel" id="selection-panel">
      <div class="panel-header">
        <span>Selection <span id="selection-count">0</span></span>
        <button id="clear-selection">clear</button>
      </div>
      <div id="selection-summary" class="empty">Shift-click regions to add.</div>
      <ul id="selection-list"></ul>
    </div>
  </div>
  <div id="sidebar-resizer" title="Drag to resize. Double-click to reset."></div>
  <div id="map"></div>
  <div id="hover-tip" hidden></div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
