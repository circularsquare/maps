<!doctype html>
<meta charset="utf-8">
<title>River schematics — Asia</title>
<style>
  :root{
    --bg:#0f1416; --panel:#161d20; --ink:#e8eef0; --dim:#7b8c93; --line:#253036;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  header{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12px;max-width:80ch}
  .ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
       padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  label{color:var(--dim);display:flex;gap:6px;align-items:center;font-size:12px}
  select,input[type=range]{accent-color:#4aa3d6}
  select{background:#0d1214;color:var(--ink);border:1px solid var(--line);
         border-radius:4px;padding:3px 6px;font:inherit}
  button{background:#0d1214;color:var(--ink);border:1px solid var(--line);
         border-radius:4px;padding:3px 9px;font:inherit;cursor:pointer}
  button:hover{background:#1b2429}
  button:disabled{opacity:.35;cursor:default}
  #wrap{position:relative}
  canvas{display:block;width:100%;cursor:pointer}
  #tip{position:fixed;pointer-events:none;background:#05090aee;border:1px solid var(--line);
       border-radius:5px;padding:7px 9px;font-size:12px;display:none;z-index:9;
       box-shadow:0 4px 14px #0008;max-width:260px}
  #tip b{font-size:13px}
  .k{color:var(--dim)}
  .note{padding:12px 20px 26px;color:var(--dim);font-size:12px;max-width:84ch}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;
          vertical-align:-1px;margin-right:4px}
  .hide{display:none}
  #detail{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;
          padding:9px 20px;background:#131a1d;border-bottom:1px solid var(--line)}
  /* #detail is an ID selector, so it outranks .hide -- without this the bar
     never actually hid and "back" appeared to do nothing. */
  #detail.hide{display:none}
  #detail b{font-size:15px}
  #detail .st{color:var(--dim);font-size:12px}
  #detail .st i{color:var(--ink);font-style:normal}
</style>

<header>
  <h1>Rivers of Asia</h1>
  <div class="sub" id="blurb"></div>
</header>

<div class="ctl" id="bar">
  <label>layout
    <select id="mode">
      <option value="true">true shape</option>
      <option value="straight">straightened</option>
    </select>
  </label>
  <label>sort
    <select id="sort">
      <option value="len">by length</option>
      <option value="lost">by water lost</option>
      <option value="area">by basin area</option>
    </select>
  </label>
  <label>width
    <select id="wmode">
      <option value="rel">per river (readable)</option>
      <option value="abs">absolute (comparable)</option>
    </select>
  </label>
  <label>width&times;<input type="range" id="wgain" min="0.5" max="8" step="0.1" value="2.8"></label>
  <label id="bendwrap" title="1 = bends drawn at true scale relative to length">
    bends&times;<input type="range" id="xgain" min="1" max="8" step="0.5" value="1.5">
    <span id="xg" style="min-width:2ch">1.5</span>
  </label>
  <label>columns<input type="range" id="cols" min="3" max="10" step="1" value="7"></label>
  <label>per page
    <select id="per">
      <option>14</option><option selected>21</option><option>28</option><option>40</option>
    </select>
  </label>
  <span id="pager" style="display:flex;gap:6px;align-items:center">
    <button id="prev">&lsaquo;</button>
    <span id="pg" style="color:var(--dim);min-width:7ch;text-align:center"></span>
    <button id="next">&rsaquo;</button>
  </span>
  <label id="rotwrap"><input type="checkbox" id="rot"> point rivers downward</label>
  <span id="ms" style="color:#4e6068;font:11px monospace" title="last render time"></span>
  <span style="color:var(--dim)">
    <span class="swatch" style="background:#3f8fbf"></span>gaining
    <span class="swatch" style="background:#c96a2a;margin-left:8px"></span>losing
    <span class="swatch" style="background:#a03535;margin-left:8px"></span>losing badly
  </span>
</div>

<div id="detail" class="hide"></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="tip"></div>
<div class="note" id="foot"></div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const $ = id => document.getElementById(id);
let DATA = null, NAMES = {}, cells = [];
const STATE = { page: 0, focus: null };

const BLURB = {
  true: `Each basin drawn in its true projected shape, scaled to fill its own box —
         no straightening, so nothing is distorted and ribbon width means the same
         thing everywhere. Width is natural discharge; where a river <b>loses</b>
         water downstream the ribbon narrows and warms. Click any river to enlarge it.`,
  straight: `Vertical axis is along-channel distance to the terminus, so every mouth sits
         on the baseline at zero and each river points straight down while keeping its
         local bends. Tributaries are fanned out for legibility — that sideways stretch
         is layout, not geography, and it is not width-preserving. Click to enlarge.`
};

// ---- colour + width, quantised ---------------------------------------------
// Rivers are drawn as STROKED polylines batched by (colour, width), not as
// per-segment filled quads. Filling was the bottleneck: a Path2D holding ~100k
// overlapping quads makes the rasteriser tessellate one huge self-intersecting
// polygon, which is superlinear and froze the tab. Stroking is per-segment and
// roughly linear, and round joins give the same ribbon look.
const NB = 16, WB = 14, BCOL = new Array(NB);
const MIND2 = 0.75 * 0.75;         // drop points closer than this, in px²
(function () {
  const a = [0x3f,0x8f,0xbf], b = [0xc9,0x6a,0x2a], c = [0x9c,0x2b,0x2b];
  for (let i = 0; i < NB - 1; i++) {
    const t = i / (NB - 2);
    const m = t < 0.5 ? a.map((v,j) => v + (b[j]-v) * (t/0.5))
                      : b.map((v,j) => v + (c[j]-v) * ((t-0.5)/0.5));
    BCOL[i] = `rgb(${m.map(Math.round).join(',')})`;
  }
  BCOL[NB-1] = '#3f8fbf';                    // healthy / still gaining
})();
const bidx = r => r > 0.985 ? NB-1
  : Math.min(NB-2, Math.floor(Math.min(1, (0.985 - r) / 0.6) * (NB - 2)));

// Anything thrown in here used to leave a black canvas and no explanation.
function fail(where, err) {
  console.error(where, err);
  $('blurb').innerHTML = `<b style="color:#e06c6c">${where}:</b> ` +
    `<span style="color:#e8b0b0">${(err && err.message) || err}</span>`;
}
addEventListener('error', e => fail('script error', e.error || e.message));

// cache:'no-cache' forces revalidation on every load. python -m http.server
// sends Last-Modified but no Cache-Control/ETag, so Chrome applies a heuristic
// freshness window and will serve a stale basins.json WITHOUT asking the server
// -- which silently breaks the page whenever build.py adds a field.
const FETCH = { cache: 'no-cache' };

Promise.all([
  fetch('basins.json', FETCH).then(r => {
    if (!r.ok) throw new Error(`basins.json → HTTP ${r.status}`);
    return r.json();
  }),
  fetch('names.json', FETCH).then(r => r.json()).catch(() => ({}))
]).then(([d, n]) => {
  DATA = d; NAMES = n;
  let maxPts = 0;
  for (const b of DATA.basins) {
    for (const s of b.stems) {
      const r = new Float32Array(s.q.length);
      let run = 0;
      for (let i = 0; i < s.q.length; i++) { run = Math.max(run, s.q[i]); r[i] = run > 0 ? s.q[i] / run : 1; }
      s.r = r;
      s.bk = Uint8Array.from(r, bidx);        // precomputed bucket per point
      maxPts = Math.max(maxPts, s.q.length);
    }
    b.lost = 1 - b.term_cms / b.peak_cms;
    b.name = NAMES[b.main_riv] || ('basin ' + b.main_riv);
    const m = b.stems[0];
    if (!m.gx) throw new Error('basins.json has no true-shape geometry — it is ' +
      'from an older build.py. Re-run build.py, then hard-reload (Ctrl+Shift+R).');
    const last = m.gx.length - 1;
    b.theta = Math.atan2(m.gy[last] - m.gy[0], m.gx[last] - m.gx[0]);
  }
  SX = new Float64Array(maxPts); SY = new Float64Array(maxPts);

  $('foot').innerHTML =
    `${DATA.basins.length} basins · HydroRIVERS v1.0. Discharge is <b>naturalized</b> ` +
    `WaterGAP v2.2 (1971–2000): it models evaporative loss in arid reaches but <b>not</b> ` +
    `irrigation withdrawal. So the Tarim and Syr Darya show their real thirst, while the ` +
    `Yellow River — which failed to reach the sea for 226 days in 1997 — reads as losing ` +
    `nothing. Deltas are single channels: HydroRIVERS cannot represent distributaries.`;

  for (const el of ['mode','wmode','wgain','xgain','cols','rot'])
    $(el).addEventListener('input', draw);
  for (const el of ['sort','per'])
    $(el).addEventListener('input', () => { STATE.page = 0; draw(); });
  $('prev').addEventListener('click', () => { STATE.page--; draw(); });
  $('next').addEventListener('click', () => { STATE.page++; draw(); });
  window.addEventListener('resize', draw);
  addEventListener('keydown', e => { if (e.key === 'Escape' && STATE.focus) { setFocus(null); } });
  addEventListener('hashchange', fromHash);
  fromHash();
}).catch(err => fail('load failed', err));

// #tarim or #40348332 opens straight into that river, so a view is linkable
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const hit = h && DATA.basins.find(b => String(b.main_riv) === h || slug(b.name) === slug(h));
  STATE.focus = hit ? hit.main_riv : null;
  draw();
}
function setFocus(id) {
  STATE.focus = id;
  const b = id != null && DATA.basins.find(x => x.main_riv === id);
  history.replaceState(null, '', b ? '#' + slug(b.name) : location.pathname);
  draw();
}

// scratch buffers, reused across stems so drawing allocates nothing
let SX, SY, NX, NY;

function sorted() {
  const key = $('sort').value;
  return DATA.basins.slice().sort((p, q) =>
    key === 'lost' ? q.lost - p.lost
    : key === 'area' ? q.upland - p.upland
    : q.length_km - p.length_km);
}

function draw() {
  const T0 = performance.now();
  const mode = $('mode').value, isTrue = mode === 'true';
  const gain = +$('wgain').value, wmode = $('wmode').value;
  const xgain = +$('xgain').value; $('xg').textContent = xgain;
  const rot = $('rot').checked;
  const focus = STATE.focus != null ? DATA.basins.find(b => b.main_riv === STATE.focus) : null;

  $('bendwrap').classList.toggle('hide', isTrue);
  $('rotwrap').classList.toggle('hide', !isTrue);
  $('blurb').innerHTML = BLURB[mode];
  $('detail').classList.toggle('hide', !focus);
  $('pager').style.visibility = focus ? 'hidden' : 'visible';

  const all = sorted();
  const per = +$('per').value;
  const pages = Math.max(1, Math.ceil(all.length / per));
  STATE.page = Math.max(0, Math.min(STATE.page, pages - 1));
  $('pg').textContent = `${STATE.page + 1} / ${pages}`;
  $('prev').disabled = STATE.page === 0;
  $('next').disabled = STATE.page >= pages - 1;

  const list = focus ? [focus] : all.slice(STATE.page * per, (STATE.page + 1) * per);
  const cols = focus ? 1 : +$('cols').value;

  if (focus) {
    $('detail').innerHTML =
      `<b>${focus.name}</b>` +
      `<span class="st">basin <i>${Math.round(focus.upland).toLocaleString()} km²</i></span>` +
      `<span class="st">length <i>${Math.round(focus.length_km).toLocaleString()} km</i></span>` +
      `<span class="st">peak flow <i>${Math.round(focus.peak_cms).toLocaleString()} m³/s</i></span>` +
      `<span class="st">at terminus <i>${Math.round(focus.term_cms).toLocaleString()} m³/s</i>` +
      (focus.lost > 0.005 ? ` <i style="color:#d08a4a">(−${(focus.lost*100).toFixed(0)}%)</i>` : '') + `</span>` +
      `<span class="st">${focus.endorheic ? '<i style="color:#c98a4a">inland sink — never reaches the sea</i>'
                                          : 'reaches the ocean'}</span>` +
      `<span class="st">tributaries <i>${focus.stems.length}</i></span>` +
      `<button id="back">&larr; back</button>`;
    $('back').addEventListener('click', () => setFocus(null));
  }

  const dpr = devicePixelRatio || 1;
  const W = cv.parentElement.clientWidth;
  const wrapTop = cv.parentElement.getBoundingClientRect().top;
  const cw = W / cols;
  const ch = focus ? Math.max(430, innerHeight - wrapTop - 18) : cw * (isTrue ? 1.0 : 1.5);
  const H = Math.ceil(list.length / cols) * ch;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const padT = focus ? 16 : 34, padB = focus ? 16 : 12, padX = focus ? 24 : 8;
  const globalQ = Math.max(...all.map(b => b.peak_cms));

  // one Path2D per (colour, width) bucket for the whole page
  const paths = new Array(NB * WB);
  const W0 = gain * 2.2 * Math.sqrt(cw / 160);      // widest stroke, px

  cells = [];
  list.forEach((b, i) => {
    const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch;
    const innerH = ch - padT - padB, innerW = cw - padX * 2;
    cells.push({ b, cx, cy, cw, ch });

    let ca = 1, sa = 0, k = 1, ox = 0, oy = 0;          // true-shape transform
    let ky = 1, kx = 1, ko = 1, base = 0;               // straightened transform

    if (isTrue) {
      if (rot) { const a = -b.theta + Math.PI/2; ca = Math.cos(a); sa = Math.sin(a); }
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const s of b.stems) for (let j = 0; j < s.gx.length; j++) {
        const u = s.gx[j] * ca - s.gy[j] * sa, v = s.gx[j] * sa + s.gy[j] * ca;
        if (u < x0) x0 = u; if (u > x1) x1 = u;
        if (v < y0) y0 = v; if (v > y1) y1 = v;
      }
      k = Math.min(innerW / Math.max(x1 - x0, 1), innerH / Math.max(y1 - y0, 1));
      ox = cx + cw/2 - (x0 + x1)/2 * k;
      oy = cy + padT + innerH/2 + (y0 + y1)/2 * k;
    } else {
      ky = innerH / b.length_km; kx = ky * xgain;
      let omin = 1e9, omax = -1e9, lmax = 0;
      for (const s of b.stems) {
        for (const v of s.ox) { if (v < omin) omin = v; if (v > omax) omax = v; }
        for (const v of s.x) lmax = Math.max(lmax, Math.abs(v));
      }
      const osp = Math.max(omax - omin, 1);
      ko = Math.min(Math.max(0, innerW - 2 * lmax * kx) / osp, 0.85 * b.length_km * ky / osp);
      ox = cx + cw/2 - (omin + omax)/2 * ko;
      base = cy + ch - padB;
    }

    const qref = wmode === 'abs' ? globalQ : b.peak_cms;

    if (!isTrue) {
      ctx.strokeStyle = b.endorheic ? '#5a4433' : '#2c4450';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx + 4, base + .5); ctx.lineTo(cx + cw - 4, base + .5); ctx.stroke();
    }

    for (const s of b.stems) {
      const n = s.q.length;
      // project straight into the shared scratch buffers -- no per-point arrays
      if (isTrue) {
        for (let j = 0; j < n; j++) {
          const u = s.gx[j] * ca - s.gy[j] * sa, v = s.gx[j] * sa + s.gy[j] * ca;
          SX[j] = ox + u * k; SY[j] = oy - v * k;
        }
      } else {
        for (let j = 0; j < n; j++) {
          SX[j] = ox + s.ox[j] * ko + s.x[j] * kx; SY[j] = base - s.y[j] * ky;
        }
      }

      // Walk the stem emitting polyline runs. A run breaks when the colour or
      // width bucket changes; within a run, points nearer than MIND2 to the last
      // emitted one are dropped. In small multiples that discards most of them --
      // at 2 km resampling the spacing is well under a pixel.
      let key = -1, lx = 0, ly = 0, cur = null;
      for (let j = 0; j < n; j++) {
        const q = s.q[j];
        let wb = Math.ceil(WB * Math.sqrt(q > 0 ? q / qref : 0));
        wb = wb < 1 ? 1 : wb > WB ? WB : wb;
        const kk = s.bk[j] * WB + (wb - 1);
        const dx = SX[j] - lx, dy = SY[j] - ly;
        if (kk !== key) {
          if (cur) cur.lineTo(SX[j], SY[j]);          // overlap, so no gap shows
          cur = paths[kk] || (paths[kk] = new Path2D());
          cur.moveTo(SX[j], SY[j]);
          key = kk; lx = SX[j]; ly = SY[j];
        } else if (dx*dx + dy*dy >= MIND2 || j === n - 1) {
          cur.lineTo(SX[j], SY[j]);
          lx = SX[j]; ly = SY[j];
        }
      }

      if (!isTrue && s.parent >= 0) {
        let wb = Math.ceil(WB * Math.sqrt(s.q[n-1] > 0 ? s.q[n-1] / qref : 0));
        wb = wb < 1 ? 1 : wb > WB ? WB : wb;
        const kk = s.bk[n-1] * WB + (wb - 1);
        const p = paths[kk] || (paths[kk] = new Path2D());
        p.moveTo(SX[n-1], SY[n-1]);
        p.lineTo(ox + s.join_ox * ko + s.join_x * kx, base - s.join_y * ky);
      }
    }
  });

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < paths.length; i++) {
    const p = paths[i];
    if (!p) continue;
    ctx.strokeStyle = BCOL[(i / WB) | 0];
    ctx.lineWidth = Math.max(0.4, W0 * ((i % WB) + 1) / WB);
    ctx.stroke(p);
  }

  if (!focus) {
    ctx.textAlign = 'center';
    for (const { b, cx, cy } of cells) {
      // card outline, inset so neighbouring cards read as separate tiles rather
      // than one continuous grid -- makes it obvious which river a title labels
      ctx.strokeStyle = '#222d33';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 3.5, cy + 3.5, cw - 7, ch - 7);

      ctx.fillStyle = '#dfe8ea';
      ctx.font = '600 12px ui-sans-serif,system-ui,sans-serif';
      ctx.fillText(b.name, cx + cw/2, cy + 13);
      ctx.font = '11px ui-sans-serif,system-ui,sans-serif';
      ctx.fillStyle = b.lost > 0.05 ? '#c98a4a' : '#6e8087';
      const km = `${Math.round(b.length_km).toLocaleString()} km`;
      ctx.fillText(b.lost > 0.005 ? `${km} · −${(b.lost*100).toFixed(0)}% flow` : km,
                   cx + cw/2, cy + 26);
    }
  }
  $('ms').textContent = (performance.now() - T0).toFixed(0) + ' ms';
}

cv.addEventListener('click', e => {
  if (STATE.focus != null) { setFocus(null); return; }
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const c = cells.find(c => mx >= c.cx && mx < c.cx + c.cw && my >= c.cy && my < c.cy + c.ch);
  if (c) { tip.style.display = 'none'; scrollTo(0, 0); setFocus(c.b.main_riv); }
});

cv.addEventListener('mousemove', e => {
  if (STATE.focus != null || !cells.length) { tip.style.display = 'none'; return; }
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const c = cells.find(c => mx >= c.cx && mx < c.cx + c.cw && my >= c.cy && my < c.cy + c.ch);
  if (!c) { tip.style.display = 'none'; return; }
  const b = c.b;
  tip.innerHTML =
    `<b>${b.name}</b><br>` +
    `<span class="k">terminus</span> ${b.endorheic ? 'inland sink — never reaches the sea' : 'ocean'}<br>` +
    `<span class="k">basin</span> ${Math.round(b.upland).toLocaleString()} km²<br>` +
    `<span class="k">length</span> ${Math.round(b.length_km).toLocaleString()} km<br>` +
    `<span class="k">peak flow</span> ${Math.round(b.peak_cms).toLocaleString()} m³/s<br>` +
    `<span class="k">at terminus</span> ${Math.round(b.term_cms).toLocaleString()} m³/s` +
    (b.lost > 0.005 ? ` <span style="color:#d08a4a">(−${(b.lost*100).toFixed(0)}%)</span>` : '') +
    `<br><span class="k">click to enlarge</span>`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px';
  tip.style.top  = Math.min(e.clientY + 14, innerHeight - 150) + 'px';
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');
</script>
