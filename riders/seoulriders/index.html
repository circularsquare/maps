<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>seoul riders</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0a; color: #eee;
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    overflow: hidden;
}
#map { width: 100vw; height: 100vh; }

#controls-wrap {
    position: absolute; top: 10px; right: 10px;
    max-width: calc(100vw - 24px);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 9999; pointer-events: none;
}
#controls-wrap > * { pointer-events: auto; }
#controls, #settings, #static-settings {
    background: rgba(10,10,10,0.85);
    border: 1px solid #333; border-radius: 8px;
    padding: 8px 10px;
}
#controls {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 5px 10px;
}
#settings, #static-settings {
    display: flex; flex-direction: column; gap: 8px;
    width: 78%; align-self: flex-end; padding: 10px 12px;
}
#settings.hidden, #static-settings.hidden { display: none; }
.row { display: flex; align-items: center; gap: 10px; }
.label { font-size: 12px; color: #ccc; flex-shrink: 0; }
.row input[type=range] { flex: 1; min-width: 0; accent-color: #6889a8; }
#speed-val {
    width: 58px; text-align: right; font-variant-numeric: tabular-nums;
    font-size: 12px; color: #ccc; flex-shrink: 0;
}
#dot-size-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
#toggle-wrap {
    display: flex; gap: 10px; font-size: 12px; color: #ccc;
    flex-shrink: 0; line-height: 1.2;
}
#toggle-wrap label {
    cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
}
#toggle-wrap input { accent-color: #6889a8; margin: 0; }

/* The button cluster on the left of the bar, and the mode toggle on its
   right, are square icon buttons rather than the text buttons the settings
   rows use -- same shape as nycriders, so the two maps read as one family. */
#speed-buttons, #static-speed-buttons { display: flex; gap: 4px; flex-shrink: 0; }
#speed-buttons button, #static-speed-buttons button, #t-static {
    background: none; border: 1px solid #555; color: #ccc;
    border-radius: 4px; width: 30px; height: 30px; padding: 0;
    font: inherit; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    flex-shrink: 0;
}
@media (hover: hover) {
    #speed-buttons button:hover, #static-speed-buttons button:hover,
    #t-static:hover { border-color: #6889a8; color: #eee; background: none; }
}
#speed-buttons button.active, #static-speed-buttons button.active,
#t-static.active { border-color: #6889a8; color: #6889a8; }
#gear, #static-gear { margin-right: 5px; }

#time-label {
    font-size: 20px; font-weight: 700; color: #ccc;
    width: 78px; text-align: center; font-variant-numeric: tabular-nums;
}
#time-slider {
    min-width: 170px; height: 14px; background: transparent;
    -webkit-appearance: none; appearance: none; cursor: pointer;
}
#time-slider::-webkit-slider-runnable-track {
    height: 3px; background: #555; border-radius: 2px;
}
#time-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 3px; height: 14px;
    background: #cfd9e4; border: none; border-radius: 1px; margin-top: -5.5px;
}
#time-slider::-moz-range-track { height: 3px; background: #555; border-radius: 2px; }
#time-slider::-moz-range-thumb {
    width: 3px; height: 14px; background: #cfd9e4; border: none; border-radius: 1px;
}
button {
    background: #1c1c1c; color: #ddd; border: 1px solid #3a3a3a;
    border-radius: 5px; padding: 4px 9px; font: inherit; font-size: 13px;
    cursor: pointer;
}
button:hover { background: #262626; }

#panel {
    position: absolute; left: 10px; top: 10px; z-index: 9999;
    background: rgba(10,10,10,0.85); border: 1px solid #333;
    border-radius: 8px; padding: 11px 13px; max-width: 310px;
}
#panel h1 { font-size: 15px; font-weight: 700; }
#panel .hdr {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 3px;
}
#panel .sub { font-size: 12px; color: #9a9a9a; line-height: 1.45; }

#langtoggle { flex: none; font-size: 11px; white-space: nowrap; }
#langtoggle span {
    cursor: pointer; color: #7e7e7e; padding: 1px 5px; border-radius: 4px;
}
#langtoggle span.on { color: #fff; background: #2f3f4f; }
#panel .stat { margin-top: 8px; font-size: 12px; color: #ccc; }
#panel .stat b { color: #fff; font-variant-numeric: tabular-nums; }
#panel details { margin-top: 8px; }
#panel summary {
    font-size: 11px; color: #7e7e7e; cursor: pointer; outline: none;
}
#panel details p {
    font-size: 11px; color: #8a8a8a; line-height: 1.5; margin-top: 6px;
}
#panel a { color: #7e9cbb; }
#panel .note {
    margin-top: 7px; font-size: 11px; color: #8a8a8a; line-height: 1.5;
    border-top: 1px solid #2a2a2a; padding-top: 7px;
}
#panel .warn {
    margin-top: 8px; font-size: 11px; line-height: 1.45;
    color: #ffb95e; border-left: 2px solid #ffb95e; padding-left: 7px;
}
#panel .built { font-size: 11px; color: #6e6e6e; margin-top: 6px; }
.hidden { display: none !important; }

#legend {
    position: absolute; left: 10px; bottom: 10px; z-index: 9999;
    background: rgba(10,10,10,0.85); border: 1px solid #333;
    border-radius: 8px; padding: 8px 11px;
    display: flex; gap: 5px 10px; align-items: center; flex-wrap: wrap;
    max-width: 360px;
}
#legend .li { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #bbb; }
#legend .sw { width: 11px; height: 3px; border-radius: 2px; }

/* Narrow screens: the bar now carries two clusters of icon buttons, so let
   it wrap and give the slider the whole second line. */
@media (max-width: 620px) {
    #controls-wrap { top: 6px; right: 6px; }
    #controls { padding: 10px 12px; gap: 3px 10px; flex-wrap: wrap; }
    #speed-buttons, #static-speed-buttons { order: 0; }
    #t-static { order: 1; margin-left: auto; }
    #controls::before { content: ''; order: 2; flex-basis: 100%; height: 0; }
    #time-slider { order: 3; min-width: 0; flex: 1; }
    #time-label { order: 4; }
    #settings, #static-settings { width: 100%; }
}

#loading {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 10000; font-size: 14px; color: #888;
}
#loading.hidden { display: none; }

/* The dot overlay is a canvas at z-index 1 inside the map container, and
   MapLibre leaves its own furniture on auto -- so say where these go, or the
   dots paint over the tooltips and the attribution. */
.maplibregl-control-container { z-index: 2; }
.maplibregl-popup { z-index: 3; }

/* Tooltips. One row: the line roundels, then the count. */
.train-tooltip .maplibregl-popup-content {
    background: rgba(10,10,10,0.9);
    color: #eee;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Nunito', system-ui, sans-serif;
    border: 1px solid #444;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: none !important;
    width: max-content;
}
.train-tooltip .maplibregl-popup-tip { display: none; }
.route-icons { display: inline-flex; align-items: center; gap: 3px; }
/* Seoul signage puts the line number in a filled circle, so the tooltip does
   the same rather than borrowing London's name chips. */
.route-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 11px; font-weight: 700; line-height: 1;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    flex-shrink: 0;
}
.route-icon.named {
    width: auto; height: 18px; border-radius: 9px; padding: 0 7px;
}
.tip-name { font-weight: 700; white-space: nowrap; }
.tip-count { white-space: nowrap; color: #fff; }
.tip-note { color: #9a9a9a; font-size: 11px; white-space: nowrap; }

/* ---------------------------------------------------- drill-down panel
   The day view's second read: a clicked segment or station, broken out by
   line and by hour. Ported from nycriders, widened because a Seoul line
   label is a word rather than a single letter. */
#drill-panel {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%); z-index: 9999;
    /* A shade more opaque than nycriders': this panel lands on top of a
       22-line legend, and at 0.92 the legend read straight through it. */
    background: rgba(10,10,10,0.96);
    border: 1px solid #333; border-radius: 8px;
    padding: 10px 14px;
    width: min(580px, calc(100vw - 24px));
    color: #ccc; font-family: inherit; font-size: 12px;
}
#drill-panel.hidden { display: none; }
.drill-close {
    position: absolute; top: 4px; right: 6px;
    background: none; border: none; color: #888;
    cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px;
}
.drill-close:hover { color: #fff; background: none; }
.drill-header {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
}
.drill-station-name {
    color: #eee; font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.drill-station-name.right { margin-left: auto; margin-right: 22px; text-align: right; }
.drill-sep {
    flex: 1; border-bottom: 1px dashed #444; margin: 0 4px; align-self: center;
}
.drill-rows { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
.drill-row { display: flex; align-items: center; gap: 6px; height: 31px; }
/* One fixed-width cell for the roundel, the 급행 tag and the direction
   arrow, so every row's chart starts at the same x however long the line's
   name is -- 경의중앙선 is a chip, not a letter. */
.drill-lead {
    width: 124px; flex-shrink: 0;
    display: flex; align-items: center; gap: 4px; overflow: hidden;
}
/* The roundels sit against the left edge the way nycriders' do; the arrow
   is pushed to the far end of the cell so the arrows line up as a column
   however long the line names next to them are. */
.drill-lead-icons {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    display: flex; align-items: center; gap: 4px;
}
.drill-lead .route-icon {
    height: 15px; font-size: 9.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.drill-lead .route-icon:not(.named) { flex: 0 0 15px; width: 15px; }
.drill-lead .route-icon.named {
    border-radius: 8px; padding: 0 6px;
    flex: 0 1 auto; min-width: 0; display: block; line-height: 15px;
}
.drill-tag {
    font-size: 9.5px; color: #9a9a9a; border: 1px solid #4a4a4a;
    border-radius: 3px; padding: 0 3px; line-height: 14px; flex-shrink: 0;
}
.drill-arrow {
    color: #ccc; font-size: 15px; font-weight: 700;
    width: 11px; text-align: center; flex-shrink: 0; line-height: 1;
}
.drill-chart { flex: 1; height: 31px; display: block; min-width: 0; }
.drill-chart rect { transition: opacity 80ms; }
.drill-chart rect:hover { opacity: 1 !important; }
.drill-axis {
    position: relative;
    margin-left: 130px;   /* 124px lead + the row's 6px gap */
    margin-right: 62px;   /* matches .drill-row-total + the row's 6px gap */
    height: 14px; color: #777; font-size: 10px;
    font-variant-numeric: tabular-nums;
}
.drill-axis span { position: absolute; transform: translateX(-50%); top: 1px; }
.drill-row-total {
    flex-shrink: 0; width: 56px; text-align: right;
    color: #ccc; font-size: 11px; font-variant-numeric: tabular-nums;
    line-height: 1;
}
.drill-metric-buttons {
    display: flex; align-items: center; gap: 4px; margin-bottom: 6px;
}
.drill-total {
    margin-left: auto; margin-right: 22px;   /* clear of the close button */
    color: #aaa; font-size: 11px; font-variant-numeric: tabular-nums;
}
.drill-btn {
    background: none; border: 1px solid #555; color: #ccc;
    border-radius: 3px; height: 22px; padding: 0 8px;
    cursor: pointer; font-size: 11px; font-family: inherit; line-height: 1;
}
@media (hover: hover) {
    .drill-btn:hover { border-color: #6889a8; color: #eee; background: none; }
}
.drill-btn.active { border-color: #6889a8; color: #6889a8; }
.drill-note {
    color: #7e7e7e; font-size: 10.5px; line-height: 1.45; margin-top: 6px;
    border-top: 1px solid #2a2a2a; padding-top: 6px;
}
#drill-tooltip {
    position: fixed; z-index: 10001;
    background: rgba(10,10,10,0.92); border: 1px solid #444;
    border-radius: 4px; color: #eee; padding: 4px 8px;
    font-size: 11px; font-family: inherit; pointer-events: none;
    white-space: nowrap; font-variant-numeric: tabular-nums;
}
#drill-tooltip.hidden { display: none; }
@media (max-width: 620px) {
    #drill-panel { font-size: 11px; bottom: 8px; padding: 8px 10px; }
    .drill-lead { width: 86px; }
    .drill-axis { margin-left: 92px; margin-right: 52px; }
    .drill-row-total { width: 46px; }
}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">loading…</div>

<div id="panel">
    <div class="hdr">
        <h1 id="t-h1">seoul riders</h1>
        <div id="langtoggle"><span id="lang-en">EN</span><span
            id="lang-ko">한국어</span></div>
    </div>
    <div class="sub" id="subtitle"></div>
    <div class="stat" id="live-stat"></div>
    <div class="stat hidden" id="static-stat"></div>
    <div class="note hidden" id="static-note"></div>
    <div class="note hidden" id="daynote"></div>
    <div class="warn hidden" id="samplewarn"></div>
    <details>
        <summary id="t-about-sum">about the data</summary>
        <p id="about"></p>
        <p class="built" id="buildstamp"></p>
    </details>
</div>

<div id="legend"></div>

<div id="controls-wrap">
    <div id="controls">
        <div id="speed-buttons">
            <button id="gear"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button id="play" data-speed="0"><svg width="10" height="12" viewBox="0 0 10 12"><rect x="0" y="0" width="3" height="12" fill="currentColor"/><rect x="7" y="0" width="3" height="12" fill="currentColor"/></svg></button>
            <button data-speed="1" class="active">1×</button>
            <button data-speed="2">2×</button>
        </div>
        <div id="static-speed-buttons" class="hidden">
            <button id="static-gear"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button id="static-play" data-static-speed="0" class="active"><svg width="10" height="12" viewBox="0 0 10 12"><rect x="0" y="0" width="3" height="12" fill="currentColor"/><rect x="7" y="0" width="3" height="12" fill="currentColor"/></svg></button>
            <button data-static-speed="1">1×</button>
        </div>
        <input type="range" id="time-slider" min="0" max="1000" value="0">
        <span id="time-label">05:00</span>
        <button id="t-static"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="14" x2="14" y2="3"/><line x1="7" y1="18" x2="18" y2="7"/><line x1="11" y1="22" x2="22" y2="11"/></svg></button>
    </div>
    <div id="settings" class="hidden">
        <div class="row">
            <span class="label" id="t-speed">speed</span>
            <input type="range" id="speed" min="0" max="15" step="1" value="7">
            <span id="speed-val">1×</span>
        </div>
        <div class="row">
            <div id="dot-size-wrap">
                <span class="label" id="t-dotsize">dot size</span>
                <input type="range" id="dotsize" min="0.4" max="3" step="0.1" value="1.2">
            </div>
            <div id="toggle-wrap">
                <label><input type="checkbox" id="cb-stations" checked><span
                    id="t-stations-lbl">stations</span></label>
                <label><input type="checkbox" id="cb-lines" checked><span
                    id="t-lines-lbl">lines</span></label>
            </div>
        </div>
    </div>
    <div id="static-settings" class="hidden">
        <div class="row">
            <span class="label" id="t-static-size">size</span>
            <input type="range" id="static-size" min="40" max="220" step="1" value="100">
        </div>
        <div class="row">
            <span class="label" id="t-board-lbl">boardings</span>
            <button id="b-all" class="drill-btn active">all</button>
            <button id="b-first" class="drill-btn">starting</button>
            <button id="b-xfer" class="drill-btn">changing</button>
        </div>
    </div>
</div>

<div id="drill-panel" class="hidden"></div>
<div id="drill-tooltip" class="hidden"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---------------------------------------------------------------- language
// Every string the page can show, in both languages. Station names come from
// the data (name / name_en, out of OSM), line names from line_meta
// (display / display_en, out of lines.py) -- so this table is only the
// furniture. The counted ones are functions because Korean puts its counter
// after the number and orders the clauses differently, which a template with
// holes in it cannot express.
const STR = {
    en: {
        h1: 'seoul riders',
        subLive: d => 'Subway trains on ' + d + ', sized by how many people ' +
            'are on board.',
        subStatic: d => 'Every journey made on ' + d + ', added up rather ' +
            'than animated.',
        liveStat: '<span id="onboard">0</span> riders on ' +
            '<b id="running">0</b> trains, <b id="waiting-count">0</b> ' +
            'on platforms',
        staticStat: '<b id="static-total">0</b> boardings ' +
            '<span id="static-when">all day</span>',
        staticNote: 'Line thickness is riders carried past that point; ' +
            'circles are boardings, counted again where a rider changes ' +
            'train. How many people ride each line is measured everywhere. ' +
            'Which journeys they make is modelled on some lines, because ' +
            'the origin–destination release records a journey only if one ' +
            'end passed a 서울교통공사 gate; hover a line or a station and ' +
            'the tooltip says how much of it is modelled.',
        aboutSummary: 'about the data',
        // Two versions, because a weekday is not measured the way New Year's
        // Eve is and the panel should not imply otherwise.
        about: d => 'Station-to-station journeys from the Seoul city ' +
            'origin–destination release, which covers one day: Sunday ' +
            '31 December 2023. ' + (d === 'nye' ? '' :
                'Boardings and alightings at every station on ' +
                'an ordinary day are measured separately, and that journey ' +
                'pattern is scaled onto them — so the volumes here are ' +
                'measured and the pattern of who goes where is carried over ' +
                'from the day that was. ') +
            'Split into hours against 서울교통공사 hourly gate counts, then ' +
            'routed over the published train timetable. Grey bubbles are ' +
            'riders on the platform waiting to board. Every 수도권 line ' +
            'except 에버라인, which publishes no stop times.',
        // Shown on every build but `nye`. Short on purpose: the full version
        // is in `about`, and a caveat nobody reads is not a caveat.
        dayNote: 'Passenger numbers are measured. Which journeys make them ' +
            'up is carried over from a Sunday — the only day Seoul ' +
            'publishes station-to-station data for.',
        legWaiting: 'waiting',
        built: d => 'Built ' + d + '.',
        builtUnknown: 'Built before the build date was recorded.',
        sampleWarn: n => 'Sample build — every ' + n + 'th origin only. ' +
            'Every count on this page is roughly ' + n + '× low. Run ' +
            'build.py with no --sample for the real thing.',
        dayTitle: 'the whole day at once',
        play: 'play',
        pause: 'pause',
        speed: 'speed',
        dotSize: 'dot size',
        stations: 'stations',
        lines: 'lines',
        realTime: 'real time',
        allDay: 'all day',
        allDayShort: 'all day',   // goes in the narrow clock slot
        loading: 'loading…',
        loadingDay: 'loading the day…',
        tipRiders: n => n + '&nbsp;riders',
        tipExpress: 'express',
        tipCarried: n => n + '&nbsp;carried',
        tipOnOff: (b, a) => b + '&nbsp;on, ' + a + '&nbsp;off',
        tipChanging: n => n + '&nbsp;of them changing trains',
        boardLbl: 'boardings',
        boardAll: 'all',
        boardFirst: 'starting',
        boardXfer: 'changing',
        settingsTitle: 'settings',
        playTitle: 'play',
        pauseTitle: 'pause',
        size: 'size',
        // The drill panel: one clicked segment or station, hour by hour.
        mRiders: 'riders',
        mCrowd: 'crowdedness',
        expressTag: 'exp',
        express: 'express',
        allStops: 'all stops',
        drillCarried: n => n + ' riders',

// Twenty-two operator colours, several of them pale, so work out which want
// dark numerals rather than keeping a list in step by hand.
function needsDarkText(hex) {
    const v = i => {
        const c = parseInt(hex.slice(i, i + 2), 16) / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * v(1) + 0.7152 * v(3) + 0.0722 * v(5) > 0.35;
}

function fmtTime(t) {
    const h = Math.floor(t / 3600) % 24, m = Math.floor((t % 3600) / 60);
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }

function darkenHex(hex, f) {
    const c = i => Math.round(parseInt(hex.slice(i, i + 2), 16) * f)
        .toString(16).padStart(2, '0');
    return '#' + c(1) + c(3) + c(5);
}
function lightenHex(hex, f) {
    const c = i => {
        const v = parseInt(hex.slice(i, i + 2), 16);
        return Math.round(v + (255 - v) * f).toString(16).padStart(2, '0');
    };
    return '#' + c(1) + c(3) + c(5);
}

// ---------------------------------------------------------------- load
// A sampled build writes its own filenames so it can never stand in for the
// real one; ?sample in the URL is how you ask to see it anyway.
const SAMPLED = new URLSearchParams(location.search).has('sample');
const TRAINS_URL = SAMPLED ? 'data/trains.sample.json' : 'data/trains.json';
const STATS_URL = SAMPLED ? 'data/stats.sample.json' : 'data/stats.json';

// When the build was made, and whether it is one worth believing. Both
// outputs carry the same stamp; a file written before this existed has none,
// which is worth saying rather than hiding.
function applyBuildStamp() {
    const S = STR[lang];
    const b = DATA && DATA.build;
    const el = $('buildstamp');
    const warn = $('samplewarn');
    if (!el) return;
    if (!DATA) { el.textContent = ''; return; }
    el.textContent = b && b.built ? S.built(prettyBuilt(b.built))
                                  : S.builtUnknown;
    const n = b && b.sample > 1 ? b.sample : 0;
    warn.classList.toggle('hidden', !n);
    if (n) warn.textContent = S.sampleWarn(n);
}

function prettyBuilt(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const pad = v => String(v).padStart(2, '0');
    return d.toLocaleDateString(lang === 'ko' ? 'ko-KR' : 'en-GB',
                                {day: 'numeric', month: 'short',
                                 year: 'numeric'}) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

fetch(TRAINS_URL).then(r => r.json()).then(d => {
    DATA = d;
    prepare();
    if (map.loaded()) install(); else map.on('load', install);
});

function prepare() {
    const meta = DATA.line_meta;
    if (meta) {
        LINE_ORDER = Object.keys(meta);
        LINE_NAMES = {};
        LINE_NAMES_EN = {};
        LINE_COLORS = {};
        LINE_CAPACITY = {};
        for (const id of LINE_ORDER) {
            LINE_NAMES[id] = meta[id].display;
            LINE_NAMES_EN[id] = meta[id].display_en || '';
            LINE_COLORS[id] = meta[id].color;
            LINE_CAPACITY[id] = meta[id].capacity;
        }
    }

    trains = DATA.trains.map(tr => {
        const tl = tr.timeline;
        const color = tr.color || LINE_COLORS[tr.route] || '#888';
        return {
            route: tr.route,
            color: color,
            stroke: darkenHex(color, 0.75),
            over: lightenHex(color, 0.2),
            cap: LINE_CAPACITY[tr.route] || 0,
            express: !!tr.express,
            tl: tl,
            t0: tl[0][0],
            t1: tl[tl.length - 1][0],
            // Drawing in timetable order stacks whole lines on top of each
            // other where they share track; a fixed random key mixes them.
            order: Math.random(),
        };
    }).filter(t => t.t1 > t.t0);
    // Sorted once, so the overlay can draw straight down the list and still
    // get the mixed stacking the circle-sort-key used to give it.
    trains.sort((a, b) => a.order - b.order);

    waitStations = (DATA.stations || [])
        .map((s, i) => ({ i: i, name: s.name, name_en: s.name_en,
                          lat: s.lat, lon: s.lon,
                          lines: s.lines || [], wait: s.wait || [] }))
        .filter(s => s.wait.length);
    waitStations.forEach(s => waitByStation.set(s.i, s));

    tMin = Math.min.apply(null, trains.map(t => t.t0));
    tMax = Math.max.apply(null, trains.map(t => t.t1));
    // Open at 07:00. The first two hours of service are nearly empty, and
    // starting there makes the map look broken before it looks interesting.
    simTime = Math.min(tMax, Math.max(tMin, START_HOUR * 3600));
    anchorSim = simTime; anchorWall = performance.now();

    applyLang();
}

function prettyDate(iso) {

// The basemap's own labels. openfreemap's dark style prints latin and
// non-latin concatenated -- "GYEYANGSAN-RO 계양산로" -- so switching the page's
// language means rewriting text-field on the layers that draw a name.
// Motorway shields label from `ref` and are left alone.
// Not gated on isStyleLoaded(): switching language sets off a round of glyph
// loading, so the style reads "not loaded" for a second or two afterwards and
// gating on it silently dropped every other switch. getStyle() throwing is the
// real "too early" signal. Both expressions below still mention name:latin, so
// rebuilding the layer list from an already-switched style finds the same set.
let basemapLabelLayers = null;
function applyBasemapLang() {
    let layers;
    try { layers = (map.getStyle() || {}).layers; } catch (e) { return; }
    if (!layers || !layers.length) return;
    if (!basemapLabelLayers || !basemapLabelLayers.length) {
        basemapLabelLayers = layers
            .filter(L => L.type === 'symbol' &&
                JSON.stringify((L.layout || {})['text-field'] || '')
                    .indexOf('name:latin') >= 0)
            .map(L => L.id);
    }
    const expr = lang === 'ko'
        ? ['coalesce', ['get', 'name:nonlatin'], ['get', 'name'],
           ['get', 'name:latin']]
        : ['coalesce', ['get', 'name:latin'], ['get', 'name_en'],
           ['get', 'name']];
    for (const id of basemapLabelLayers) {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'text-field', expr);
    }
}

// ---------------------------------------------------------------- layers
let installed = false;

// The backdrop: every line, ridden or not. It used to be OSM's own ways, and
// OSM maps a four-track mainline track by track -- 940 ways for 1호선 alone
// against 62 for 3호선, twenty of them within 250 m of 영등포 -- so the
// corridor drew as a bundle of parallel lines rather than as a line. The
// trains run one path per link, and build_shapes.py already wrote that path
// into their timelines, so lift it from there instead: one polyline per link,
// whichever way round the train ran it.
//
// Coverage is every link a rider-carrying train traverses, which is the whole
// network bar a line with no such train at all -- build.py prints those as
// NO TRAINS WITH RIDERS, and there are none.
function backdropFeatures() {
    // An unshaped build has no waypoints to lift and its timelines are
    // chords, so fall back to OSM's ways, bundles and all.
    if (DATA.build && DATA.build.shaped === false) {
        const out = [];
        (DATA.lines || []).forEach(L => (L.ways || []).forEach(w => out.push({
            type: 'Feature',
            properties: { color: L.color || LINE_COLORS[L.route] || '#888' },
            geometry: { type: 'LineString',
                        coordinates: w.map(p => [p[1], p[0]]) },
        })));
        return out;
    }

    // Rows with four or more entries are station stops; three-entry rows are
    // the track waypoints, which is exactly the shape of the link between.
    const links = new Map();
    for (const tr of trains) {
        const tl = tr.tl;
        let s = -1;
        for (let i = 0; i < tl.length; i++) {
            if (tl[i].length < 4) continue;
            if (s >= 0) {
                const ka = tl[s][1] + ',' + tl[s][2];
                const kb = tl[i][1] + ',' + tl[i][2];
                const key = tr.route + '|' +
                    (ka < kb ? ka + '|' + kb : kb + '|' + ka);
                const have = links.get(key);
                // An express that skips a station draws a line no train
                // follows -- 공항철도's 직통 is fifty kilometres of it -- so an
                // all-stops run's path always wins, and a link nothing but an
                // express uses is dropped below.
                if (!have || (have.express && !tr.express)) {
                    const pts = [];
                    for (let j = s; j <= i; j++) pts.push([tl[j][2], tl[j][1]]);
                    links.set(key, { route: tr.route, pts: pts,
                                     express: !!tr.express, a: ka, b: kb });
                }
            }
            s = i;
        }
    }

    const kept = [...links.values()].filter(L => !L.express);
    // Which link continues at each end, so the spline can carry a tangent
    // across a station and the bend there comes out smooth as well.
    const atNode = new Map();
    for (const L of kept) {
        for (const k of [L.route + '|' + L.a, L.route + '|' + L.b]) {
            const a = atNode.get(k);
            if (a) a.push(L); else atNode.set(k, [L]);
        }
    }
    const inward = (L, nodeKey) => {
        const first = L.route + '|' + L.a === nodeKey;
        return first ? L.pts[1] : L.pts[L.pts.length - 2];
    };
    const beyond = (L, nodeKey) => {
        for (const M of atNode.get(nodeKey) || []) {
            if (M !== L) return inward(M, nodeKey);
        }
        return null;
    };

    return kept.map(L => ({
        type: 'Feature',
        properties: { color: LINE_COLORS[L.route] || '#888' },
        geometry: {
            type: 'LineString',
            coordinates: splineThrough(L.pts,
                beyond(L, L.route + '|' + L.a),
                beyond(L, L.route + '|' + L.b)),
        },
    }));
}

function install() {
