// ---------------------------------------------------------------- animation

// Quadratic ease in and out. On a short hop there is not enough time for a
// full ACCEL at each end, so the ramp is capped at half the segment.
function ease(frac, travel) {
    const a = Math.min(ACCEL / travel, 0.5);
    const denom = 2 * a * (1 - a);
    if (frac < a) return frac * frac / denom;
    if (frac > 1 - a) { const d = 1 - frac; return 1 - d * d / denom; }
    return a / (2 * (1 - a)) + (frac - a) / (1 - a);
}

// Trains and waiting crowds both. Area with riders, so the coefficient is on
// the square root; 0.4 rather than the 0.5 it opened at, which was 20% too
// big once the whole 수도권 was on the map and the trunks started merging into
// one blob. The dot-size slider multiplies this.
function bubbleRadius(count) {
    return Math.max(1, Math.min(48, Math.sqrt(count) * 0.4));
}

// Where a train is and how full it is. Timeline rows with 4+ entries are
// station stops; 3-entry rows are track waypoints from build_shapes.py, which
// bend the path but are not places anyone gets on or off.
function posOf(tr, t) {
    const tl = tr.tl;
    if (t < tl[0][0] || t > tl[tl.length - 1][0]) return null;

    let lo = 0, hi = tl.length - 1;
    while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (tl[mid][0] <= t) lo = mid; else hi = mid - 1;
    }
    const idx = lo;

    let pi = idx;
    while (pi > 0 && tl[pi].length < 4) pi--;
    const prev = tl[pi];
    let riders = prev.length >= 4 ? prev[3] : 0;

    const after = tl[pi + 1];
    const dwell = after ? Math.min(DWELL, after[0] - prev[0]) : DWELL;
    const dwellEnd = prev[0] + dwell;

    if (idx === pi && t < dwellEnd) {
        // Standing at the platform. Ramp the count over the stop so the
        // boarding shows as the doors being open, not as a jump.
        let before = 0;
        for (let j = pi - 1; j >= 0; j--) {
            if (tl[j].length >= 4) { before = tl[j][3]; break; }
        }
        const f = dwell > 0 ? (t - prev[0]) / dwell : 1;
        return [prev[1], prev[2], before + f * (riders - before)];
    }

    let ni = pi + 1;
    while (ni < tl.length && tl[ni].length < 4) ni++;
    if (ni >= tl.length) ni = tl.length - 1;

    const travel = tl[ni][0] - dwellEnd;
    if (travel <= 0 || t < dwellEnd) return [prev[1], prev[2], riders];

    // Ease along the whole platform-to-platform run, measured by distance, so
    // the waypoints in between bend the path without altering the pace.
    const eased = ease(Math.min(1, (t - dwellEnd) / travel), travel);
    const n = ni - pi;
    let total = 0;
    const cum = [0];
    for (let k = 1; k <= n; k++) {
        const a = tl[pi + k - 1], b = tl[pi + k];
        total += Math.hypot(b[1] - a[1], b[2] - a[2]);
        cum.push(total);
    }
    const target = eased * total;
    let seg = n - 1;
    for (let k = 1; k <= n; k++) {
        if (cum[k] >= target) { seg = k - 1; break; }
    }
    const a = tl[pi + seg], b = tl[pi + seg + 1];
    const span = cum[seg + 1] - cum[seg];
    const f = span > 0 ? (target - cum[seg]) / span : 0;
    return [a[1] + f * (b[1] - a[1]), a[2] + f * (b[2] - a[2]), riders];
}

function stationWaiting(s) {
    const tl = s.wait;
    let lo = 0, hi = tl.length - 1, idx = -1;
    while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (tl[mid][0] <= simTime) { idx = mid; lo = mid + 1; }
        else hi = mid - 1;
    }
    if (idx < 0) return 0;
    let n = tl[idx][1];
    const since = simTime - tl[idx][0];
    if (since < WAIT_TRANSITION && idx > 0) {
        n = tl[idx - 1][1] + (since / WAIT_TRANSITION) * (n - tl[idx - 1][1]);
    }
    return n;
}

let lastRender = 0;
// Frame budget for the simulation. Now that the dots are drawn on a canvas
// rather than pushed through a MapLibre source, a frame is cheap and this is a
// battery choice rather than a necessity -- so run smooth in front, and slow
// down rather than stop when the window is only in the background.
const RENDER_MS_FOCUSED = 16, RENDER_MS_BLURRED = 100;
let RENDER_MS = RENDER_MS_FOCUSED;

// Every render pushes two GeoJSON sources at MapLibre, and each push makes it
// re-index the data on its worker, rebuild the visible tiles and repaint every
// layer in the basemap -- so a render is expensive whether or not anything
// moved. The loop therefore runs only while the clock is moving or something
// has actually changed, and stands down completely when the window is in the
// background. Left running flat out it cost about 130% of a core, paused.
let rafId = null, dirty = true, suspended = false;

function invalidate() {
    dirty = true;
    if (rafId === null && !suspended) rafId = requestAnimationFrame(tick);
}

function suspend() {
    if (suspended) return;
    suspended = true;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
}

// The clock freezes while we are away rather than running on in the background,
// so coming back lands where you left off instead of at some arbitrary hour.
function resume() {
    if (!suspended) return;
    suspended = false;
    anchorSim = simTime; anchorWall = performance.now();
    invalidate();
}

function tick(now) {
    rafId = null;
    if (playing) {
        simTime = anchorSim + (now - anchorWall) / 1000 * 60 * speed;
        if (simTime > tMax) { simTime = tMin; anchorSim = tMin; anchorWall = now; }
    }
    if ((playing || dirty) && now - lastRender >= RENDER_MS) {
        lastRender = now;
        dirty = false;
        render();
    }
    if (!suspended && (playing || dirty)) rafId = requestAnimationFrame(tick);
}

let showStations = true;

// ---------------------------------------------------------------- overlay
// The dots are drawn on a plain 2D canvas over the map rather than as MapLibre
// circle layers. Feeding a GeoJSON source every frame makes MapLibre re-index
// the collection on its worker, rebuild the visible tiles and repaint the whole
// basemap -- measured at ~57 full repaints a second, and about 180% of a core.
// Drawing a few hundred arcs ourselves costs almost nothing, and MapLibre then
// sits idle unless the camera actually moves.
let fx = null, fxCtx = null;
const TAU = Math.PI * 2;
// Rebuilt by render() at RENDER_MS; redrawn by drawOverlay() on every camera
// frame, so panning stays glued to the basemap even between simulation steps.
let frameTrains = [], frameWaits = [];

function makeOverlay() {
    fx = document.createElement('canvas');
    // Above MapLibre's own canvas, below its controls (2) and popups (3).
    fx.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;' +
        'pointer-events:none;z-index:1';
    map.getContainer().appendChild(fx);
    fxCtx = fx.getContext('2d');
    map.on('move', drawOverlay);
    map.on('resize', drawOverlay);
}

function drawOverlay() {
    if (!fxCtx) return;
    const dpr = window.devicePixelRatio || 1;
    const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
    if (fx.width !== Math.round(w * dpr) || fx.height !== Math.round(h * dpr)) {
        fx.width = Math.round(w * dpr);
        fx.height = Math.round(h * dpr);
    }
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fxCtx.clearRect(0, 0, w, h);
    if (staticMode) return;

    // Radius is recomputed here rather than stored, so a zoom between
    // simulation steps resizes the dots along with the map.
    const scale = Math.pow(2, (map.getZoom() - BASE_ZOOM) / 2) * dotScale;

    if (showStations) {
        fxCtx.globalAlpha = 0.75;
        fxCtx.fillStyle = '#cbcbcb';
        for (let i = 0; i < frameWaits.length; i++) {
            const s = frameWaits[i];
            const p = map.project([s.lon, s.lat]);
            s.x = p.x; s.y = p.y; s.r = bubbleRadius(s.n) * scale;
            if (p.x < -s.r || p.y < -s.r || p.x > w + s.r || p.y > h + s.r) continue;
            fxCtx.beginPath();
            fxCtx.arc(p.x, p.y, s.r, 0, TAU);
            fxCtx.fill();
        }
    }

    for (let i = 0; i < frameTrains.length; i++) {
        const t = frameTrains[i];
        const p = map.project([t.lon, t.lat]);
        t.x = p.x; t.y = p.y; t.r = bubbleRadius(t.n) * scale;
        if (p.x < -t.r || p.y < -t.r || p.x > w + t.r || p.y > h + t.r) continue;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, t.r, 0, TAU);
        fxCtx.globalAlpha = 0.85;
        fxCtx.fillStyle = t.color;
        fxCtx.fill();
        fxCtx.globalAlpha = 0.8;
        fxCtx.lineWidth = t.sw;
        fxCtx.strokeStyle = t.stroke;
        fxCtx.stroke();
    }
    fxCtx.globalAlpha = 1;
}

// Nearest dot under a point, topmost first -- the picking MapLibre used to do
// with queryRenderedFeatures. Tiny dots get a few pixels of slop so they stay
// catchable, which matters more on a touchscreen than it did with a mouse.
function pickDot(pt) {
    for (let i = frameTrains.length - 1; i >= 0; i--) {
        const t = frameTrains[i];
        if (t.x === undefined) continue;
        const hit = Math.max(t.r, 4);
        const dx = pt.x - t.x, dy = pt.y - t.y;
        if (dx * dx + dy * dy <= hit * hit) return { kind: 'train', t: t };
    }
    if (showStations) {
        for (let i = frameWaits.length - 1; i >= 0; i--) {
            const s = frameWaits[i];
            if (s.x === undefined) continue;
            const hit = Math.max(s.r, 4);
            const dx = pt.x - s.x, dy = pt.y - s.y;
            if (dx * dx + dy * dy <= hit * hit) return { kind: 'station', si: s.si,
                                                         lon: s.lon, lat: s.lat };
        }
    }
    return null;
}

function render() {
    if (staticMode) { drawOverlay(); refreshTooltips(); return; }

    const tf = [];
    let onboard = 0, running = 0;
    trainPositions.clear();
    for (let i = 0; i < trains.length; i++) {
        const tr = trains[i];
        if (simTime < tr.t0 || simTime > tr.t1) continue;
        const p = posOf(tr, simTime);
        if (!p) continue;
        onboard += p[2];
        if (p[2] < 0.5) continue;   // a train nobody is on is not worth drawing
        running++;
        const crowded = tr.cap && p[2] > tr.cap;
        trainPositions.set(i, [p[1], p[0], Math.round(p[2])]);
        tf.push({
            lon: p[1], lat: p[0], n: p[2],
            color: crowded ? tr.over : tr.color,
            stroke: crowded ? '#d01818' : tr.stroke,
            sw: crowded ? 2 : 1,
            route: tr.route, express: tr.express, ti: i,
        });
    }
    frameTrains = tf;

    let waitingTotal = 0;
    const wf = [];
    for (let i = 0; i < waitStations.length; i++) {
        const s = waitStations[i];
        const n = stationWaiting(s);
        if (n < 0.5) continue;
        waitingTotal += n;
        wf.push({ si: s.i, lon: s.lon, lat: s.lat, n: n });
    }
    frameWaits = wf;
    drawOverlay();

    $('onboard').innerHTML = '<b>' + fmtNum(onboard) + '</b>';
    $('running').textContent = fmtNum(running);
    $('waiting-count').textContent = fmtNum(waitingTotal);
    $('time-label').textContent = fmtTime(simTime);
    const sl = $('time-slider');
    if (document.activeElement !== sl) {
        sl.value = Math.round(1000 * (simTime - tMin) / (tMax - tMin));
    }
    refreshTooltips();
}

// ---------------------------------------------------------------- static view
// The animation answers "where is everyone right now". This answers "how much
// moves through here across the day" — the same routing, summed rather than
// sampled, so it is one more read of the same numbers and not a second model.

let staticMode = false;
let staticData = null;      // stats.json, fetched the first time it is needed
let staticShapes = null;    // link_shapes.json: the curves trains actually take
let staticHour = 0;         // 0 = the whole day, else 1..N for one hour
// Two scales, because the all-day view sums the hours and so runs an order of
// magnitude larger. Each view is fixed to its own busiest value, so stepping
// between hours makes the quiet ones visibly quiet instead of renormalising.
let segScaleHour = 0, segScaleAll = 0, stnScaleHour = 0, stnScaleAll = 0;

function hourValue(arr, hour) {
    if (!arr) return 0;
    if (hour) return arr[hour - 1] || 0;
    let t = 0;
    for (let i = 0; i < arr.length; i++) t += arr[i];
    return t;
}

function stationValue(st, hour, key) {
    let t = 0;
    // 'x' is not a stored series: a transfer boarding is any boarding that is
    // not the rider's first, so it is b minus b0. A station whose boardings
    // are *all* transfers has no b0 key, so a missing key means zero -- only
    // build.split_boardings can say the file predates the split, in which
    // case nothing is known and every boarding reads as a first one.
    if (key === 'x' || key === 'b0') {
        const split = !!(staticData.build && staticData.build.split_boardings);
        for (const line in st.by_line) {
            const L = st.by_line[line];
            const all = hourValue(L.b, hour);
            const b0 = split ? hourValue(L.b0, hour) : all;
            t += key === 'b0' ? b0 : all - b0;
        }
        return Math.max(0, t);
    }
    for (const line in st.by_line) t += hourValue(st.by_line[line][key], hour);
    return t;
}

// which boardings the static view draws: all, first leg only, or transfers
let staticBoard = 'b';

function staticLabel() {
    if (!staticHour) return STR[lang].allDay;
    const h = DATA_STATIC_HOURS[staticHour - 1];
    return fmtTime(h * 3600) + '–' + fmtTime((h + 1) * 3600);
}
let DATA_STATIC_HOURS = [];
let SUBTITLE_LIVE = '', SUBTITLE_STATIC = '';

// ------------------------------------------------------- express folding
// `write_stats` keys a segment by the *pattern's* consecutive stops, so an
// express that skips a station gets a key of its own -- its own stripe, its
// own crude 서울역→인천공항1터미널 straight line, and no way to see the local
// running underneath it. Where the express happens to stop at both ends of a
// local link the two share a key instead, which is why 1호선 mostly grouped
// and 9호선 never did.
//
// So put the express back on the track it runs on: walk each express-only
// link over the local graph and add its riders and its trains to every link
// it passes, as the `hx`/`nx` express subset the drill panel already reads.
// The skipping record is then dropped -- its riders are not lost, they have
// been spread along the way they actually travel.
//
// Doing it here rather than in build.py because it is a question about how
// the map reads, not about what the numbers are, and it costs one pass over
// 1,534 segments at load.

// Every train over the link is an express: nothing local runs this way, so
// this is a skip rather than a shared stretch of track.
function expressOnly(s) {
    if (!s.nx || !s.n) return false;
    for (let i = 0; i < s.n.length; i++) if (s.n[i] !== (s.nx[i] || 0)) return false;
    return true;
}

const FOLD_MAX_HOPS = 24;     // 공항철도's 직통 is twelve
const FOLD_MAX_DETOUR = 2.5;  // reject a path that has gone the wrong way

function foldExpressIntoLocal() {
    const segs = staticData.segments;
    const skips = segs.filter(expressOnly);
    if (!skips.length) return;

    // the graph the local service runs on, out of everything that is not a skip
    const out = new Map();
    for (const s of segs) {
        if (expressOnly(s)) continue;
        const k = s.line + '|' + s.ca;
        const a = out.get(k);
        if (a) a.push(s); else out.set(k, [s]);
    }

    const metres = (la1, lo1, la2, lo2) => {
        const dy = (la1 - la2) * 111320;
        const dx = (lo1 - lo2) * 111320 * LON_SQUEEZE;
        return Math.hypot(dx, dy);
    };
    const spanOf = s => metres(s.p[0], s.p[1], s.p[2], s.p[3]);

    // Shortest hop count wins. Seoul's branches do not rejoin, so the only
    // path that reaches the far end is the one the express actually takes --
    // the detour check below is a belt-and-braces guard on that.
    function pathBetween(line, from, to) {
        const seen = new Set([from]);
        let frontier = [[from, []]];
        for (let d = 0; d < FOLD_MAX_HOPS && frontier.length; d++) {
            const next = [];
            for (const [at, path] of frontier) {
                for (const s of out.get(line + '|' + at) || []) {
                    if (seen.has(s.cb)) continue;
                    const p2 = path.concat([s]);
                    if (s.cb === to) return p2;
                    seen.add(s.cb);
                    next.push([s.cb, p2]);
                }
            }
            frontier = next;
        }
        return null;
    }

    const folded = new Set();
    let stranded = 0;
    for (const x of skips) {
        const path = pathBetween(x.line, x.ca, x.cb);
        if (!path) { stranded++; continue; }
        const straight = Math.max(spanOf(x), 1);
        let walked = 0;
        for (const s of path) walked += spanOf(s);
        if (walked > straight * FOLD_MAX_DETOUR) { stranded++; continue; }
        for (const s of path) {
            if (!s.hx) s.hx = x.h.map(() => 0);
            if (!s.nx) s.nx = x.n.map(() => 0);
            for (let i = 0; i < s.h.length; i++) {
                s.h[i] = Math.round((s.h[i] + (x.h[i] || 0)) * 10) / 10;
                s.hx[i] = Math.round((s.hx[i] + (x.h[i] || 0)) * 10) / 10;
                s.n[i] += x.n[i] || 0;
                s.nx[i] += x.n[i] || 0;
            }
        }
        folded.add(x);
    }
    if (folded.size) {
        staticData.segments = segs.filter(s => !folded.has(s));
    }
    if (stranded) {
        console.warn('express folding: %d skip segments had no local path ' +
                     'and are still drawn on their own', stranded);
    }
}

function loadStatic() {
    if (staticData) return Promise.resolve();
    $('loading').textContent = STR[lang].loadingDay;
    $('loading').classList.remove('hidden');
    return Promise.all([
        fetch(STATS_URL).then(r => r.json()),
        fetch('data/link_shapes.json').then(r => r.json()).catch(() => ({})),
    ]).then(([stats, shapes]) => {
        staticData = stats;
        staticShapes = shapes || {};
        DATA_STATIC_HOURS = stats.hours;
        foldExpressIntoLocal();      // before the scales, which it changes
        buildSegIndex();
        // Scale to the busiest hour, not to each hour's own maximum, so the
        // 07:00 map is visibly emptier than the 18:00 one.
        for (const sg of stats.segments) {
            let sum = 0;
            for (let i = 0; i < sg.h.length; i++) {
                sum += sg.h[i];
                if (sg.h[i] > segScaleHour) segScaleHour = sg.h[i];
            }
            if (sum > segScaleAll) segScaleAll = sum;
        }
        for (const st of stats.stations) {
            const perHour = [];
            for (const line in st.by_line) {
                const b = st.by_line[line].b || [];
                for (let i = 0; i < b.length; i++) {
                    perHour[i] = (perHour[i] || 0) + b[i];
                }
            }
            let sum = 0;
            for (const v of perHour) {
                sum += v;
                if (v > stnScaleHour) stnScaleHour = v;
            }
            if (sum > stnScaleAll) stnScaleAll = sum;
        }
        $('loading').classList.add('hidden');
    });
}

// ------------------------------------------------------------- geometry
// link_shapes.json is built for the animation, where a train reads a
// position off the polyline and build_shapes' 25 m sag tolerance is
// invisible. Drawn ten pixels wide it is not: a bend between two stations
// arrives as a corner, and `line-join: round` only fillets it by half the
// line's width. So the day view runs the same points through a centripetal
// Catmull-Rom spline, which passes through every original point and rounds
// off everything between them. The end tangents come from the neighbouring
// segment on the same line, so a line that bends *at* a station comes out
// smooth across that join too.

const shapeCache = new Map();
let segByStart = null, segByEnd = null;   // 'line|platform code' -> segments

function buildSegIndex() {
    shapeCache.clear();
    segByStart = new Map();
    segByEnd = new Map();
    const push = (m, k, v) => {
        const a = m.get(k);
        if (a) a.push(v); else m.set(k, [v]);
    };
    for (const sg of staticData.segments) {
        push(segByStart, sg.line + '|' + sg.ca, sg);
        push(segByEnd, sg.line + '|' + sg.cb, sg);
    }
}

function rawShape(sg) {
    const k = sg.line + '|' + sg.p[0].toFixed(5) + ',' + sg.p[1].toFixed(5) +
        '|' + sg.p[2].toFixed(5) + ',' + sg.p[3].toFixed(5);
    const pts = staticShapes && staticShapes[k];
    if (pts && pts.length > 1) return pts.map(p => [p[1], p[0]]);
    return [[sg.p[1], sg.p[0]], [sg.p[3], sg.p[2]]];
}

// The point just before this segment starts and just after it ends, taken
// off whichever segment continues the line the same way. A segment running
// the other way would fold the tangent back on itself, so anything that
// starts where this one ends is skipped.
function neighbourPoints(sg) {
    let prev = null, next = null;
    for (const c of segByEnd.get(sg.line + '|' + sg.ca) || []) {
        if (c.ca === sg.cb) continue;
        const p = rawShape(c);
        prev = p[p.length - 2];
        break;
    }
    for (const c of segByStart.get(sg.line + '|' + sg.cb) || []) {
        if (c.cb === sg.ca) continue;
        next = rawShape(c)[1];
        break;
    }
    return [prev, next];
}

const SPLINE_STEPS = 8;      // samples per span; more is smoother and heavier
const LON_SQUEEZE = Math.cos(37.55 * Math.PI / 180);   // Seoul's latitude

// Knot spacing for the centripetal parameterisation: the square root of the
// (roughly metric) distance between two control points.
function knotStep(a, b) {
    const dx = (b[0] - a[0]) * LON_SQUEEZE, dy = b[1] - a[1];
    return Math.sqrt(Math.sqrt(dx * dx + dy * dy)) || 1e-6;
}

// Shared with the backdrop above, which runs its own links through the same
// curve. `prev` and `next` are the points just outside each end, for the
// tangent there; either may be null.
function splineThrough(pts, prev, next) {
    if (pts.length < 2) return pts;
    const first = pts[0], second = pts[1];
    const last = pts[pts.length - 1], penult = pts[pts.length - 2];
    // A terminus has nothing to borrow a tangent from, and a neighbour that
    // lands exactly on the endpoint would collapse a knot interval to zero;
    // both cases mirror the first span instead.
    const near = (a, b) => a && Math.abs(a[0] - b[0]) < 1e-9 &&
                                Math.abs(a[1] - b[1]) < 1e-9;
    if (!prev || near(prev, first)) {
        prev = [2 * first[0] - second[0], 2 * first[1] - second[1]];
    }
    if (!next || near(next, last)) {
        next = [2 * last[0] - penult[0], 2 * last[1] - penult[1]];
    }
    const P = [prev].concat(pts, [next]);

    const out = [];
    for (let i = 1; i + 2 <= P.length - 1; i++) {
        const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
        const t0 = 0;
        const t1 = t0 + knotStep(p0, p1);
        const t2 = t1 + knotStep(p1, p2);
        const t3 = t2 + knotStep(p2, p3);
        for (let s = 0; s < SPLINE_STEPS; s++) {
            const t = t1 + (t2 - t1) * (s / SPLINE_STEPS);
            const q = [0, 0];
            for (let d = 0; d < 2; d++) {
                const a1 = ((t1 - t) * p0[d] + (t - t0) * p1[d]) / (t1 - t0);
                const a2 = ((t2 - t) * p1[d] + (t - t1) * p2[d]) / (t2 - t1);
                const a3 = ((t3 - t) * p2[d] + (t - t2) * p3[d]) / (t3 - t2);
                const b1 = ((t2 - t) * a1 + (t - t0) * a2) / (t2 - t0);
                const b2 = ((t3 - t) * a2 + (t - t1) * a3) / (t3 - t1);
                q[d] = ((t2 - t) * b1 + (t - t1) * b2) / (t2 - t1);
            }
            out.push(q);
        }
    }
    out.push(pts[pts.length - 1]);
    return out;
}

function smoothShape(sg) {
    const [prev, next] = neighbourPoints(sg);
    return splineThrough(rawShape(sg), prev, next);
}

function shapeFor(sg) {
    const k = sg.line + '|' + sg.ca + '|' + sg.cb;
    let s = shapeCache.get(k);
    if (!s) { s = smoothShape(sg); shapeCache.set(k, s); }
    return s;
}

// A multiplier on every drawn width and radius in the day view, off the
// size slider. The live view has its own, `dotScale`.
let staticScale = 1;

function renderStatic() {
    if (!staticData) return;
    const segScale = staticHour ? segScaleHour : segScaleAll;
    const stnScale = staticHour ? stnScaleHour : stnScaleAll;
    const segs = [];
    let total = 0;
    for (let gi = 0; gi < staticData.segments.length; gi++) {
        const sg = staticData.segments[gi];
        const v = hourValue(sg.h, staticHour);
        if (v < 0.5) continue;
        segs.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: shapeFor(sg) },
            properties: {
                color: LINE_COLORS[sg.line] || '#888',
                w: Math.max(0.6, 11 * staticScale *
                                 Math.sqrt(v / Math.max(segScale, 1))),
                line: sg.line, a: sg.a, b: sg.b,
                ae: sg.ae || '', be: sg.be || '',
                riders: Math.round(v),
                gi: gi,
            },
        });
    }
    map.getSource('static-seg').setData(
        { type: 'FeatureCollection', features: segs });

    const stns = [];
    for (let i = 0; i < staticData.stations.length; i++) {
        const st = staticData.stations[i];
        const v = stationValue(st, staticHour, staticBoard);
        total += v;
        if (v < 0.5) continue;
        stns.push({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [st.lon, st.lat] },
            properties: {
                r: Math.max(1.2, 17 * staticScale *
                                 Math.sqrt(v / Math.max(stnScale, 1))),
                si: i,
            },
        });
    }
    map.getSource('static-stn').setData(
        { type: 'FeatureCollection', features: stns });

    $('static-total').textContent = fmtNum(total);
    $('static-when').textContent = staticLabel();
    $('time-label').textContent = staticHour ? staticLabel().split('–')[0]
                                             : STR[lang].allDayShort;
    renderHighlight();
}

function setStaticMode(on) {
    staticMode = on;
    clearPins();
    if (!on) closeDrill();
    setStaticPlay(0);
    $('t-static').classList.toggle('active', on);
    $('live-stat').classList.toggle('hidden', on);
    $('static-stat').classList.toggle('hidden', !on);
    $('static-note').classList.toggle('hidden', !on);
    $('legend-waiting').classList.toggle('hidden', on);
    $('subtitle').textContent = on ? SUBTITLE_STATIC : SUBTITLE_LIVE;

    // One button cluster per mode: playback speeds for the animation, hour
    // stepping for the day. Whichever settings drawer is open closes with it.
    $('speed-buttons').classList.toggle('hidden', on);
    $('static-speed-buttons').classList.toggle('hidden', !on);
    $('settings').classList.add('hidden');
    $('static-settings').classList.add('hidden');
    $('gear').classList.remove('active');
    $('static-gear').classList.remove('active');

    // The animated dots live on the overlay, which draws nothing in static
    // mode; drawOverlay() below clears whatever was on it.
    for (const id of ['static-hl-under', 'static-seg',
                      'static-hl-over', 'static-stn']) {
        map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    }
    // The line layer is the animation's backdrop; in static mode the segments
    // are the lines, so drop it to a faint trace of the parts nobody rides.
    map.setPaintProperty('lines', 'line-opacity',
                         on ? LINE_OPACITY_STATIC : LINE_OPACITY_LIVE);

    const sl = $('time-slider');
    if (on) {
        playing = false;
        sl.min = 0; sl.max = DATA_STATIC_HOURS.length; sl.step = 1;
        sl.value = staticHour;
        renderStatic();
        drawOverlay();          // clears the train and waiting dots
    } else {
        sl.min = 0; sl.max = 1000; sl.step = 1;
        setSpeed(speed);   // restarts the clock and re-lights the bar
    }
}

// ---------------------------------------------------------- day playback
// The day view's own clock: step an hour a second, wrapping round the
// service day. Hour 0 is the all-day total, which is not part of the cycle.
let staticPlay = 0, staticTimer = null;

function setStaticPlay(s) {
    staticPlay = s;
    if (staticTimer) { clearInterval(staticTimer); staticTimer = null; }
    const step = () => {
        staticHour = staticHour >= DATA_STATIC_HOURS.length ? 1 : staticHour + 1;
        $('time-slider').value = staticHour;
        renderStatic();
    };
    if (s > 0) {
        if (!staticHour) { staticHour = 1; $('time-slider').value = 1; renderStatic(); }
        staticTimer = setInterval(step, 1000);
    }
    for (const b of document.querySelectorAll('#static-speed-buttons button[data-static-speed]')) {
        b.classList.toggle('active', +b.dataset.staticSpeed === s);
    }
    $('static-play').title = s ? STR[lang].pause : STR[lang].play;
}

// ---------------------------------------------------------- drill panel
// The map says how much; this says when, and which service. Click a segment
// for every train running between those two stations hour by hour, or a
// station for what boards there. Ported from nycriders, with the express
// split out as its own row -- on 1호선 and 9호선 the 급행 and the 일반 are
// not the same question, which is why 서울교통공사 publish their 혼잡도
// separately.

let drillSeg = null;        // index into staticData.segments, or null
let drillStn = null;        // index into staticData.stations, or null
let segMetric = 'riders';   // 'riders' | 'crowd'

const DRILL_W = 300, DRILL_H = 31;   // the row chart's own viewBox; it stretches

function esc(s) {
    return String(s).replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function lineRank(id) {
    const i = LINE_ORDER.indexOf(id);
    return i < 0 ? 999 : i;
}

// One line's day: a bar per hour, a dashed reference line where one is
// wanted, and a solid baseline so the bars look grounded rather than
// floating over the row below.
function drillRow(line, arrow, tag, valFn, maxVal, tipFn, refRatio, totalText) {
    const N = DATA_STATIC_HOURS.length;
    const W = DRILL_W, H = DRILL_H;
    const slot = W / N;
    const barW = Math.max(1, slot - 1.6);
    const color = LINE_COLORS[line] || '#888';
    let bars = '';
    for (let h = 0; h < N; h++) {
        const v = valFn(h);
        if (v <= 0 || maxVal <= 0) continue;   // no bar, and no hover target
        const barH = Math.max(1, (v / maxVal) * (H - 2));
        const x = h * slot + (slot - barW) / 2;
        bars += '<rect data-tip="' + esc(tipFn(h)) + '" x="' + x.toFixed(1) +
            '" y="' + (H - barH).toFixed(1) + '" width="' + barW.toFixed(1) +
            '" height="' + barH.toFixed(1) + '" fill="' + color +
            '" opacity="0.8"/>';
    }
    let ref = '';
    if (refRatio != null && refRatio > 0 && refRatio <= 1) {
        const y = (H - refRatio * (H - 2)).toFixed(1);
        ref = '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y +
            '" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2,2" ' +
            'opacity="0.7" pointer-events="none"/>';
    }
    const base = '<line x1="0" y1="' + (H - 0.5) + '" x2="' + W + '" y2="' +
        (H - 0.5) + '" stroke="#555" stroke-width="0.5" pointer-events="none"/>';
    const lead = '<div class="drill-lead"><span class="drill-lead-icons">' +
        routeIcon(line, true) +
        (tag ? '<span class="drill-tag">' + tag + '</span>' : '') +
        '</span><span class="drill-arrow">' + (arrow || '') + '</span></div>';
    return '<div class="drill-row">' + lead +
        '<svg class="drill-chart" viewBox="0 0 ' + W + ' ' + H +
        '" preserveAspectRatio="none">' + base + bars + ref + '</svg>' +
        (totalText != null
            ? '<span class="drill-row-total">' + totalText + '</span>' : '') +
        '</div>';
}

// Ticks every three hours, in the 24-hour clock the rest of the page uses.
// The service day runs to 25:00, so the last two read 00 and 01.
function drillAxis() {
    const HS = DATA_STATIC_HOURS, N = HS.length;
    let out = '';
    for (let i = 0; i < N; i++) {
        if (HS[i] % 3) continue;
        out += '<span style="left:' + (((i + 0.5) / N) * 100).toFixed(2) +
            '%">' + String(HS[i] % 24).padStart(2, '0') + '</span>';
    }
    return '<div class="drill-axis">' + out + '</div>';
}

function hourRange(i) {
    const h = DATA_STATIC_HOURS[i];
    return fmtTime(h * 3600) + '–' + fmtTime((h + 1) * 3600);
}

function showDrill(html) {
    const p = $('drill-panel');
    p.innerHTML = '<button class="drill-close" id="drill-close">&#10005;</button>' +
        html;
    p.classList.remove('hidden');
    $('drill-close').onclick = closeDrill;
    for (const b of p.querySelectorAll('.drill-btn')) {
        b.addEventListener('mousedown', e => e.preventDefault());
    }
}

function closeDrill() {
    drillSeg = null;
    drillStn = null;
    $('drill-panel').classList.add('hidden');
    $('drill-tooltip').classList.add('hidden');
    clearHighlight();
}

// ------------------------------------------------------- segment drill
// Which segments count as "the same place". Platform codes are not shared
// between operators, so the pair is matched on station names -- and then on
// position, because Seoul has two 양평 and two 신촌 and they are nowhere
// near each other.
const SAME_PLACE_DEG = 0.011;    // ~1.2 km at this latitude

function nearPt(lat1, lon1, lat2, lon2) {
    return Math.abs(lat1 - lat2) < SAME_PLACE_DEG &&
           Math.abs(lon1 - lon2) < SAME_PLACE_DEG * 1.26;
}

function segMatches(gi) {
    const c = staticData.segments[gi];
    if (!c) return [];
    const out = [];
    for (const s of staticData.segments) {
        let fwd;
        if (s.a === c.a && s.b === c.b) fwd = true;
        else if (s.a === c.b && s.b === c.a) fwd = false;
        else continue;
        const ok = fwd
            ? nearPt(s.p[0], s.p[1], c.p[0], c.p[1]) &&
              nearPt(s.p[2], s.p[3], c.p[2], c.p[3])
            : nearPt(s.p[0], s.p[1], c.p[2], c.p[3]) &&
              nearPt(s.p[2], s.p[3], c.p[0], c.p[1]);
        if (ok) out.push(s);
    }
    return out;
}

// Lines whose express is folded back into the total rather than drawn as its
// own row. Only 공항철도, and the reason is not that the split is uncertain --
// most of this map is uncertain -- but that it is a *claim we cannot source*.
//
// The 직통 is non-stop 서울역 <-> 인천공항 and takes a separate ticket outside
// the integrated fare system, which the router does not model: it sees a
// faster train and nothing stopping anyone boarding it. So the split it
// produces is driven by how full the 일반 is, and comes out inverted against
// the airport's own hourly figures -- 직통 to the airport peaking in the
// evening when real departures peak at 10:00. Nobody publishes an hourly
// 직통/일반 split to correct it against.
//
// The *total* is fine and stays drawn: 공항철도's own measured hourly shape,
// from KRIC's `citytimepassList.jsp`, correlates 0.987 with what the build
// uses. It is only the split between the two services that is unsupported.
// See "The airport train has a commuter rush hour" in README.md.
const NO_EXPRESS_SPLIT = new Set(['AR']);

// One row per service, not per segment: where a line runs an express, `hx`
// is the express subset of `h`, so the local is the difference.
function segServices(matches) {
    const rows = [];
    for (const s of matches) {
        const hasX = s.hx && s.hx.some(v => v > 0.5) &&
                     !NO_EXPRESS_SPLIT.has(s.line);
        if (hasX) {
            const nx = s.nx || [];
            const hl = s.h.map((v, i) => Math.max(0, v - (s.hx[i] || 0)));
            const nl = s.n.map((v, i) => Math.max(0, v - (nx[i] || 0)));
            if (hl.some(v => v > 0.5)) rows.push({ s, tag: '', h: hl, n: nl });
            rows.push({ s, tag: 'x', h: s.hx, n: nx });
        } else {
            rows.push({ s, tag: '', h: s.h, n: s.n });
        }
    }
    return rows;
}

function openSegmentDrill(gi) {
    drillSeg = gi;
    drillStn = null;
    renderSegmentDrill();
}

function renderSegmentDrill() {
    if (!staticData || drillSeg === null) return;
    const S = STR[lang];
    const c = staticData.segments[drillSeg];
    const matches = segMatches(drillSeg);
    if (!c || !matches.length) { closeDrill(); return; }

    // Left of the panel is the western end, an arbitrary but stable choice
    // that keeps the two directions telling each other apart.
    const aLeft = c.p[1] <= c.p[3];
    const leftKo = aLeft ? c.a : c.b;
    const leftName = aLeft ? ((lang === 'en' && c.ae) || c.a)
                           : ((lang === 'en' && c.be) || c.b);
    const rightName = aLeft ? ((lang === 'en' && c.be) || c.b)
                            : ((lang === 'en' && c.ae) || c.a);

    const rows = segServices(matches);
    rows.sort((p, q) => (lineRank(p.s.line) - lineRank(q.s.line)) ||
        ((p.s.a === leftKo ? 0 : 1) - (q.s.a === leftKo ? 0 : 1)) ||
        (p.tag < q.tag ? -1 : p.tag > q.tag ? 1 : 0));

    const crowd = segMetric === 'crowd';
    const N = DATA_STATIC_HOURS.length;
    const valOf = r => {
        if (!crowd) return h => r.h[h] || 0;
        const cap = LINE_CAPACITY[r.s.line] || 1000;
        return h => (r.n[h] > 0 ? (r.h[h] / r.n[h]) / cap : 0);
    };

    let maxVal = 0;
    for (const r of rows) {
        const f = valOf(r);
        for (let h = 0; h < N; h++) if (f(h) > maxVal) maxVal = f(h);
    }
    // In crowd mode hold the axis at 100% or above, so the capacity line is
    // always on the chart; a segment that runs over it grows the chart and
    // pushes the line down instead of off the top.
    if (crowd) maxVal = Math.max(1, maxVal);
    const refRatio = crowd ? 1 / maxVal : null;

    const tipOf = r => {
        if (!crowd) {
            return h => hourRange(h) + ' · ' + S.drillCarried(fmtNum(r.h[h] || 0));
        }
        const cap = LINE_CAPACITY[r.s.line] || 1000;
        return h => {
            const avg = r.n[h] > 0 ? r.h[h] / r.n[h] : 0;
            return hourRange(h) + ' · ' +
                S.drillFull(Math.round((avg / cap) * 100), fmtNum(avg));
        };
    };

    // Totals stay rider counts whichever way the bars are drawn: a crowding
    // percentage does not add up into a meaningful figure for the day.
    let grand = 0;
    const rowsHTML = rows.map(r => {
        let t = 0;
        for (let h = 0; h < N; h++) t += r.h[h] || 0;
        grand += t;
        const arrow = r.s.a === leftKo ? '&gt;' : '&lt;';
        return drillRow(r.s.line, arrow, r.tag === 'x' ? S.expressTag : '',
            valOf(r), maxVal, tipOf(r), refRatio, fmtNum(t));
    }).join('');

    const btn = (k, label) => '<button class="drill-btn' +
        (segMetric === k ? ' active' : '') + '" data-sm="' + k + '">' +
        label + '</button>';

    showDrill(
        '<div class="drill-header">' +
            '<span class="drill-station-name left">' + esc(leftName) + '</span>' +
            '<span class="drill-sep"></span>' +
            '<span class="drill-station-name right">' + esc(rightName) + '</span>' +
        '</div>' +
        '<div class="drill-metric-buttons">' + btn('riders', S.mRiders) +
            btn('crowd', S.mCrowd) +
            '<span class="drill-total">' + fmtNum(grand) + '</span></div>' +
        '<div class="drill-rows">' + rowsHTML + '</div>' + drillAxis() +
        // Only when something was actually folded -- a segment the 직통 does
        // not run over has nothing to explain away.
        (rows.some(r => NO_EXPRESS_SPLIT.has(r.s.line) && r.s.hx &&
                        r.s.hx.some(v => v > 0.5))
            ? '<div class="drill-note">' + S.drillNoSplitNote + '</div>' : '') +
        (crowd ? '<div class="drill-note">' + S.drillCapNote + '</div>' : ''));

    for (const b of $('drill-panel').querySelectorAll('.drill-btn[data-sm]')) {
        b.onclick = () => { segMetric = b.dataset.sm; renderSegmentDrill(); };
    }
    renderHighlight();
}

// ------------------------------------------------------- station drill
function openStationDrill(si) {
    drillStn = si;
    drillSeg = null;
    clearHighlight();
    renderStationDrill();
}

function renderStationDrill() {
    if (!staticData || drillStn === null) return;
    const S = STR[lang];
    const st = staticData.stations[drillStn];
    if (!st) { closeDrill(); return; }
    const lines = Object.keys(st.by_line).sort((a, b) => lineRank(a) - lineRank(b));
    const N = DATA_STATIC_HOURS.length;
    const split = !!(staticData.build && staticData.build.split_boardings);

    const cell = (L, h) => {
        const all = (L.b || [])[h] || 0;
        const b0 = split ? ((L.b0 || [])[h] || 0) : all;
        if (staticBoard === 'b0') return b0;
        if (staticBoard === 'x') return Math.max(0, all - b0);
        return all;
    };
    // The scale is locked to all boardings, so picking a subset only ever
    // shrinks the bars -- the rows stay comparable across the three views.
    let maxVal = 0;
    for (const l of lines) {
        const b = st.by_line[l].b || [];
        for (let h = 0; h < N; h++) if (b[h] > maxVal) maxVal = b[h];
    }

    const word = S.drillBoard[staticBoard] || S.drillBoard.b;
    let grand = 0;
    const rowsHTML = lines.map(l => {
        const L = st.by_line[l];
        let t = 0;
        for (let h = 0; h < N; h++) t += cell(L, h);
        grand += t;
        return drillRow(l, '', '', h => cell(L, h), maxVal,
            h => hourRange(h) + ' · ' + word(fmtNum(cell(L, h))),
            null, fmtNum(t));
    }).join('');

    const btn = (k, label) => '<button class="drill-btn' +
        (staticBoard === k ? ' active' : '') + '" data-bd="' + k + '">' +
        label + '</button>';

    showDrill(
        '<div class="drill-header"><span class="drill-station-name left">' +
            esc(stnLabel(st)) + '</span></div>' +
        '<div class="drill-metric-buttons">' + btn('b', S.boardAll) +
            btn('b0', S.boardFirst) + btn('x', S.boardXfer) +
            '<span class="drill-total">' + fmtNum(grand) + '</span></div>' +
        '<div class="drill-rows">' + (rowsHTML ||
            '<div class="drill-note">' + S.drillNoData + '</div>') + '</div>' +
        drillAxis());

    for (const b of $('drill-panel').querySelectorAll('.drill-btn[data-bd]')) {
        b.onclick = () => setBoard(b.dataset.bd);
    }
}

// All boardings / only the rider's first / only the changes of train. One
// setting, reachable from the drill panel and from the day settings, and
// the map's circles follow it either way.
function setBoard(key) {
    staticBoard = key;
    for (const [id, k] of [['b-all', 'b'], ['b-first', 'b0'], ['b-xfer', 'x']]) {
        $(id).classList.toggle('active', k === key);
    }
    clearPins();
    renderStatic();
    if (drillStn !== null) renderStationDrill();
}

function refreshDrill() {
    if (drillSeg !== null) renderSegmentDrill();
    else if (drillStn !== null) renderStationDrill();
}

// ----------------------------------------------------------- highlight
// The picked segments, lifted out of the map: a white halo under them and a
// wash of white over, so the stripe lightens rather than only gaining a rim.
function clearHighlight() {
    const src = map.getSource && map.getSource('static-hl');
    if (src) src.setData(EMPTY);
}

function renderHighlight() {
    if (!map.getSource('static-hl')) return;
    if (!staticMode || drillSeg === null) { clearHighlight(); return; }
    const segScale = staticHour ? segScaleHour : segScaleAll;
    const feats = [];
    for (const s of segMatches(drillSeg)) {
        const v = hourValue(s.h, staticHour);
        const w = Math.max(0.6, 11 * staticScale *
                                Math.sqrt(v / Math.max(segScale, 1)));
        feats.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: shapeFor(s) },
            properties: { w: w, wo: w + 3.5 },
        });
    }
    map.getSource('static-hl').setData(
        { type: 'FeatureCollection', features: feats });
}

// ---------------------------------------------------------------- tooltips
// `short` is for the drill panel, where the chip has a fixed width to keep
// every row's chart starting at the same place: the English names all end
// in the same word, and the coloured chip has already said "line".
function routeIcon(line, short) {
    const bg = LINE_COLORS[line] || '#888';
    const fg = needsDarkText(bg) ? '#111' : '#fff';
    // Seoul signage puts a numbered line in a filled circle; the named lines
    // get a chip, because 경의중앙선 does not fit in one.
    const numbered = /^\d$/.test(line);
    const full = lineLabel(line);
    const label = numbered ? line
        : (short && lang === 'en' ? full.replace(/ Line$/, '') : full);
    return '<span class="route-icon' + (numbered ? '' : ' named') +
        '" title="' + esc(full) + '" style="background:' + bg + ';color:' +
        fg + '">' + esc(label) + '</span>';
}

function trainTip(route, riders, express) {
    const S = STR[lang];
    return '<span class="route-icons">' + routeIcon(route) + '</span>' +
        '<span class="tip-count">' + S.tipRiders(fmtNum(riders)) + '</span>' +
        (express ? '<span class="tip-note">' + S.tipExpress + '</span>' : '');
}

function staticSegTip(p) {
    const S = STR[lang];
    const lm = staticData.line_meta[p.line] || {};
    const mod = Math.round(100 * (lm.modelled || 0));
    const a = (lang === 'en' && p.ae) || p.a;
    const b = (lang === 'en' && p.be) || p.b;
    return '<span class="route-icons">' + routeIcon(p.line) + '</span>' +
        '<span class="tip-name">' + a + ' → ' + b + '</span>' +
        '<span class="tip-count">' + S.tipCarried(fmtNum(p.riders)) +
        '</span>' +
        (mod >= 5 ? '<span class="tip-note">' + S.tipModelled(mod)
                    + '</span>' : '');
}

function staticStnTip(si) {
    const S = STR[lang];
    const st = staticData.stations[si];
    const b = Math.round(stationValue(st, staticHour, 'b'));
    const a = Math.round(stationValue(st, staticHour, 'a'));
    const x = Math.round(stationValue(st, staticHour, 'x'));
    const icons = (st.lines || []).map(routeIcon).join('');
    const mod = Math.round(100 * (st.m || 0));
    return '<span class="tip-name">' + stnLabel(st) + '</span>' +
        (icons ? '<span class="route-icons">' + icons + '</span>' : '') +
        '<span class="tip-count">' +
        S.tipOnOff(fmtNum(b), fmtNum(a)) + '</span>' +
        (x > 0 ? '<span class="tip-note">' + S.tipChanging(fmtNum(x))
                 + '</span>' : '') +
        (mod >= 5 ? '<span class="tip-note">' + S.tipModelled(mod)
                    + '</span>' : '');
}

function stationTip(si) {
    const s = DATA.stations[si];
    if (!s) return '';
    const icons = (s.lines || []).map(routeIcon).join('');
    const w = waitByStation.get(si);
    const n = w ? Math.round(stationWaiting(w)) : 0;
    return '<span class="tip-name">' + stnLabel(s) + '</span>' +
        (icons ? '<span class="route-icons">' + icons + '</span>' : '') +
        '<span class="tip-count">' + STR[lang].tipWaiting(fmtNum(n)) +
        '</span>';
}

function makePopup() {
    return new maplibregl.Popup({
        closeButton: false, closeOnClick: false,
        className: 'train-tooltip', offset: 12,
    });
}

const hoverTip = makePopup();
let hoverKind = null;        // 'train' | 'station' | null
let lastMouse = null;        // pixel point, or null when the pointer is off-map
const pinned = [];           // click to keep a tooltip; it stays live


// Every way out of a pinned tooltip goes through here: Escape, a click on
// empty map, and switching between the live and day views. A pinned *train*
// cannot survive that switch -- trainPositions stops being refreshed in static
// mode, so the popup would sit at whatever coordinate it last had, showing a
// count for a train that is no longer being drawn, and no longer removing
// itself because its position still looks valid.
function clearPins() {
    for (const L of pinned) L.popup.remove();
    pinned.length = 0;
}

// Everything under the cursor is moving, so rather than trusting a mouseenter
// that fired several frames ago, ask each frame what is there now. That also
// covers the case the pointer never moves and a train slides underneath it.
function refreshTooltips() {
    let hit = null;
    if (staticMode) {
        if (lastMouse) {
            const sf = map.queryRenderedFeatures(lastMouse,
                { layers: ['static-stn'].filter(l => map.getLayer(l)) });
            if (sf.length) {
                hit = 'station';
                hoverTip.setLngLat(sf[0].geometry.coordinates)
                    .setHTML(staticStnTip(sf[0].properties.si)).addTo(map);
            } else {
                const gf = map.queryRenderedFeatures(lastMouse, {
                    layers: ['static-seg'].filter(l => map.getLayer(l)) });
                if (gf.length) {
                    hit = 'segment';
                    hoverTip.setLngLat(map.unproject(lastMouse))
                        .setHTML(staticSegTip(gf[0].properties)).addTo(map);
                }
            }
        }
        if (hit !== hoverKind) {
            map.getCanvas().style.cursor = hit ? 'pointer' : '';
            if (!hit) hoverTip.remove();
            hoverKind = hit;
        }
        return;
    }
    if (lastMouse) {
        const d = pickDot(lastMouse);
        if (d && d.kind === 'train') {
            hit = 'train';
            hoverTip.setLngLat([d.t.lon, d.t.lat])
                .setHTML(trainTip(d.t.route, Math.round(d.t.n), d.t.express))
                .addTo(map);
        } else if (d) {
            hit = 'station';
            hoverTip.setLngLat([d.lon, d.lat])
                .setHTML(stationTip(d.si)).addTo(map);
        } else {
            // The plain station dots are still a MapLibre layer, being static.
            const sf = map.queryRenderedFeatures(lastMouse, {
                layers: ['stations'].filter(l => map.getLayer(l)) });
            if (sf.length) {
                hit = 'station';
                hoverTip.setLngLat(sf[0].geometry.coordinates)
                    .setHTML(stationTip(sf[0].properties.si)).addTo(map);
            }
        }
    }
    if (hit !== hoverKind) {
        map.getCanvas().style.cursor = hit ? 'pointer' : '';
        if (!hit) hoverTip.remove();
        hoverKind = hit;
    }

    for (let i = pinned.length - 1; i >= 0; i--) {
        const L = pinned[i];
        if (L.kind === 'station') {
            L.popup.setHTML(stationTip(L.si));
            continue;
        }
        const pos = trainPositions.get(L.ti);
        if (!pos) {              // the run has ended, so the pin has nothing left
            L.popup.remove();
            pinned.splice(i, 1);
            continue;
        }
        const tr = trains[L.ti];
        L.popup.setLngLat([pos[0], pos[1]])
            .setHTML(trainTip(tr.route, pos[2], tr.express));
    }
}

// ---------------------------------------------------------------- ui
const SPEED_STOPS = [1 / 60, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 1,
                     1.5, 2, 3, 5, 7, 10, 15, 20];

function speedLabel(s) {
    return Math.abs(s - 1 / 60) < 1e-9 ? STR[lang].realTime : s + '×';
}

// Playing and speed are one control on the bar: the 1× and 2× buttons pick
// a speed and start the clock, the pause button stops it without forgetting
// which speed it was on.
function setSpeed(s) {
    if (s > 0) { speed = s; playing = true; }
    else playing = false;
    anchorSim = simTime; anchorWall = performance.now();
    for (const b of document.querySelectorAll('#speed-buttons button[data-speed]')) {
        const v = +b.dataset.speed;
        b.classList.toggle('active', v === 0 ? !playing : (playing && v === speed));
    }
    $('speed').value = Math.max(0, SPEED_STOPS.indexOf(speed));
    $('speed-val').textContent = speedLabel(speed);
    $('play').title = playing ? STR[lang].pause : STR[lang].play;
    invalidate();
}

function wireUI() {
    $('lang-en').onclick = () => { lang = 'en'; applyLang(); };
    $('lang-ko').onclick = () => { lang = 'ko'; applyLang(); };
    for (const [gear, panel] of [['gear', 'settings'],
                                 ['static-gear', 'static-settings']]) {
        $(gear).addEventListener('mousedown', e => e.preventDefault());
        $(gear).onclick = () => {
            const open = $(panel).classList.toggle('hidden');
            $(gear).classList.toggle('active', !open);
        };
    }
    for (const b of document.querySelectorAll('#speed-buttons button[data-speed]')) {
        b.addEventListener('mousedown', e => e.preventDefault());
        b.onclick = () => {
            const s = +b.dataset.speed;
            setSpeed(s === 0 ? (playing ? 0 : speed) : s);
        };
    }
    for (const b of document.querySelectorAll('#static-speed-buttons button[data-static-speed]')) {
        b.addEventListener('mousedown', e => e.preventDefault());
        b.onclick = () => {
            const s = +b.dataset.staticSpeed;
            setStaticPlay(s === 0 ? (staticPlay > 0 ? 0 : 1) : s);
        };
    }
    // all boardings / only the rider's first / only the changes of train
    for (const [id, key] of [['b-all', 'b'], ['b-first', 'b0'],
                             ['b-xfer', 'x']]) {
        $(id).addEventListener('mousedown', e => e.preventDefault());
        $(id).onclick = () => setBoard(key);
    }
    $('t-static').addEventListener('mousedown', e => e.preventDefault());
    $('t-static').onclick = () => {
        if (staticMode) { setStaticMode(false); return; }
        loadStatic().then(() => setStaticMode(true));
    };
    $('time-slider').oninput = e => {
        if (staticMode) {
            setStaticPlay(0);
            staticHour = +e.target.value;
            renderStatic();
            return;
        }
        simTime = tMin + (tMax - tMin) * (+e.target.value / 1000);
        anchorSim = simTime; anchorWall = performance.now();
        invalidate();
    };
    $('speed').oninput = e => setSpeed(SPEED_STOPS[+e.target.value]);
    $('dotsize').oninput = e => { dotScale = +e.target.value; invalidate(); };
    $('static-size').oninput = e => {
        staticScale = +e.target.value / 100;
        if (staticData) renderStatic();
    };
    $('cb-stations').onchange = e => {
        showStations = e.target.checked;
        map.setLayoutProperty('stations', 'visibility',
                              showStations ? 'visible' : 'none');
        invalidate();   // the waiting dots are drawn by the overlay
    };
    $('cb-lines').onchange = e => {
        map.setLayoutProperty('lines', 'visibility',
                              e.target.checked ? 'visible' : 'none');
    };
    setSpeed(1);

    // The bars in the drill panel are hover targets; the tooltip is one
    // element the whole panel writes into rather than one per bar.
    const dp = $('drill-panel'), dt = $('drill-tooltip');
    dp.addEventListener('mousemove', e => {
        const tip = e.target && e.target.dataset && e.target.dataset.tip;
        if (!tip) { dt.classList.add('hidden'); return; }
        dt.textContent = tip;
        dt.style.left = (e.clientX + 12) + 'px';
        dt.style.top = (e.clientY - 26) + 'px';
        dt.classList.remove('hidden');
    });
    dp.addEventListener('mouseleave', () => dt.classList.add('hidden'));

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && !staticMode) {
            e.preventDefault();
            setSpeed(playing ? 0 : speed);
        }
        if (e.code === 'Escape') { clearPins(); closeDrill(); }
    });

    // Hover is resolved inside render, so a pointer move has to wake the loop
    // when the clock is stopped -- and the dot radii track zoom, so a camera
    // move has to as well.
    map.on('mousemove', e => { lastMouse = e.point; invalidate(); });
    map.on('mouseout', () => { lastMouse = null; invalidate(); });
    map.on('move', invalidate);

    // An unfocused window is often still on screen -- a second monitor, or
    // sitting beside an editor -- so it keeps running, just slowly. Only a
    // genuinely hidden page stops, and then the clock freezes with it so
    // coming back lands where you left off rather than at some arbitrary hour.
    window.addEventListener('blur', () => { RENDER_MS = RENDER_MS_BLURRED; });
    window.addEventListener('focus', () => {
        RENDER_MS = RENDER_MS_FOCUSED;
        invalidate();
    });
    document.addEventListener('visibilitychange',
        () => (document.hidden ? suspend() : resume()));

    map.on('click', e => {
        // In the day view a click opens the drill panel rather than pinning
        // a tooltip: the station bubbles are boardings, not a crowd waiting,
        // and there is a whole day behind each of them.
        if (staticMode) {
            const q = ids => map.queryRenderedFeatures(e.point,
                { layers: ids.filter(l => map.getLayer(l)) });
            const sf = q(['static-stn']);
            if (sf.length) { openStationDrill(sf[0].properties.si); return; }
            const gf = q(['static-seg']);
            if (gf.length) { openSegmentDrill(gf[0].properties.gi); return; }
            closeDrill();
            return;
        }
        const d = pickDot(e.point);
        if (d && d.kind === 'train') {
            const popup = makePopup();
            popup.setLngLat([d.t.lon, d.t.lat])
                .setHTML(trainTip(d.t.route, Math.round(d.t.n), d.t.express))
                .addTo(map);
            pinned.push({ kind: 'train', popup: popup, ti: d.t.ti });
            return;
        }
        let si = d ? d.si : null, at = d ? [d.lon, d.lat] : null;
        if (si === null) {
            const sf = map.queryRenderedFeatures(e.point, {
                layers: ['stations'].filter(l => map.getLayer(l)) });
            // Nothing under the cursor. Clicking empty map is how anyone
            // expects to dismiss these, so do that rather than nothing --
            // otherwise the only way out is a keyboard shortcut nobody was
            // told about.
            if (!sf.length) { clearPins(); return; }
            si = sf[0].properties.si;
            at = sf[0].geometry.coordinates;
        }
        const popup = makePopup();
        popup.setLngLat(at).setHTML(stationTip(si)).addTo(map);
        pinned.push({ kind: 'station', popup: popup, si: si });
    });
}
</script>
</body>
</html>
