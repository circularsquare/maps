<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>türkiye population on terrain</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #eee; font-family: 'Nunito', sans-serif; overflow: hidden; }
#map { width: 100vw; height: 100vh; }

#panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(10,10,10,0.85);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 258px;
}
.row { display: flex; align-items: center; gap: 10px; }
.label { font-size: 12px; color: #ccc; flex-shrink: 0; }
.value { font-size: 12px; color: #888; margin-left: auto; font-variant-numeric: tabular-nums; }
.row input[type=range] { flex: 1; min-width: 0; accent-color: #6889a8; }

#views { display: flex; flex-wrap: wrap; gap: 5px; border-top: 1px solid #2a2a2a; padding-top: 8px; }
#views button {
    font-family: inherit;
    font-size: 12px;
    color: #ccc;
    background: rgba(255,255,255,0.05);
    border: 1px solid #333;
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
}
#views button:hover { background: rgba(255,255,255,0.12); color: #fff; }

#legend {
    position: absolute;
    left: 10px;
    bottom: 24px;
    z-index: 9999;
    background: rgba(10,10,10,0.85);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    width: 250px;
}
#legend .title { font-size: 12px; color: #ccc; margin-bottom: 7px; }
/* generated by ramp.py -- re-run it after editing STOPS */
#ramp { height: 9px; border-radius: 2px; background: #221c2e; }
#ramp > div {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(to right,
        rgba(27,12,48,0.00) 0%, rgba(74,19,97,0.82) 18%, rgba(138,31,107,1.00) 36%,
        rgba(197,58,96,1.00) 54%, rgba(236,111,63,1.00) 70%, rgba(249,167,43,1.00) 84%,
        rgba(253,212,83,1.00) 93%, rgba(255,248,212,1.00) 100%);
}
#ticks { position: relative; height: 14px; margin-top: 2px; }
#ticks span {
    position: absolute;
    transform: translateX(-50%);
    font-size: 11px;
    color: #888;
    font-variant-numeric: tabular-nums;
}
#legend .note { font-size: 11px; color: #777; line-height: 1.45; margin-top: 7px; }

.city {
    font-size: 12px;
    color: #e8e2f0;
    text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000;
    white-space: nowrap;
    pointer-events: none;
    transform: translateX(7px);
}
.city.major { font-weight: 700; font-size: 13px; color: #fff; }

.maplibregl-ctrl-attrib { font-family: 'Nunito', sans-serif; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
    <div class="row">
        <span class="label">Terrain</span>
        <input id="exag" type="range" min="0" max="15" step="0.1" value="6.5">
        <span class="value" id="exag-val">6.5x</span>
    </div>
    <div class="row">
        <span class="label">Shading</span>
        <input id="shade" type="range" min="0" max="1" step="0.02" value="0.8">
        <span class="value" id="shade-val">0.80</span>
    </div>
    <div class="row">
        <span class="label">Light</span>
        <input id="light" type="range" min="0" max="359" step="1" value="315">
        <span class="value" id="light-val">315&deg;</span>
    </div>
    <div id="views"></div>
</div>

<div id="legend">
    <div class="title">People per 100 m cell</div>
    <div id="ramp"><div></div></div>
    <div id="ticks">
        <span style="left:16.7%">1</span>
        <span style="left:44.5%">10</span>
        <span style="left:72.2%">100</span>
        <span style="left:100%">1,000</span>
    </div>
    <div class="note">
        WorldPop 2020, UN-adjusted constrained grid. Elevation from Terrain
        Tiles on AWS Open Data. Right-drag or ctrl-drag to tilt and rotate.
    </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
const BOUNDS = [25.664583, 35.815417, 44.834583, 42.106250];

/* Draw order is bottom to top, and MapLibre drapes background, raster and
   hillshade layers onto the terrain mesh in that order. The hillshade sits
   above the population so the relief shades the colours rather than being
   hidden by them. */
const style = {
    version: 8,
    sources: {
        /* Same tiles twice, on purpose: MapLibre warns against driving the
           terrain mesh and a hillshade layer off one source, because they want
           the DEM at different zooms and sharing costs hillshade quality. The
           browser cache means the second source is not a second download. */
        dem: {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 13,
            attribution: '<a href="https://registry.opendata.aws/terrain-tiles/">Terrain Tiles</a>'
        },
        demshade: {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 12
        },
        pop: {
            type: 'raster',
            tiles: ['data/tiles/{z}/{x}/{y}.png'],
            tileSize: 512,
            minzoom: 2,
            maxzoom: 10,
            bounds: BOUNDS,
            attribution: '<a href="https://www.worldpop.org/">WorldPop</a>'
        }
    },
    layers: [
        /* Lifted off near-black on purpose. The hillshade above can only
           darken from the ground colour it is given, so a black base leaves
           shadows nowhere to go and the relief disappears. Keep #ramp in the
           legend and BASE in preview.py on this same value. */
        { id: 'base', type: 'background', paint: { 'background-color': '#221c2e' } },
        { id: 'pop', type: 'raster', source: 'pop', paint: { 'raster-opacity': 1, 'raster-resampling': 'nearest' } },
        {
            id: 'hillshade',
            type: 'hillshade',
            source: 'demshade',
            paint: {
                'hillshade-exaggeration': 0.8,
                'hillshade-illumination-direction': 315,
                'hillshade-illumination-anchor': 'map',
                'hillshade-shadow-color': 'rgba(0,0,0,0.72)',
                'hillshade-highlight-color': 'rgba(255,240,220,0.40)',
                'hillshade-accent-color': 'rgba(90,120,160,0.22)'
            }
        }
    ],
    terrain: { source: 'dem', exaggeration: 6.5 },
    sky: {
        'sky-color': '#090714',
        'sky-horizon-blend': 0.55,
        'horizon-color': '#2a1c3a',
        'horizon-fog-blend': 0.6,
        'fog-color': '#140d20',
        'fog-ground-blend': 0.02
    }
};

const VIEWS = {
    'Türkiye':  { center: [35.30, 38.60], zoom: 5.35, pitch: 48, bearing: 0 },
    'Antalya':  { center: [30.75, 36.95], zoom: 8.4,  pitch: 70, bearing: -22 },
    'İstanbul': { center: [28.98, 40.98], zoom: 9.3,  pitch: 62, bearing: 18 },
    'Van':      { center: [43.30, 38.42], zoom: 8.0,  pitch: 70, bearing: 12 }
};

const CITIES = [
    ['İstanbul', 28.98, 41.01, 1], ['Ankara', 32.85, 39.93, 1],
    ['İzmir', 27.14, 38.42, 1],    ['Bursa', 29.06, 40.19, 0],
    ['Antalya', 30.71, 36.90, 0],  ['Adana', 35.32, 37.00, 0],
    ['Konya', 32.48, 37.87, 0],    ['Gaziantep', 37.38, 37.07, 0],
    ['Kayseri', 35.49, 38.73, 0],  ['Samsun', 36.33, 41.29, 0],
    ['Trabzon', 39.72, 41.00, 0],  ['Erzurum', 41.27, 39.90, 0],
    ['Diyarbakır', 40.23, 37.91, 0], ['Van', 43.38, 38.49, 0]
];

const map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: VIEWS['Türkiye'].center,
    zoom: VIEWS['Türkiye'].zoom,
    pitch: VIEWS['Türkiye'].pitch,
    maxPitch: 85,
    minZoom: 3,
    maxZoom: 13,
    attributionControl: { compact: false }
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-right');

/* MapLibre's right-drag rotate turns the scene the opposite way to the drag:
   dragging right raises the bearing, and raising the bearing spins the ground
   anticlockwise under you. There is no option to flip it, so the built-in
   handler goes and this one replaces it.

   The directions below are MapLibre's own, settled by trying both: drag right
   and the bearing rises, drag down and the map flattens towards overhead.
   What actually made the stock handler feel sick was not its direction but
   the latched drag below, so only the speed and the latch changed. Speed is
   half MapLibre's 0.8 deg/px, and there is no inertia, which is calmer. */
const TURN_BASE = 1;
const TILT_BASE = -1;
const TURN_SPEED = 0.4;
const TILT_SPEED = 0.4;

map.dragRotate.disable();

const canvas = map.getCanvas();
let dragFrom = null;

const endDrag = () => { dragFrom = null; };

canvas.addEventListener('contextmenu', e => e.preventDefault());

/* Pointer capture, not window listeners: releasing the button outside the
   browser window never delivers a mouseup, which left the drag latched on and
   the map spinning on plain mouse movement afterwards. The buttons check is
   the belt to that braces. */
canvas.addEventListener('pointerdown', e => {
    if (e.button === 2 || (e.button === 0 && e.ctrlKey)) {
        dragFrom = { x: e.clientX, y: e.clientY };
        // throws for a synthetic PointerEvent with no real pointer behind it
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
        e.preventDefault();
    }
});
canvas.addEventListener('pointermove', e => {
    if (!dragFrom) return;
    if (e.buttons === 0) return endDrag();
    const dx = e.clientX - dragFrom.x;
    const dy = e.clientY - dragFrom.y;
    dragFrom = { x: e.clientX, y: e.clientY };
    // setPitch clamps to the map's minPitch/maxPitch, so no guard needed here
    map.setBearing(map.getBearing() + TURN_BASE * dx * TURN_SPEED);
    map.setPitch(map.getPitch() + TILT_BASE * dy * TILT_SPEED);
});
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', endDrag);

/* Everything below touches the style, so it waits for load -- setTerrain and
   setPaintProperty both throw "Style is not done loading" if called earlier. */
const bind = (id, fmt, apply) => {
    const input = document.getElementById(id);
    const out = document.getElementById(id + '-val');
    const run = () => {
        const v = parseFloat(input.value);
        out.textContent = fmt(v);
        apply(v);
    };
    input.addEventListener('input', run);
    run();
};

map.on('load', () => {
    const placed = [];
    for (const [name, lon, lat, major] of CITIES) {
        const el = document.createElement('div');
        el.className = major ? 'city major' : 'city';
        el.textContent = name;
        const at = new maplibregl.LngLat(lon, lat);
        /* opacityWhenCovered defaults to 0.2, and at this exaggeration the
           mesh counts most cities as hidden behind a ridge, so every label
           greys out. The occlusion is an artefact of the exaggeration rather
           than real terrain, so switch it off and keep them legible. */
        new maplibregl.Marker({ element: el, anchor: 'left', opacityWhenCovered: '1' })
            .setLngLat(at).addTo(map);
        placed.push({ el, at });
    }

    /* Markers are not occluded by the terrain and do not fade with distance,
       so at a steep pitch a city 500 km away sits on the horizon looking
       local. Drop anything well outside the span the current zoom shows. */
    const cull = () => {
        const centre = map.getCenter();
        const limit = 12000 / Math.pow(2, map.getZoom() - 3);
        for (const { el, at } of placed) {
            el.style.visibility = centre.distanceTo(at) / 1000 > limit ? 'hidden' : 'visible';
        }
    };
    map.on('move', cull);
    cull();

    // exaggeration 0 flattens the mesh rather than tearing the source down
    bind('exag', v => v.toFixed(1) + 'x', v => map.setTerrain({ source: 'dem', exaggeration: v }));
    bind('shade', v => v.toFixed(2), v => map.setPaintProperty('hillshade', 'hillshade-exaggeration', v));
    bind('light', v => v.toFixed(0) + '°', v => map.setPaintProperty('hillshade', 'hillshade-illumination-direction', v));

    const views = document.getElementById('views');
    for (const [name, view] of Object.entries(VIEWS)) {
        const b = document.createElement('button');
        b.textContent = name;
        b.addEventListener('click', () => map.jumpTo(view));
        views.appendChild(b);
    }
});
</script>
</body>
</html>
