[package]
name = "trainworld-sim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["track-api", "diagram"]
# T-051: the clock worker's `TrackApi` (src/track/wasm.rs). On by default; the demand workers'
# module is built with `--no-default-features --features demand`, so it carries no track model.
track-api = []
# T-2589: the network diagram's carry on the rubber sheet (src/diagram.rs), in the track module for the diagram worker.
diagram = []
# Demand kernel (src/demand/, T-005, T-019, T-020). The app's wasm build enables it (T-026: the
# demand workers' `DemandApi`); plain `cargo test` and the pipeline-free builds leave it off.
demand = ["dep:serde_json", "dep:serde"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
serde = { version = "1", optional = true, features = ["derive"] }

# T-2716: the wasm modules' allocator (src/heap.rs), std's wasm32 one over a system side of our own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = "0.2.14"

[[bin]]
name = "demand_bench"
path = "src/bin/demand_bench.rs"
required-features = ["demand"]

# T-040: track model benchmark.
[[bin]]
name = "track_bench"
path = "src/bin/track_bench.rs"

# T-1283: service edits timed on a real save.
[[bin]]
name = "edit_bench"
path = "src/bin/edit_bench.rs"

# T-3137: what the lanes and move tables decide, fingerprinted to compare two builds.
[[bin]]
name = "lanes_parity"
path = "src/bin/lanes_parity.rs"

# T-019: the pipeline's gravity step (pipeline/build_city.py runs it).
[[bin]]
name = "pack_gravity"
path = "src/bin/pack_gravity.rs"
required-features = ["demand"]

# T-275: the walk's detour factors between nearby zones (pipeline/routes.py runs it).
[[bin]]
name = "pack_walk"
path = "src/bin/pack_walk.rs"
required-features = ["demand"]

# T-174: the regional market's all-pairs figures into its pack (pipeline/intercity.py runs it).
[[bin]]
name = "market_pack"
path = "src/bin/market_pack.rs"
required-features = ["demand"]

# T-007: the real New York network as a track-model save, and its demand snapshot.
[[bin]]
name = "realsave"
path = "src/bin/realsave.rs"
required-features = ["demand"]

# T-276: one commute gravity over every zone pack (pipeline/intercity.py runs it).
[[bin]]
name = "joint_gravity"
path = "src/bin/joint_gravity.rs"
required-features = ["demand"]

# T-1175: everyday outings across a zone line, per solve unit (pipeline/cross_everyday.py).
[[bin]]
name = "cross_everyday"
path = "src/bin/cross_everyday.rs"
required-features = ["demand"]

# T-276: each zone pack's local trips a day with no rail (pipeline/zones.py).
[[bin]]
name = "zone_summary"
path = "src/bin/zone_summary.rs"
required-features = ["demand"]

# T-509: one calibration run, a weekday on a city's real network with a parameter set.
[[bin]]
name = "calib"
path = "src/bin/calib.rs"
required-features = ["demand"]

# T-2690: each start's trips inside circles round its centre (pipeline/start_difficulty.py).
[[bin]]
name = "start_difficulty"
path = "src/bin/start_difficulty.rs"
required-features = ["demand"]

[profile.release]
opt-level = 3
lto = true

# T-051: the app's two wasm modules (app/package.json). One codegen unit: 2-5% smaller.
[profile.wasm]
inherits = "release"
codegen-units = 1
