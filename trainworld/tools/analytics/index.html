<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<title>trainworld player numbers</title>
<style>
:root {
  --bg: #0a0a0a; --fg: #eee; --dim: #999; --faint: #555; --line: #2a2a2a;
  --plays: #8fb8e8; --browsers: #e8b36a; --new: #8fd1a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 'Nunito', system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 15px; font-weight: 600; color: var(--dim); }
h2 { font-size: 15px; font-weight: 600; margin: 36px 0 10px; }
.sub { color: var(--dim); font-size: 13px; }
#now { font-size: 88px; font-weight: 700; line-height: 1; margin-top: 18px; font-variant-numeric: tabular-nums; }
#now.off { font-size: 28px; color: var(--dim); font-weight: 600; padding: 28px 0 6px; }
#nowlabel { color: var(--dim); margin-top: 4px; }
#unlock { margin-top: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#unlock[hidden], #app[hidden] { display: none; }
#unlock input { background: #181818; color: var(--fg); border: 1px solid var(--line); padding: 6px 9px; font: inherit; width: 260px; }
#unlock button { background: #181818; color: var(--fg); border: 1px solid var(--line); padding: 6px 12px; font: inherit; cursor: pointer; }
footer a { color: inherit; }
#err { color: #e88; font-size: 13px; margin-top: 8px; min-height: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 36px; }
.stat b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { color: var(--dim); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
#chartwrap { position: relative; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--dim); font-size: 11px; font-family: inherit; }
#tip, #bartip { position: absolute; pointer-events: none; background: #181818; border: 1px solid var(--line); padding: 6px 9px; font-size: 13px; line-height: 1.5; display: none; white-space: nowrap; }
#bartip { position: fixed; z-index: 10; }
#tip .d { color: var(--dim); }
.cols { display: flex; flex-wrap: wrap; gap: 24px 48px; }
.cols > div { min-width: 200px; flex: 1; }
.cols h3 { font-size: 13px; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 3px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; color: var(--dim); }
.bar:hover rect:last-of-type { opacity: .8; }

.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: #181818; color: var(--dim); border: 0; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: #2a2a2a; color: var(--fg); }
#map { height: 440px; border: 1px solid var(--line); background: #0a0a0a; }
#maptip { position: fixed; z-index: 10; pointer-events: none; background: #181818; border: 1px solid var(--line); padding: 6px 9px; font-size: 13px; line-height: 1.5; display: none; white-space: nowrap; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.lrow .n { width: 150px; flex: none; }
.lrow .b { flex: 1; height: 14px; }
.lrow .b i { display: block; height: 100%; background: var(--new); }
.lrow .v { width: 120px; flex: none; text-align: right; color: var(--dim); }
.more { background: none; border: 0; color: var(--dim); font: inherit; font-size: 13px; cursor: pointer; padding: 6px 0 0; text-decoration: underline; }
.maplibregl-ctrl-attrib { background: rgba(10,10,10,.7) !important; color: var(--dim) !important; }
.maplibregl-ctrl-attrib a { color: var(--dim) !important; }
footer { margin-top: 36px; color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>trainworld player numbers</h1>
  <div id="err"></div>
  <form id="unlock" hidden>
    <input id="key" type="password" autocomplete="off" placeholder="Admin key" aria-label="Admin key">
    <button>Unlock</button>
    <span class="sub" id="keynote"></span>
  </form>
  <div id="app" hidden>
  <div id="now">&nbsp;</div>
  <div id="nowlabel">playing now</div>

  <h2>Today so far (UTC)</h2>
  <div class="row" id="today"></div>

  <h2>By day (UTC)</h2>
  <div class="legend">
    <span><i style="border-color:var(--plays)"></i>plays</span>
    <span><i style="border-color:var(--browsers)"></i>browsers</span>
    <span><i style="border-color:var(--new);border-top-style:dashed"></i>new browsers</span>
  </div>
  <div id="chartwrap"><svg id="chart" viewBox="0 0 820 300" role="img" aria-label="Plays, browsers and new browsers per UTC day"></svg><div id="tip"></div></div>
  <div class="sub" id="chartnote"></div>

  <h2>Total time played per browser</h2>
  <div id="ptBrowsers"></div>
  <div class="sub" id="ptNoteB"></div>
  <h2>Total time played per account</h2>
  <div id="ptAccounts"></div>
  <div class="sub" id="ptNoteA"></div>

  <h2>Where games start</h2>
  <div class="toggles">
    <div class="seg" data-k="weight"><button data-v="plays" class="on">Plays</button><button data-v="minutes">Minutes played</button></div>
    <div class="seg" data-k="group"><button data-v="city" class="on">Start cities</button><button data-v="country">Countries</button></div>
  </div>
  <div id="map"></div>
  <div class="sub" id="mapnote" style="margin-top:6px"></div>
  <div id="maptip"></div>
  <div class="cols" style="margin-top:20px">
    <div><h3>Today</h3><table id="citiesToday"></table><button class="more" id="moreToday" hidden></button></div>
    <div><h3>Since the data starts</h3><table id="citiesAll"></table><button class="more" id="moreAll" hidden></button></div>
  </div>
  <div class="sub" id="citynote" style="margin-top:8px"></div>

  <h2>Browser language</h2>
  <div class="toggles">
    <div class="seg" data-k="weight"><button data-v="plays" class="on">Plays</button><button data-v="minutes">Minutes played</button></div>
  </div>
  <div id="langs"></div>
  <div class="sub" id="langnote" style="margin-top:8px"></div>

  <footer>Data from <span id="src"></span>, refreshed every 30 s. <span id="upd"></span> <a href="#" id="forget">Forget key</a></footer>
  </div>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script>
"use strict";
// ?server=http://127.0.0.1:8083/ points the page at a local build of shonei-server. Only a local address:
// the page sends the admin key to it (T-2912).
const LOCAL_SERVER = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/;
const asked = new URLSearchParams(location.search).get("server");
const BASE = asked && LOCAL_SERVER.test(asked) ? asked : "https://market.anita.garden/";
const URL_STATS = BASE.replace(/\/?$/, "/") + "trainworld/stats?days=400&starts=all";
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("en-US");
$("src").textContent = BASE.replace(/^https?:\/\//, "").replace(/\/$/, "");

// the same key and storage as the feedback inbox (same origin, so it is already there)
const KEY_STORE = "twfeedback.adminKey";
function storedKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function storeKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) { /* private window */ } }
let key = storedKey();
let timer = null;
function showUnlock(note) {
  $("app").hidden = true; $("unlock").hidden = false; $("keynote").textContent = note;
  clearInterval(timer); timer = null; days = [];
}
$("unlock").addEventListener("submit", (ev) => {
  ev.preventDefault();
  key = $("key").value.trim();
  if (!key) return;
  storeKey(key); $("key").value = ""; $("unlock").hidden = true; start();
});
$("forget").addEventListener("click", (ev) => { ev.preventDefault(); storeKey(""); key = ""; showUnlock("Key forgotten on this browser."); });

let days = [], lastData = null;

function renderNow(data) {
  const el = $("now");
  if (typeof data.now === "number") {
    el.className = ""; el.textContent = fmt(data.now);
    $("nowlabel").textContent = "playing now (pinged in the last 90 s)";
  } else {
    el.className = "off"; el.textContent = "not deployed yet";
    $("nowlabel").textContent = "playing now: the server has no live count yet";
  }
}

function renderToday(data) {
  const key = new Date().toISOString().slice(0, 10);
  const d = data.days.find((x) => x.day === key);
  const items = d
    ? [["plays", d.plays], ["plays over 5 min", d.plays5min], ["minutes played", d.minutes], ["browsers", d.browsers], ["new browsers", d.newBrowsers]]
    : [["plays", 0], ["plays over 5 min", 0], ["minutes played", 0], ["browsers", 0], ["new browsers", 0]];
  $("today").innerHTML = items.map(([l, v]) => `<div class="stat"><b>${fmt(v)}</b><span>${l}</span></div>`).join("");
}

let CITY = {};
const regionNames = (() => { try { return new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) { return null; } })();
const countryName = (code) => { try { return regionNames.of(code); } catch (e) { return code; } };
const view = { weight: "plays", group: "city" };
const expanded = { Today: false, All: false };
const SHORT = 10, LONG = 40;

function place(start) {
  if (start === "map") return { name: "Started on the map", cc: "" };
  if (start === "other") return { name: "other", cc: "" };
  const c = CITY[start];
  if (!c) return { name: "unknown", cc: "" };
  return { name: c[2], cc: c[3] };
}
// rows of [label, value] by country or by city, biggest first
function tally(starts, group, weight) {
  const sum = {};
  for (const s of starts) {
    const p = place(s.start);
    const label = group === "country" ? (p.cc ? countryName(p.cc) : p.name) : (p.cc ? `${p.name}, ${p.cc}` : p.name);
    sum[label] = (sum[label] || 0) + s[weight];
  }
  return Object.entries(sum).sort((a, b) => b[1] - a[1]);
}

function cityTable(id, rows, which) {
  const open = expanded[which], more = $("more" + which);
  const shown = rows.slice(0, open ? LONG : SHORT);
  $(id).innerHTML = shown.length
    ? shown.map(([c, n]) => `<tr><td>${c}</td><td>${fmt(n)}</td></tr>`).join("")
    : `<tr><td>none yet</td><td></td></tr>`;
  more.hidden = rows.length <= SHORT;
  more.textContent = open ? "Show fewer" : `Show ${Math.min(rows.length, LONG)} of ${fmt(rows.length)}`;
}

function renderCities(data) {
  const day = new Date().toISOString().slice(0, 10);
  const d = data.days.find((x) => x.day === day);
  const { weight, group } = view;
  cityTable("citiesToday", d ? tally(d.starts, group, weight) : [], "Today");
  cityTable("citiesAll", tally(data.days.flatMap((x) => x.starts), group, weight), "All");
  const full = data.days.some((x) => x.starts.length > 10);
  $("citynote").textContent = (weight === "plays" ? "Plays" : "Minutes played") + ` by ${group === "city" ? "start city" : "the country of the start city"}.` +
    (full ? "" : " This server lists each day's top 10 cities only, so these are lower bounds.");
  renderMap(data);
}
for (const w of ["Today", "All"]) $("more" + w).addEventListener("click", () => { expanded[w] = !expanded[w]; renderCities(lastData); });
for (const seg of document.querySelectorAll(".seg[data-k]")) {
  seg.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b || !lastData) return;
    view[seg.dataset.k] = b.dataset.v;
    for (const x of document.querySelectorAll(`.seg[data-k="${seg.dataset.k}"] button`)) x.classList.toggle("on", x.dataset.v === b.dataset.v);
    renderCities(lastData); renderLangs(lastData);
  });
}

// ---- browser language: the primary subtag groups pt-BR and pt-PT; the full tags are in the hover
const langNames = (() => { try { return new Intl.DisplayNames(["en"], { type: "language" }); } catch (e) { return null; } })();
const langName = (code) => { try { return langNames.of(code) || code; } catch (e) { return code; } };
const LANG_ROWS = 20;
function renderLangs(data) {
  const w = view.weight === "plays" ? "plays" : "minutes";
  const by = {};
  for (const d of data.days) for (const l of d.langs || []) {
    const g = l.lang.split("-")[0];
    const e = by[g] || (by[g] = { v: 0, tags: {} });
    e.v += l[w]; e.tags[l.lang] = (e.tags[l.lang] || 0) + l[w];
  }
  const rows = Object.entries(by).filter(([, e]) => e.v > 0).sort((a, b) => b[1].v - a[1].v);
  const total = rows.reduce((t, [, e]) => t + e.v, 0);
  const named = rows.filter(([g]) => g !== "unknown" && g !== "other");
  if (!named.length) {
    $("langs").innerHTML = `<div class="sub">No language counts yet. The game sends them from its next build, and the server has to be deployed to keep them.</div>`;
    $("langnote").textContent = "";
    return;
  }
  const max = rows[0][1].v;
  $("langs").innerHTML = rows.slice(0, LANG_ROWS).map(([g, e]) => {
    const tags = Object.entries(e.tags).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t} ${fmt(n)}`).join(", ");
    const label = g === "unknown" || g === "other" ? g : langName(g);
    return `<div class="lrow bar" data-tip="${label}: ${tags}"><span class="n">${label}</span><span class="b"><i style="width:${(100 * e.v / max).toFixed(1)}%"></i></span><span class="v">${fmt(e.v)} (${(100 * e.v / total).toFixed(1)}%)</span></div>`;
  }).join("");
  $("langnote").textContent = `${w === "plays" ? "Plays" : "Minutes played"} by the language the browser is set to, all days kept. Older plays and older game versions count as unknown.` +
    (rows.length > LANG_ROWS ? ` The top ${LANG_ROWS} of ${rows.length} languages.` : "");
}
$("langs").onmousemove = (ev) => {
  const bar = ev.target.closest(".bar");
  if (!bar) { barTip.style.display = "none"; return; }
  barTip.textContent = bar.dataset.tip;
  barTip.style.display = "block";
  barTip.style.left = Math.min(ev.clientX + 12, window.innerWidth - barTip.offsetWidth - 8) + "px";
  barTip.style.top = (ev.clientY + 12) + "px";
};
$("langs").onmouseleave = () => { barTip.style.display = "none"; };

// ---- map: one bubble per start city, or per country, area by the chosen weight
let map = null, mapReady = false;
const SKIP = new Set(["transportation", "transportation_name", "building", "poi", "aeroway", "housenumber", "aerodrome_label", "mountain_peak", "waterway", "water_name", "park", "landcover", "landuse"]);
function darken(m) {
  for (const l of m.getStyle().layers) {
    const sl = l["source-layer"];
    if (l.type === "background") m.setPaintProperty(l.id, "background-color", "#262626");
    else if (sl && SKIP.has(sl)) m.setLayoutProperty(l.id, "visibility", "none");
    else if (l.type === "fill") m.setPaintProperty(l.id, "fill-color", sl === "water" ? "#0a0a0a" : "#262626");
    else if (l.type === "line") m.setPaintProperty(l.id, "line-color", "#444");
    else if (l.type === "symbol") {
      if (/country|continent|state|ocean/.test(l.id)) { m.setPaintProperty(l.id, "text-color", "#5a5a5a"); m.setPaintProperty(l.id, "text-halo-color", "#0a0a0a"); }
      else m.setLayoutProperty(l.id, "visibility", "none");
    }
  }
}
function bubbles(data) {
  const { weight, group } = view;
  const by = {};
  let missing = 0;
  for (const s of data.days.flatMap((x) => x.starts)) {
    const c = CITY[s.start];
    if (s.start === "map") continue;
    if (!c) { missing += s[weight]; continue; }
    const k = group === "city" ? s.start : c[3];
    const e = by[k] || (by[k] = { w: 0, x: 0, y: 0, name: group === "city" ? `${c[2]}, ${c[3]}` : countryName(c[3]) });
    e.w += s[weight]; e.x += c[0] * s[weight]; e.y += c[1] * s[weight];
  }
  const feats = Object.values(by).filter((e) => e.w > 0).map((e) => ({
    type: "Feature", properties: { w: e.w, name: e.name },
    geometry: { type: "Point", coordinates: [e.x / e.w, e.y / e.w] },
  })).sort((a, b) => b.properties.w - a.properties.w);
  return { feats, missing };
}
function renderMap(data) {
  if (!window.maplibregl) { $("mapnote").textContent = "The map library did not load."; return; }
  if (!map) {
    map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [30, 30], zoom: 0.9, attributionControl: { compact: true }, dragRotate: false });
    map.touchZoomRotate.disableRotation();
    map.on("load", () => {
      darken(map);
      map.addSource("pts", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({ id: "pts", type: "circle", source: "pts", paint: {
        "circle-radius": 4, "circle-color": "#8fb8e8", "circle-opacity": 0.45,
        "circle-stroke-color": "#8fb8e8", "circle-stroke-width": 1, "circle-stroke-opacity": 0.9 } });
      mapReady = true;
      const tip = $("maptip");
      map.on("mousemove", "pts", (ev) => {
        const f = ev.features[0];
        tip.textContent = `${f.properties.name}: ${fmt(f.properties.w)} ${view.weight === "plays" ? "plays" : "minutes"}`;
        tip.style.display = "block";
        tip.style.left = Math.min(ev.originalEvent.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
        tip.style.top = (ev.originalEvent.clientY + 12) + "px";
      });
      map.on("mouseleave", "pts", () => { tip.style.display = "none"; });
      renderMap(lastData);
    });
    return;
  }
  if (!mapReady) return;
  const { feats, missing } = bubbles(data);
  const max = feats.length ? feats[0].properties.w : 1;
  const maxR = view.group === "city" ? 26 : 40;
  map.setPaintProperty("pts", "circle-radius", ["max", 3, ["*", maxR / Math.sqrt(max), ["sqrt", ["get", "w"]]]]);
  map.getSource("pts").setData({ type: "FeatureCollection", features: feats });
  const unit = view.weight === "plays" ? "plays" : "minutes";
  $("mapnote").textContent = `${fmt(feats.length)} ${view.group === "city" ? "cities" : "countries"}, bubble area is ${unit}, all days kept.` +
    (view.group === "country" ? " A country's bubble sits at the average of its start cities." : "") +
    (missing ? ` ${fmt(missing)} ${unit} have no city to place (other or unknown). Games started on the map have no bubble.` : "");
}

// ---- chart: three lines over UTC days, hover guide with a tip
const W = 820, H = 300, M = { l: 52, r: 12, t: 10, b: 28 };
const SERIES = [["plays", "plays", "var(--plays)", ""], ["browsers", "browsers", "var(--browsers)", ""], ["newBrowsers", "new browsers", "var(--new)", "5 4"]];

function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function renderChart(list) {
  const svg = $("chart");
  if (!list.length) { svg.innerHTML = ""; return; }
  const n = list.length;
  const max = niceMax(Math.max(...list.map((d) => Math.max(d.plays, d.browsers, d.newBrowsers))));
  const x = (i) => M.l + (n === 1 ? (W - M.l - M.r) / 2 : (i * (W - M.l - M.r)) / (n - 1));
  const y = (v) => M.t + (1 - v / max) * (H - M.t - M.b);
  let s = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4;
    s += `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/>`;
    s += `<text x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  list.forEach((d, i) => {
    if (i % step === 0) {
      s +=`<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.day.slice(5)}</text>`;
    }
  });
  for (const [k, , col, dash] of SERIES) {
    const pts = list.map((d, i) => `${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" ${dash ? `stroke-dasharray="${dash}"` : ""} stroke-linejoin="round"/>`;
    if (n < 40) list.forEach((d, i) => { s += `<circle cx="${x(i)}" cy="${y(d[k])}" r="2.5" fill="${col}"/>`; });
  }
  s += `<line id="guide" y1="${M.t}" y2="${H - M.b}" stroke="#666" style="display:none"/>`;
  s += `<rect id="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>`;
  svg.innerHTML = s;

  const tip = $("tip"), guide = $("guide"), wrap = $("chartwrap");
  const hit = $("hit");
  function move(ev) {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    let i = n === 1 ? 0 : Math.round(((px - M.l) / (W - M.l - M.r)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const d = list[i];
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i)); guide.style.display = "";
    tip.innerHTML = `<span class="d">${d.day} UTC</span><br>` + SERIES.map(([k, l, col]) => `<span style="color:${col}">${l}</span> ${fmt(d[k])}`).join("<br>");
    tip.style.display = "block";
    const wr = wrap.getBoundingClientRect();
    const left = (x(i) / W) * r.width;
    tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 10 : left + 10) + "px";
    tip.style.top = (ev.clientY - wr.top - tip.offsetHeight / 2) + "px";
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; guide.style.display = "none"; });
  $("chartnote").textContent = `${n} ${n === 1 ? "day" : "days"} from ${list[0].day}. Days before 2026-11-07 have no browser counts.`;
}

// ---- histograms: equal-width bars per bin (the bins themselves are uneven), height is total time played
const hrs = (m) => (m >= 600 ? fmt(Math.round(m / 60)) : (m / 60).toFixed(1)) + " h";
const barTip = document.body.appendChild(Object.assign(document.createElement("div"), { id: "bartip" }));
function renderBars(id, labels, counts, minutes, noun, color, h) {
  const w = 820, m = { l: 52, r: 12, t: 22, b: 28 };
  const hours = minutes.map((v) => v / 60);
  const max = niceMax(Math.max(...hours, 1));
  const n = labels.length, bw = (w - m.l - m.r) / n;
  const y = (v) => m.t + (1 - v / max) * (h - m.t - m.b);
  let s = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4;
    s += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/>`;
    s += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  s += `<text x="${m.l - 6}" y="10" text-anchor="end">hours played</text>`;
  labels.forEach((lb, i) => {
    const x0 = m.l + i * bw;
    const bh = y(0) - y(hours[i]);
    s += `<g class="bar" data-tip="${lb}: ${fmt(counts[i])} ${noun}, ${hrs(minutes[i])} played in all"><rect x="${x0}" y="${m.t}" width="${bw}" height="${h - m.t - m.b}" fill="transparent"/>` +
      `<rect x="${x0 + 3}" y="${y(hours[i])}" width="${bw - 6}" height="${Math.max(bh, minutes[i] ? 1 : 0)}" fill="${color}"/></g>`;
    s += `<text x="${x0 + bw / 2}" y="${h - 8}" text-anchor="middle">${lb}</text>`;
  });
  const box = $(id);
  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Hours played by ${noun}, grouped by each one's total time played">${s}</svg>`;
  box.onmousemove = (ev) => {
    const bar = ev.target.closest(".bar");
    if (!bar) { barTip.style.display = "none"; return; }
    barTip.textContent = bar.dataset.tip;
    barTip.style.display = "block";
    barTip.style.left = Math.min(ev.clientX + 12, window.innerWidth - barTip.offsetWidth - 8) + "px";
    barTip.style.top = (ev.clientY + 12) + "px";
  };
  box.onmouseleave = () => { barTip.style.display = "none"; };
}

function renderPlaytime(data) {
  const pt = data.playtime;
  if (!pt || !Array.isArray(pt.bins) || !Array.isArray(pt.browserMinutes)) {
    for (const id of ["ptBrowsers", "ptAccounts"]) $(id).innerHTML = `<div class="sub">not deployed yet</div>`;
    $("ptNoteB").textContent = ""; $("ptNoteA").textContent = "";
    return;
  }
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  renderBars("ptBrowsers", pt.bins, pt.browsers, pt.browserMinutes, "browsers", "var(--browsers)", 240);
  $("ptNoteB").textContent = `${fmt(sum(pt.browsers))} browsers, ${hrs(sum(pt.browserMinutes))} played, all time. Bars are equal width and as tall as the time played in the bracket; the brackets are not equal.`;
  if (!Array.isArray(pt.signedIn)) {
    $("ptAccounts").innerHTML = `<div class="sub">not deployed yet</div>`; $("ptNoteA").textContent = "";
    return;
  }
  renderBars("ptAccounts", pt.bins, pt.signedIn, pt.signedInMinutes, "accounts", "var(--plays)", 240);
  $("ptNoteA").textContent = `${fmt(sum(pt.signedIn))} accounts, ${hrs(sum(pt.signedInMinutes))} played while signed in, all time.`;
}

async function load() {
  try {
    const r = await fetch(URL_STATS, { cache: "no-store", headers: { Authorization: "Bearer " + key } });
    if (r.status === 401) { showUnlock(key ? "That key was refused." : ""); return; }
    if (r.status === 404) { showUnlock("The stats are off on this server (no admin key set)."); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    $("err").textContent = "";
    lastData = data; renderNow(data); renderToday(data); renderCities(data); renderLangs(data); renderPlaytime(data);
    if (JSON.stringify(data.days) !== JSON.stringify(days)) { days = data.days; renderChart(days); }
    $("upd").textContent = "Updated " + new Date().toISOString().slice(11, 19) + " UTC.";
  } catch (e) {
    $("err").textContent = "Could not reach the server (" + e.message + "). Trying again in 30 s.";
  }
}
function start() {
  $("app").hidden = false; $("unlock").hidden = true;
  load();
  clearInterval(timer); timer = setInterval(load, 30000);
}
fetch("cities.json").then((r) => r.json()).catch(() => ({})).then((c) => { CITY = c; if (key) start(); else showUnlock(""); });
</script>
