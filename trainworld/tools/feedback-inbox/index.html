<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trainworld feedback inbox</title>
<style>
:root {
  --bg: #0a0a0a; --panel: #111; --fg: #eee; --dim: #999; --faint: #555; --line: #2a2a2a;
  --unread: #8fd1a0; --mine: #8fb8e8; --bad: #e88;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 'Nunito', system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 15px; font-weight: 600; color: var(--dim); }
.sub { color: var(--dim); font-size: 13px; }
#err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 8px 0; }
button, select, textarea, input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); }
button { padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--faint); }
button.on { background: #222; border-color: var(--dim); }
input[type=password] { padding: 4px 8px; width: min(420px, 100%); }
select { padding: 3px 6px; }
textarea { display: block; width: 100%; padding: 8px; min-height: 80px; resize: vertical; }
#unlock { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--dim); }
#filters label { display: inline-flex; align-items: center; gap: 4px; }
#tags { display: flex; flex-wrap: wrap; gap: 4px; }
#tags button { font-size: 13px; }
#panes { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { #panes { grid-template-columns: minmax(0, 1fr); } }
#list { border-top: 1px solid var(--line); }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 4px; cursor: pointer; }
.row:hover, .row.sel { background: var(--panel); }
.row .top { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--dim); }
.row .who { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .age { margin-left: auto; white-space: nowrap; }
.row .first { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.row.closed .first { color: var(--dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--unread); flex: none; align-self: center; }
.tag { font-size: 12px; color: var(--dim); border: 1px solid var(--line); padding: 0 5px; white-space: nowrap; }
#thread { min-width: 0; }
#thread .empty { color: var(--faint); padding: 24px 0; }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.head .name { font-weight: 600; }
.head .actions { margin-left: auto; display: flex; gap: 6px; }
.msg { border-top: 1px solid var(--line); padding: 8px 0; }
.msg .meta { font-size: 13px; color: var(--dim); }
.msg.anita .meta b { color: var(--mine); font-weight: 600; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .tr { margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line); }
.msg .tr .note { margin: 0 0 2px; }
.trbtn { font-size: 12px; padding: 0 8px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 13px; margin: 10px 0; }
dt { color: var(--dim); }
dd { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow-y: auto; }
a { color: var(--mine); }
#shot img { display: block; max-width: 100%; border: 1px solid var(--line); margin-top: 8px; }
.note { font-size: 13px; color: var(--dim); margin: 8px 0; }
.bad { color: var(--bad); }
#reply { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
footer { margin-top: 36px; color: var(--faint); font-size: 12px; }
#tabs { display: flex; gap: 4px; margin-bottom: 10px; }
#ping { display: block; width: 100%; text-align: left; background: #2a1414; border: 1px solid var(--bad); color: var(--fg); padding: 6px 10px; margin-bottom: 10px; }
.count { background: var(--bad); color: #000; font-size: 12px; font-weight: 700; padding: 0 5px; margin-left: 5px; }
.share { border-top: 1px solid var(--line); padding: 12px 0; }
.share .head .name { overflow-wrap: anywhere; }
.share canvas { display: block; width: 100%; height: 460px; background: #fbf5ef; border: 1px solid var(--line); touch-action: none; cursor: grab; margin-top: 8px; }
.share .reasons { font-size: 13px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>trainworld feedback inbox</h1>
  <div id="err"></div>
  <form id="unlock" hidden>
    <input id="key" type="password" autocomplete="off" placeholder="Admin key" aria-label="Admin key">
    <button>Unlock</button>
    <span class="sub" id="keynote"></span>
  </form>
  <div id="app" hidden>
    <button type="button" id="ping" hidden></button>
    <div id="tabs" hidden>
      <button type="button" id="tabThreads" class="on">Feedback</button>
      <button type="button" id="tabCommunity">Community<span class="count" id="tabCount" hidden></span></button>
    </div>
    <div id="community" hidden>
      <div class="sub" id="commCount"></div>
      <div id="shares"></div>
    </div>
    <div id="threadsView">
    <div id="filters">
      <label><input type="checkbox" id="fUnread"> Unread only</label>
      <label>Status
        <select id="fStatus"><option value="open">Open</option><option value="closed">Closed</option><option value="all">All</option></select>
      </label>
      <div id="tags"></div>
    </div>
    <div class="sub" id="count"></div>
    <div id="panes" style="margin-top:8px">
      <div id="list"></div>
      <div id="thread"><div class="empty">Pick a thread.</div></div>
    </div>
    </div>
    <footer>Data from <span id="src"></span>. <span id="upd"></span> <a href="#" id="forget">Forget key</a></footer>
  </div>
</main>
<script>
"use strict";
// ?server=http://127.0.0.1:8083/ points the page at a local build of shonei-server. Only a local address:
// the page sends the admin key to it (T-2912).
const LOCAL_SERVER = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/;
const asked = new URLSearchParams(location.search).get("server");
const BASE = (asked && LOCAL_SERVER.test(asked) ? asked : "https://market.anita.garden/").replace(/\/?$/, "/");
const KEY_STORE = "twfeedback.adminKey";
const TAGS = { language: "Language", error: "Error", feature: "Feature request", feedback: "Feedback" };
const MAX_ROWS = 300;
const $ = (id) => document.getElementById(id);

function storedKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } }
function storeKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch { /* private window */ } }

// el builds DOM with textContent only: everything the players wrote is hostile input.
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

let key = storedKey(), rows = [], selected = location.hash.slice(1), tag = "all", current = null, shotURL = null;

async function api(method, path, body) {
  const r = await fetch(BASE + path, {
    method, cache: "no-store",
    headers: Object.assign({ Authorization: "Bearer " + key }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { showUnlock(key ? "That key was refused." : ""); throw new Error("key refused"); }
  if (r.status === 404 && path === "trainworld/inbox/threads") { showUnlock(""); throw new Error("the inbox is off on this server (no admin key set)"); }
  if (!r.ok) {
    let msg = "HTTP " + r.status;
    try { msg = (await r.json()).error || msg; } catch { /* not JSON */ }
    throw new Error(msg);
  }
  return r;
}

function showUnlock(note) {
  $("app").hidden = true; $("unlock").hidden = false; $("keynote").textContent = note;
}
function fail(e) { $("err").textContent = e.message || String(e); }

$("unlock").addEventListener("submit", (ev) => {
  ev.preventDefault();
  key = $("key").value.trim();
  if (!key) return;
  storeKey(key);
  $("key").value = "";
  $("unlock").hidden = true;
  start();
});
$("forget").addEventListener("click", (ev) => { ev.preventDefault(); storeKey(""); key = ""; showUnlock("Key forgotten on this browser."); });
$("fUnread").addEventListener("change", renderList);
$("fStatus").addEventListener("change", renderList);

const whoOf = (r) => r.accountName || r.name || "anon";
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  if (s < 86400 * 60) return Math.round(s / 86400) + " d";
  return new Date(t * 1000).toISOString().slice(0, 10);
}
const when = (t) => new Date(t * 1000).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });

function passes(r) {
  if ($("fUnread").checked && !r.unread) return false;
  const status = $("fStatus").value;
  if (status !== "all" && r.status !== status) return false;
  return tag === "all" || r.kind === tag;
}

function renderTags() {
  const seen = new Set(rows.map((r) => r.kind).filter((k) => !TAGS[k]));
  const names = Object.keys(TAGS).concat([...seen].sort());
  const box = $("tags");
  box.replaceChildren(...[["all", "All tags"], ...names.map((k) => [k, TAGS[k] || k])].map(([k, label]) =>
    el("button", { type: "button", class: k === tag ? "on" : "", text: label, onclick: () => { tag = k; renderTags(); renderList(); } })));
}

function renderList() {
  const shown = rows.filter(passes);
  $("count").textContent = `${shown.length} shown, ${rows.length} in all`;
  const list = $("list");
  list.replaceChildren(...shown.slice(0, MAX_ROWS).map((r) => {
    const top = el("div", { class: "top" },
      r.unread ? el("span", { class: "dot", title: r.unread + " unread" }) : null,
      el("span", { class: "tag", text: TAGS[r.kind] || r.kind }),
      el("span", { class: "who", text: whoOf(r) }),
      el("span", { class: "age", text: ago(r.updated) }));
    const first = el("div", { class: "first", text: r.broken ? "(this thread's file cannot be read)" : r.first || "(empty)" });
    return el("button", { type: "button", class: "row" + (r.id === selected ? " sel" : "") + (r.status === "closed" ? " closed" : ""), onclick: () => open(r.id) }, top, first);
  }));
  if (shown.length > MAX_ROWS) list.append(el("div", { class: "note", text: `${shown.length - MAX_ROWS} more. Narrow the filters to see them.` }));
}

async function loadList() {
  try {
    const r = await api("GET", "trainworld/inbox/threads");
    rows = (await r.json()).threads;
    $("app").hidden = false; $("unlock").hidden = true;
    $("err").textContent = "";
    $("upd").textContent = "Updated " + new Date().toISOString().slice(11, 19) + " UTC.";
    renderTags(); renderList();
  } catch (e) { fail(e); }
}

function detail(label, value) { return value ? [el("dt", { text: label }), el("dd", { text: value })] : []; }

function renderThread() {
  const t = current, box = $("thread");
  if (!t) { box.replaceChildren(el("div", { class: "empty", text: "Pick a thread." })); return; }
  const who = t.accountName ? t.accountName + " (account)" : t.name || "anon";
  const contact = t.contact || "";
  const mailable = /^\S+@\S+\.\S+$/.test(contact);
  const dl = el("dl");
  if (t.accountName && t.name) dl.append(...detail("name", t.name));
  if (t.account) dl.append(...detail("account id", t.account));
  if (contact) {
    dl.append(el("dt", { text: "email" }), el("dd", {},
      mailable ? el("a", { href: "mailto:" + encodeURIComponent(contact), text: contact }) : contact));
  }
  dl.append(...detail("sent", when(t.created)));
  const ctx = t.context || {};
  const first = ["version", "browser", "memory", "language", "lastFailure"];
  for (const k of first) dl.append(...detail(k === "lastFailure" ? "last failure" : k, ctx[k]));
  for (const k of Object.keys(ctx).sort()) if (!first.includes(k)) dl.append(...detail(k, ctx[k]));

  const actions = el("div", { class: "actions" },
    el("button", { type: "button", text: t.status === "open" ? "Close" : "Reopen", onclick: () => setStatus(t.id, t.status === "open" ? "closed" : "open") }),
    el("button", { type: "button", text: "Delete", onclick: askDelete }));
  const msgs = t.messages.map((m) => {
    const box = el("div", { class: "msg " + m.from },
      el("div", { class: "meta" }, el("b", { text: m.from === "anita" ? "Anita" : who }), "  " + when(m.at)),
      el("div", { class: "text", text: m.text }));
    if (m.from !== "anita") addTranslate(box, m.text);
    return box;
  });
  const reply = el("textarea", { id: "replyText", "aria-label": "Reply" });
  const send = el("button", { type: "button", text: "Send reply", onclick: () => sendReply(t.id, reply) });
  box.replaceChildren(...[
    el("div", { class: "head" }, el("span", { class: "tag", text: TAGS[t.kind] || t.kind }), el("span", { class: "name", text: who }), t.status === "closed" ? el("span", { class: "sub", text: "closed" }) : null, actions),
    dl, ...msgs,
    t.owner ? null : el("div", { class: "note", text: "No account or browser key: the player can't see a reply here. Email them if you want to answer." }),
    el("div", { id: "reply" }, reply, send),
    el("div", { id: "shot" }),
  ].filter(Boolean));
  if (t.shot) loadShot(t.id);
}

// ---- Translation (T-3031): Chrome's on-device LanguageDetector and Translator (Chrome 138+). Nothing leaves
// this machine. The first click per language downloads a model (Chrome shows no prompt; the note below the
// message counts the percent). Without the APIs, a link opens Google Translate with the text filled in.
const langName = (() => { try { const n = new Intl.DisplayNames(["en"], { type: "language" }); return (c) => { try { return n.of(c) || c; } catch { return c; } }; } catch { return (c) => c; } })();
const canTranslate = "Translator" in self && "LanguageDetector" in self;
const translated = new Map(); // text -> { lang, english }
let detectorP = null;
const detector = () => (detectorP ||= LanguageDetector.create().catch((e) => { detectorP = null; throw e; }));
const isEnglish = (l) => !l || l === "und" || l.split("-")[0] === "en";
const googleLink = (text) => "https://translate.google.com/?sl=auto&tl=en&op=translate&text=" + encodeURIComponent(text.slice(0, 1500));

async function detectLang(text) {
  const r = await (await detector()).detect(text);
  return r.length ? r[0].detectedLanguage : "und";
}
async function translateText(text, lang, note) {
  const hit = translated.get(text);
  if (hit) return hit.english;
  const opts = { sourceLanguage: lang, targetLanguage: "en" };
  const tr = await Translator.create({
    ...opts,
    monitor(m) { m.addEventListener("downloadprogress", (e) => { note.textContent = `Downloading the ${langName(lang)} model, ${Math.round(e.loaded * 100)}%`; }); },
  });
  const english = await tr.translate(text);
  translated.set(text, { lang, english });
  return english;
}

function addTranslate(box, text) {
  if (!text || !text.trim()) return;
  const slot = el("div", { class: "tr" });
  box.append(slot);
  const fallback = () => slot.replaceChildren(el("a", { href: googleLink(text), target: "_blank", rel: "noopener noreferrer", text: "Translate in Google Translate" }));
  if (!canTranslate) { fallback(); return; }
  const show = (lang, english) => slot.replaceChildren(
    el("div", { class: "note", text: `English, from ${langName(lang)}` }), el("div", { class: "text", text: english }));
  const run = async () => {
    const note = el("div", { class: "note", text: "Translating" });
    slot.replaceChildren(note);
    try {
      const lang = await detectLang(text);
      if (isEnglish(lang)) { slot.replaceChildren(el("div", { class: "note", text: "Looks like English" })); return; }
      const av = await Translator.availability({ sourceLanguage: lang, targetLanguage: "en" });
      if (av === "unavailable") { slot.replaceChildren(el("div", { class: "note", text: `Chrome can't translate ${langName(lang)} here. ` }, el("a", { href: googleLink(text), target: "_blank", rel: "noopener noreferrer", text: "Google Translate" }))); return; }
      show(lang, await translateText(text, lang, note));
    } catch (e) {
      slot.replaceChildren(el("div", { class: "note bad", text: "Translation failed: " + (e.message || e) + ". " }), el("a", { href: googleLink(text), target: "_blank", rel: "noopener noreferrer", text: "Google Translate" }));
    }
  };
  const button = () => slot.replaceChildren(el("button", { type: "button", class: "trbtn", text: "Translate", onclick: run }));
  // models already on this machine: detect and translate without a click; otherwise a button (a download needs a click)
  (async () => {
    try {
      const dav = await LanguageDetector.availability();
      if (dav === "unavailable") { fallback(); return; } // this Chrome cannot run the on-device model
      if (dav !== "available") { button(); return; }
      const hit = translated.get(text);
      const lang = hit ? hit.lang : await detectLang(text);
      if (isEnglish(lang)) return;
      if (hit) { show(lang, hit.english); return; }
      if ((await Translator.availability({ sourceLanguage: lang, targetLanguage: "en" })) === "available") await run(); else button();
    } catch { button(); }
  })();
}

async function loadShot(id) {
  try {
    const r = await api("GET", `trainworld/inbox/thread/${id}/shot`);
    const blob = await r.blob();
    if (!current || current.id !== id) return;
    if (shotURL) URL.revokeObjectURL(shotURL);
    shotURL = URL.createObjectURL(blob);
    $("shot").replaceChildren(el("div", { class: "note", text: "Screenshot" }), el("img", { src: shotURL, alt: "Screenshot the player attached" }));
  } catch (e) { fail(e); }
}

async function open(id) {
  selected = id;
  try { history.replaceState(null, "", "#" + id); } catch { /* fine */ }
  renderList();
  const row = rows.find((r) => r.id === id);
  if (row && row.broken) {
    current = null;
    $("thread").replaceChildren(el("div", { class: "note bad", text: "This thread's file cannot be read. It is kept on the server until you delete it." }),
      el("button", { type: "button", text: "Delete", onclick: askDelete }));
    return;
  }
  try {
    const r = await api("GET", `trainworld/inbox/thread/${id}`);
    current = await r.json();
    renderThread();
    if (current.unread) {
      await api("POST", `trainworld/inbox/thread/${id}/read`);
      if (row) row.unread = 0;
      current.unread = 0;
      renderList();
    }
  } catch (e) { fail(e); }
}

async function sendReply(id, box) {
  const text = box.value.trim();
  if (!text) return;
  try {
    const r = await api("POST", `trainworld/inbox/thread/${id}/reply`, { message: text });
    current = await r.json();
    renderThread();
    await loadList();
  } catch (e) { fail(e); }
}

async function setStatus(id, status) {
  try {
    const r = await api("POST", `trainworld/inbox/thread/${id}/status`, { status });
    current = await r.json();
    renderThread();
    await loadList();
  } catch (e) { fail(e); }
}

function askDelete() {
  const id = selected;
  const actions = el("div", { class: "note" },
    "Delete this thread and its screenshot for good? ",
    el("button", { type: "button", text: "Delete for good", onclick: () => doDelete(id) }), " ",
    el("button", { type: "button", text: "Keep it", onclick: () => renderOrClear() }));
  $("thread").prepend(actions);
}
function renderOrClear() { if (current) renderThread(); else open(selected); }

async function doDelete(id) {
  try {
    await api("DELETE", `trainworld/inbox/thread/${id}`);
    current = null; selected = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch { /* fine */ }
    renderThread();
    await loadList();
  } catch (e) { fail(e); }
}

// ---- Community (T-2887): shares players reported, the ping, Keep, Remove, Ban.
const INBOX_C = "trainworld/inbox/community/";
const DIR8 = Array.from({ length: 8 }, (_, k) => [Math.round(Math.cos(k * Math.PI / 4) * 1e9) / 1e9, Math.round(Math.sin(k * Math.PI / 4) * 1e9) / 1e9]);
let communityAvailable = false, showCommunity = false, askBan = "";

async function loadPending() {
  let p;
  try { p = await (await api("GET", INBOX_C + "pending")).json(); }
  catch { p = null; } // Community is off on this server, or it could not be reached
  communityAvailable = !!p;
  $("tabs").hidden = !p;
  if (!p) { $("ping").hidden = true; document.title = "trainworld feedback inbox"; if (showCommunity) setTab(false); return; }
  const n = p.reported + p.hidden;
  $("tabCount").hidden = !n;
  $("tabCount").textContent = n;
  $("ping").hidden = !n;
  $("ping").textContent = `Community: ${p.hidden} hidden by reports, ${p.reported} reported and still showing. Open`;
  document.title = (n ? `(${n}) ` : "") + "trainworld feedback inbox";
}

function setTab(community) {
  showCommunity = community;
  $("tabCommunity").classList.toggle("on", community);
  $("tabThreads").classList.toggle("on", !community);
  $("community").hidden = !community;
  $("threadsView").hidden = community;
  if (community) loadShares();
}
$("tabThreads").addEventListener("click", () => setTab(false));
$("tabCommunity").addEventListener("click", () => setTab(true));
$("ping").addEventListener("click", () => setTab(true));

// A plain painter for the drawing format (shonei-server's docs/trainworld-api.md); the game's own is diagram/draw.ts.
// Names go through fillText only: they are hostile input.
function paintShare(canvas, d, v) {
  const dpr = devicePixelRatio || 1, w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d"), scale = v.scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#fbf5ef";
  ctx.fillRect(0, 0, w, h);
  ctx.setTransform(scale, 0, 0, -scale, w / 2 - v.cx * scale, h / 2 + v.cy * scale);
  ctx.lineCap = ctx.lineJoin = "round";
  d.paths ??= d.lines.map((l) => {
    const p = new Path2D(), c = l.d;
    for (let i = 0; i < c.length;) {
      if (c[i] === 2) { p.quadraticCurveTo(c[i + 1], c[i + 2], c[i + 3], c[i + 4]); i += 5; }
      else { c[i] ? p.lineTo(c[i + 1], c[i + 2]) : p.moveTo(c[i + 1], c[i + 2]); i += 3; }
    }
    return p;
  });
  ctx.strokeStyle = "#fbf5ef"; ctx.lineWidth = d.pitch;
  d.paths.forEach((p) => ctx.stroke(p));
  ctx.lineWidth = Math.max(d.stroke, 1 / scale);
  d.paths.forEach((p, i) => { ctx.strokeStyle = d.lines[i].c; ctx.stroke(p); });
  if (d.pitch * scale >= 0.625) {
    const bar = (x0, y0, x1, y1, width, colour) => {
      ctx.strokeStyle = ctx.fillStyle = colour; ctx.lineWidth = width; ctx.beginPath();
      if (x0 === x1 && y0 === y1) { ctx.arc(x0, y0, width / 2, 0, 7); ctx.fill(); return; }
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    };
    const radius = (k) => (d.small[k] ? 0.5 : 0.95) * d.stroke, outline = (k) => (d.small[k] ? 0.24 : 0.32) * d.stroke;
    const each = (a, n, f) => { for (let i = 0; i + n <= a.length; i += n) f(i); };
    each(d.passages, 5, (i) => bar(d.passages[i], d.passages[i + 1], d.passages[i + 2], d.passages[i + 3], radius(d.passages[i + 4]) * 0.9 + 2 * outline(d.passages[i + 4]), "#2b2b2b"));
    each(d.pills, 6, (i) => bar(d.pills[i], d.pills[i + 1], d.pills[i + 2], d.pills[i + 3], 2 * (radius(d.pills[i + 5]) + outline(d.pills[i + 5]) + d.pills[i + 4]), "#2b2b2b"));
    each(d.passages, 5, (i) => bar(d.passages[i], d.passages[i + 1], d.passages[i + 2], d.passages[i + 3], radius(d.passages[i + 4]) * 0.9, "#fff"));
    each(d.pills, 6, (i) => bar(d.pills[i], d.pills[i + 1], d.pills[i + 2], d.pills[i + 3], 2 * (radius(d.pills[i + 5]) + d.pills[i + 4]), "#fff"));
  }
  const pitchPx = d.pitch * v.scale;
  let li = -1;
  while (li + 1 < d.levels.length && d.levels[li + 1] / 16 <= pitchPx) li++;
  if (li < 0) return;
  const L = d.at[li], s = scale / dpr, f = (d.fontPx / 16) * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `${f}px system-ui, sans-serif`; ctx.lineJoin = "round"; ctx.lineWidth = 3 * dpr;
  for (let i = 0; i < L.node.length; i++) {
    const [cx, cy] = DIR8[L.dir[i]], o = L.lift[i] + 3 / s, sx = w / 2 + (L.x[i] + cx * o - v.cx) * scale, sy = h / 2 - (L.y[i] + cy * o - v.cy) * scale;
    if (sx < -300 || sx > w + 300 || sy < -40 || sy > h + 40) continue;
    ctx.textAlign = cx > 0.3 ? "left" : cx < -0.3 ? "right" : "center";
    ctx.textBaseline = cy > 0.3 ? "bottom" : cy < -0.3 ? "top" : "middle";
    ctx.strokeStyle = "#fbf5ef"; ctx.strokeText(d.names[L.node[i]], sx, sy);
    ctx.fillStyle = "#2b2b2b"; ctx.fillText(d.names[L.node[i]], sx, sy);
  }
}

function fit(canvas, d) {
  const [x0, y0, x1, y1] = d.box, m = 20;
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, scale: Math.min((canvas.clientWidth - 2 * m) / Math.max(1, x1 - x0), (canvas.clientHeight - 2 * m) / Math.max(1, y1 - y0)) };
}

function viewer(canvas, d) {
  let v = fit(canvas, d), frame = 0, drag = null;
  const draw = () => { frame ||= requestAnimationFrame(() => { frame = 0; paintShare(canvas, d, v); }); };
  canvas.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    v.cx -= (e.clientX - drag[0]) / v.scale; v.cy += (e.clientY - drag[1]) / v.scale; drag = [e.clientX, e.clientY]; draw();
  });
  canvas.addEventListener("pointerup", () => { drag = null; });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left - r.width / 2, py = e.clientY - r.top - r.height / 2, f = Math.exp(-e.deltaY * 0.0015), next = Math.min(80 / d.pitch, Math.max(0.05 / d.pitch, v.scale * f));
    v.cx += px / v.scale - px / next; v.cy -= py / v.scale - py / next; v.scale = next; draw();
  }, { passive: false });
  draw();
}

async function shareAct(id, what) {
  try { await api("POST", `${INBOX_C}${id}/${what}`); askBan = ""; await Promise.all([loadShares(), loadPending()]); }
  catch (e) { fail(e); }
}

function shareRow(s) {
  const canvas = el("canvas", { "aria-label": "The shared network" });
  const counts = {};
  for (const r of s.reports) counts[r.reason] = (counts[r.reason] || 0) + 1;
  const reasons = Object.entries(counts).map(([r, n]) => `${n} ${r}`).join(", ") || "no reports";
  const last = s.reports.length ? "last " + ago(Math.max(...s.reports.map((r) => r.at))) + " ago" : "";
  const acts = askBan === s.id
    ? el("div", { class: "actions" }, el("span", { class: "sub", text: "Hide everything of theirs and stop them sharing?" }),
        el("button", { type: "button", text: "Ban account", onclick: () => shareAct(s.id, "ban") }),
        el("button", { type: "button", text: "Not now", onclick: () => { askBan = ""; loadShares(); } }))
    : el("div", { class: "actions" },
        el("button", { type: "button", text: "Keep", onclick: () => shareAct(s.id, "keep") }),
        el("button", { type: "button", text: "Remove", onclick: () => shareAct(s.id, "remove") }),
        el("button", { type: "button", text: "Ban", onclick: () => { askBan = s.id; loadShares(); } }));
  const box = el("div", { class: "share" },
    el("div", { class: "head" },
      s.hidden ? el("span", { class: "tag bad", text: "hidden" }) : el("span", { class: "tag", text: "showing" }),
      s.banned ? el("span", { class: "tag bad", text: "banned" }) : null,
      el("span", { class: "name", text: s.name || "(no name)" }),
      el("span", { class: "sub", text: [s.city, Math.round(s.points).toLocaleString("en-US") + " points", `${s.lines} lines`, `${s.stations} stations`, `${s.likes} like${s.likes === 1 ? "" : "s"}`, s.sandbox ? "sandbox" : ""].filter(Boolean).join(" · ") }),
      acts),
    el("div", { class: "reasons", text: `${reasons} ${last}` }),
    el("div", { class: "sub", text: `account ${s.account} · share ${s.id} rev ${s.rev}` }),
    canvas);
  api("GET", `${INBOX_C}${s.id}/${s.rev}`).then((r) => r.json()).then((d) => viewer(canvas, d)).catch(fail);
  return box;
}

async function loadShares() {
  try {
    const list = (await (await api("GET", INBOX_C + "reported")).json()).shares || [];
    $("commCount").textContent = list.length ? `${list.length} to look at` : "Nothing reported.";
    $("shares").replaceChildren(...list.map(shareRow));
  } catch (e) { fail(e); }
}

async function start() {
  if (!key) { showUnlock(""); return; }
  $("src").textContent = BASE.replace(/^https?:\/\//, "").replace(/\/$/, "");
  await loadList();
  await loadPending();
  if (selected && rows.some((r) => r.id === selected)) open(selected);
}
start();
setInterval(() => { if (key && !$("app").hidden) { loadList(); loadPending(); } }, 60000);
</script>
</body>
